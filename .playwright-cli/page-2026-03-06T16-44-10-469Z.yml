        - generic [ref=e46]:
          - paragraph [ref=e47]: Legal
          - heading "Privacy Policy" [level=1] [ref=e48]
          - paragraph [ref=e49]: How Tiny Steps Learning collects, uses, protects, and retains parent and child-related information across the website and learning platform.
          - generic [ref=e50]:
            - generic [ref=e51]: Parent data
            - generic [ref=e52]: Children ages 3–12
            - generic [ref=e53]: Last updated March 6, 2026
        - generic [ref=e55]:
          - paragraph [ref=e56]: "Last updated: March 6, 2026"
          - generic [ref=e57]:
            - heading "Information collected" [level=2] [ref=e58]
            - generic [ref=e59]:
              - paragraph [ref=e60]: Tiny Steps Learning collects information that parents or guardians choose to share when they book a free assessment, enquire about classes, enrol a child, or subscribe to our newsletter. This may include the parent or guardian name, email address, phone number or WhatsApp number, the child’s age, and the learning area the family is interested in such as phonics, grammar, reading, or public speaking.
              - paragraph [ref=e61]: Families may also share optional information to help us recommend the right course, including a child’s current reading, writing, or speaking level, school curriculum, preferred class timings, and learning goals. We collect this information only to personalise the learning experience and provide relevant follow-up.
              - paragraph [ref=e62]: Like most websites, we also collect limited technical information automatically, including IP address, browser type, device information, approximate location, referral pages, cookies, and similar analytics data so that we can understand how the site is used and improve performance.
          - generic [ref=e63]:
            - heading "Use of information" [level=2] [ref=e64]
            - generic [ref=e65]:
              - paragraph [ref=e66]: We use personal information to schedule assessments and classes, confirm enrolment, process payments, send lesson reminders, share progress updates, answer support questions, and improve the Tiny Steps learning experience.
              - paragraph [ref=e67]: If a parent subscribes to our newsletter or marketing updates, we may send emails, WhatsApp updates, offers, or educational content related to Tiny Steps programs. Families can opt out of marketing messages at any time by using the unsubscribe link in email messages or by contacting us directly.
              - paragraph [ref=e68]: We share information only with the Tiny Steps team members and trusted service providers who need it to deliver the service, such as teachers, learning partners, payment processors, email delivery tools, analytics providers, and secure hosting providers. We do not sell personal information to third parties.
          - generic [ref=e69]:
            - heading "Children’s privacy" [level=2] [ref=e70]
            - generic [ref=e71]:
              - paragraph [ref=e72]: Tiny Steps serves children ages 3–12, but we collect personal information only from a parent or legal guardian. We do not knowingly invite children to submit personal information directly through the website without parental involvement.
              - paragraph [ref=e73]: Child-related information is used only to deliver classes, maintain learning records, prepare progress reports, and support communication with the family. Our approach is designed to comply with the Indian Information Technology Act, 2000 and related rules, and to respect COPPA-style child privacy principles even when families access the service from outside India.
          - generic [ref=e74]:
            - heading "Cookies and analytics" [level=2] [ref=e75]
            - generic [ref=e76]:
              - paragraph [ref=e77]: The Tiny Steps website uses cookies and similar technologies, including Google Analytics, to understand traffic patterns, identify popular pages, improve content, and keep the website working smoothly.
              - paragraph [ref=e78]: Parents can control or disable cookies through browser settings. Please note that some features of the site may not work as intended if essential cookies are blocked.
          - generic [ref=e79]:
            - heading "Security and retention" [level=2] [ref=e80]
            - generic [ref=e81]:
              - paragraph [ref=e82]: We store information on secure systems and use reasonable technical and organisational safeguards to protect it. Data is encrypted in transit, access is limited to authorised staff and service providers, and we review systems regularly to reduce misuse or unauthorised access.
              - paragraph [ref=e83]: We keep personal data only for as long as it is needed to deliver classes, maintain records, comply with legal or financial obligations, resolve disputes, or improve service quality. Parents may request access to, correction of, or deletion of personal information at any time by emailing hello@tinystepslearning.com.
          - generic [ref=e84]:
            - heading "Contact and updates" [level=2] [ref=e85]
            - generic [ref=e86]:
              - paragraph [ref=e87]: For privacy questions or requests, please contact Tiny Steps Learning at hello@tinystepslearning.com or call +91-96183-98383. Business hours are Monday to Friday, 9:00 AM to 6:00 PM IST, and Saturday, 10:00 AM to 2:00 PM IST.
              - paragraph [ref=e88]: "We may update this Privacy Policy from time to time to reflect changes in our services, legal requirements, or operational practices. Any revised version will be posted on this page with an updated “Last updated” date. Last updated: March 6, 2026."
