<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4TPT04CQRL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);} 
    gtag('js', new Date());
  
    gtag('config', 'G-4TPT04CQRL');
  </script>

  <meta charset="utf-8"/>
  <!-- Enhanced Responsive & Touch-Optimized Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0, user-scalable=yes, viewport-fit=cover"/>
  <meta name="format-detection" content="telephone=no, date=no, email=no, address=no"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="HandheldFriendly" content="true"/>
  <title>Tiny Steps — Role Login</title>
  <meta name="robots" content="noindex,nofollow"/>
  <meta name="color-scheme" content="light"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/shared/responsive.css"/>
  <link rel="stylesheet" href="/roles/login.css"/>
</head>
<body>
  <main class="auth-card" role="main">
    <a class="brand" href="/" aria-label="Back to Tiny Steps">
      <span class="brand-logo">TS</span>
      <span class="brand-name">Tiny Steps</span>
    </a>

    <span class="role-pill" id="rolePill">Role access</span>
    <h1 id="pageTitle">Sign in</h1>
    <p class="lead" id="pageLead">Enter your User ID and password to continue.</p>

    <form id="loginForm" autocomplete="on" novalidate>
      <label for="userId">User ID or Email
        <input id="userId" name="userId" type="text" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="e.g. alex.rm or alex@example.com"/>
      </label>

      <label for="password">Password
        <input id="password" name="password" type="password" autocomplete="current-password" required/>
      </label>

      <button id="submitBtn" class="primary" type="submit">Sign in</button>
      <button id="resetBtn" class="link" type="button">Forgot password?</button>
    </form>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <p class="help-text">You’ll be redirected to: <span id="nextPath">/roles/parent/</span><br><span id="helpMessage">Need help? Contact support@tinystepslearning.com.</span></p>

    <nav class="role-switch" aria-label="Switch role login">
      <span>Need a different portal?</span>
      <a href="/roles/login.html?role=parent" data-role-link="parent">Parent</a>
      <a href="/roles/login.html?role=teacher" data-role-link="teacher">Teacher</a>
      <a href="/roles/login.html?role=rm" data-role-link="rm">RM</a>
      <a href="/roles/login.html?role=kid" data-role-link="kid">Kid</a>
    </nav>
  </main>

  <script type="module" src="/roles/login.js"></script>
</body>
</html>
