name: Temporary B3 teacher identity production audit

on:
  push:
    branches:
      - refactor/canonical-teacher-backfill
    paths:
      - scripts/audit-teacher-identity.mjs
      - .github/workflows/teacher-identity-b3-audit-temp.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: refactor/canonical-teacher-backfill

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TINYSTEPS_REACT_V1 }}
          create_credentials_file: true

      - name: Verify authenticated service account
        shell: bash
        run: |
          set -euo pipefail
          expected_account="github-action-1086722180@tinysteps-react-v1.iam.gserviceaccount.com"
          authenticated_account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          if [[ "${authenticated_account}" != "${expected_account}" ]]; then
            echo "::error::Expected Google Cloud account ${expected_account}, got ${authenticated_account:-<none>}."
            exit 1
          fi

      - name: Run bounded read-only teacher identity audit
        run: >-
          node scripts/audit-teacher-identity.mjs
          --project tinysteps-react-v1
          --limit 250
          --summary-only
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}
