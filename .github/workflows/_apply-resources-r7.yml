name: Apply Resources R7 Patch

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply-resources-r7.mjs'
      - '.github/workflows/_apply-resources-r7.yml'

permissions:
  contents: write

jobs:
  apply-r7:
    if: github.head_ref == 'seo/resources-r7-breadcrumb-aeo-geo'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Brick 7 integration patch
        run: node scripts/apply-resources-r7.mjs

      - name: Commit product integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ResourcesPage.tsx src/pages/SubjectResourcesPage.tsx src/pages/BlogPostPage.tsx
          if git diff --cached --quiet; then
            echo "No product patch to commit"
            exit 0
          fi
          git commit -m "feat(resources): integrate Brick 7 breadcrumb AEO GEO layer"
          git push origin HEAD:${{ github.head_ref }}
