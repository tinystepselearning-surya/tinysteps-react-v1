name: Temporary projection-backed topic resume patch

on:
  push:
    branches:
      - fix/teacher-topics-resume-last-saved

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/teacher-topics-resume-last-saved
          fetch-depth: 0

      - name: Apply projection-backed resume patch
        run: python scripts/tmp-refactor-topic-resume-projection.py

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/teacher/StudentTopicProgressEditorCanonicalV2.tsx
          git commit -m "refactor(teacher): use course projection for resume lesson"
          git push origin HEAD:fix/teacher-topics-resume-last-saved
