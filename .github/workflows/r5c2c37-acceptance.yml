name: R5C2C37 Wallet and Revenue Authorization Acceptance
on:
  push:
    branches:
      - wave1-r5c2c37-wallet-revenue-admin
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci --ignore-scripts && npm ci --prefix functions --include=dev
      - name: Focused canonical Admin and business regression
        run: npx vitest run --config functions/vitest.config.ts functions/test/canonicalAdminMilestone2C37Routing.spec.ts functions/test/canonicalAdminGuard.spec.ts functions/test/revenueAccrualSafety.spec.ts functions/test/teacherPayoutPeriod.spec.ts
      - name: Full Functions regression suite
        run: npm --prefix functions test
      - name: Functions TypeScript build
        run: npm --prefix functions run build
      - name: Focused lint
        run: cd functions && npx eslint src/wallet.ts src/revenue.ts test/canonicalAdminMilestone2C37Routing.spec.ts
      - name: Exact bounded Function dependency classification
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          baseline="$(git merge-base origin/main HEAD)"
          node scripts/resolve-deployment-impact.mjs --before "$baseline" --functions-before "$baseline" --sha "$GITHUB_SHA" | tee /tmp/impact.txt
          grep -q 'Functions deployment required: true' /tmp/impact.txt
          grep -q 'Functions full deployment: false' /tmp/impact.txt
          grep -q 'Functions impacted: 16' /tmp/impact.txt
          grep -Fq 'functions:getWalletAutomationConfig' /tmp/impact.txt
          grep -Fq 'functions:setWalletAutomationConfig' /tmp/impact.txt
          grep -Fq 'functions:previewMissingWalletDeductions' /tmp/impact.txt
          grep -Fq 'functions:backfillMissingWalletDeductions' /tmp/impact.txt
          grep -Fq 'functions:onBillingChargeWalletSync' /tmp/impact.txt
          grep -Fq 'functions:adminReceiveParentPayment' /tmp/impact.txt
          grep -Fq 'functions:adminTopupParentWallet' /tmp/impact.txt
          grep -Fq 'functions:adminAdjustParentWallet' /tmp/impact.txt
          grep -Fq 'functions:initParentWalletOpeningDeficit' /tmp/impact.txt
          grep -Fq 'functions:reconcileParentWallet' /tmp/impact.txt
          grep -Fq 'functions:recordPayment' /tmp/impact.txt
          grep -Fq 'functions:recordTeacherPayout' /tmp/impact.txt
          grep -Fq 'functions:previewFinanceCutoverArchive' /tmp/impact.txt
          grep -Fq 'functions:archiveFinanceRecordsThroughMonth' /tmp/impact.txt
          grep -Fq 'functions:reconcileSessionRevenueMonthKeys' /tmp/impact.txt
          grep -Fq 'functions:adminVoidSessionCharge' /tmp/impact.txt
          grep -q 'Hosting changed: false' /tmp/impact.txt
          grep -q 'Firestore rules changed: false' /tmp/impact.txt
          grep -q 'Firestore indexes changed: false' /tmp/impact.txt
