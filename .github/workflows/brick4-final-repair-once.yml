name: Brick 4 Final One-Time Repair

on:
  push:
    branches: [seo/brick-4-final]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: seo/brick-4-final
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Apply surgical Brick 4 repairs
        run: node scripts/brick4-final-repair-once.mjs

      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "SEO: repair Brick 4 dead and legacy URLs"
          git push origin HEAD:seo/brick-4-final
