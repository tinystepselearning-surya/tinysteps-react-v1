name: Temporary Balloon Pop Pedagogy Patch

on:
  push:
    branches:
      - feat/balloon-pop-pedagogy-ux
    paths:
      - .github/workflows/temp-balloon-pedagogy-patch.yml

permissions:
  contents: write

