name: Validate decoupled parent student creation

on:
  push:
    branches:
      - fix/decoupled-parent-student-create

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Build Functions TypeScript
        run: npm --prefix functions run build

      - name: Run focused identity tests
        run: npx vitest run --config functions/vitest.config.ts functions/test/canonicalPrimaryPlanner.spec.ts functions/test/canonicalPrimaryWriter.spec.ts
