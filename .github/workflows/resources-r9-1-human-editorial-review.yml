name: Resources R9.1 Prepublication Quality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phonics-prepublication-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run prepublication regressions
        run: npx vitest run src/tests/seo/resourcesR91PrepublicationQuality.spec.ts src/tests/seo/resourcesR91HumanEditorialReview.spec.ts
      - name: Audit phonics pre-publication quality gate
        run: node scripts/audit-phonics-prepublication-quality.mjs --report
