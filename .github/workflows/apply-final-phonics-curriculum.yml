name: Apply Final Phonics Curriculum

on:
  push:
    branches:
      - agent/phonics-curriculum-final-2026-08
    paths:
      - scripts/apply-final-phonics-curriculum.mjs
      - src/content/phonicsCurriculum.ts
      - src/content/phonicsCurriculum.spec.ts
      - .github/workflows/apply-final-phonics-curriculum.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phonics-curriculum-final-2026-08
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply scoped curriculum integration
        run: node scripts/apply-final-phonics-curriculum.mjs

      - name: Run canonical curriculum regression tests
        run: npm test -- src/content/phonicsCurriculum.spec.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit integrated files
        run: |
          if git diff --quiet; then
            echo "No generated integration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/content/courses.ts \
            src/components/teacher/StudentTopicProgressEditor.tsx \
            src/pages/teacher/components/today-sessions/AttendanceForm.tsx \
            src/pages/admin/StudentManagement/StudentList.tsx \
            src/pages/phonics.tsx \
            public/curriculum-v2.1.json
          git commit -m "Wire canonical phonics curriculum across app"
          git push origin HEAD:agent/phonics-curriculum-final-2026-08
