name: Wave 1 R5C2C14 Final Validation

on:
  push:
    branches:
      - wave1/identity-r5c2c14-teacher-finance-analytics-admin-20261007

permissions:
  contents: read

concurrency:
  group: wave1-r5c2c14-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root test dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Validate final C14 branch state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git diff --check origin/main...HEAD

          mapfile -t changed < <(git diff --name-only origin/main...HEAD | sort)
          printf '%s\n' "${changed[@]}"

          allowed=(
            ".github/workflows/wave1-r5c2c14-final-validation.yml"
            "docs/architecture/wave-1/IDENTITY_R5_BACKEND_AUTHORIZATION_CUTOVER_BRICKC.md"
            "docs/architecture/wave-1/migrations/identity-foundation-v1.json"
            "functions/src/prepareTeacherFinanceAnalyticsRollups.ts"
            "functions/test/canonicalAdminTeacherFinanceAnalyticsRouting.spec.ts"
          )
          for file in "${changed[@]}"; do
            ok=false
            for expected in "${allowed[@]}"; do
              if [[ "$file" == "$expected" ]]; then ok=true; break; fi
            done
            if [[ "$ok" != true ]]; then
              echo "Unexpected changed file: $file" >&2
              exit 1
            fi
          done

          node <<'NODE'
          const fs = require('fs');
          const ledger = JSON.parse(
            fs.readFileSync(
              'docs/architecture/wave-1/migrations/identity-foundation-v1.json',
              'utf8',
            ),
          );
          const slice = ledger.switchReads?.r5?.r5c?.r5c2?.slices?.r5c2c14;

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          assert(
            ledger.switchReads.status ===
              'r5c2c14_validation_complete_ready_for_production_merge',
            'Unexpected final R5C2C14 switchReads status.',
          );
          assert(
            ledger.switchReads.nextBrick ===
              'r5c2c14_production_merge_and_verification',
            'Unexpected final R5C2C14 nextBrick.',
          );
          assert(slice, 'R5C2C14 ledger slice is missing.');
          assert(slice.legacyFallback === false, 'Legacy fallback must remain disabled.');
          assert(slice.sharedAdminGuardModified === false, 'Shared legacy guard must remain untouched.');
          assert(slice.productionWiring === false, 'Production wiring must remain false pre-merge.');
          assert(slice.productionVerified === false, 'Production verification must remain false pre-deploy.');
          assert(slice.validationPending === false, 'Validation must be complete.');
          assert(slice.validation?.result === 'success', 'Recorded acceptance result must be success.');
          assert(slice.validation?.workflowRunId === 37665202385, 'Recorded acceptance run must remain run 37665202385.');
          assert(slice.dryRunDefaultPreserved === true, 'Dry-run default must be preserved.');
          assert(slice.authoritativeTeacherEarningsWrites === false, 'teacherEarnings must remain read-only.');
          assert(slice.derivedTeacherMonthRollupWritesOnly === true, 'Only derived teacher-month rollup writes are allowed.');
          assert(slice.maxDocsBoundPreserved === 10000, 'MAX_ALLOWED_DOCS must remain 10000.');
          assert(slice.readinessGatesPreserved === true, 'Readiness gates must be preserved.');
          assert(slice.projectionParityGatesPreserved === true, 'Projection parity gates must be preserved.');
          assert(
            Array.isArray(slice.functions)
              && slice.functions.length === 1
              && slice.functions[0] === 'prepareTeacherFinanceAnalyticsRollups',
            'R5C2C14 must contain exactly one Function.',
          );
          NODE

      - name: Focused lint
        working-directory: functions
        run: npx eslint src/prepareTeacherFinanceAnalyticsRollups.ts test/canonicalAdminTeacherFinanceAnalyticsRouting.spec.ts

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Run focused C14 regressions
        run: >
          npx vitest run
          --config functions/vitest.config.ts
          functions/test/prepareTeacherFinanceAnalyticsRollups.spec.ts
          functions/test/teacherFinanceAnalyticsProjection.spec.ts
          functions/test/teacherFinanceAnalyticsReadiness.spec.ts
          functions/test/canonicalAdminTeacherFinanceAnalyticsRouting.spec.ts
          functions/test/canonicalAdminGuardRouting.spec.ts

      - name: Run full Functions unit estate
        run: npx vitest run --config functions/vitest.config.ts

      - name: Run deployment classifier and contract tests
        run: node --test scripts/test/functions-impact.node-test.mjs scripts/test/functions-deployment.node-test.mjs

      - name: Resolve bounded deployment impact
        id: impact
        shell: bash
        run: >
          BASE_SHA="$(git merge-base origin/main HEAD)";
          node scripts/resolve-deployment-impact.mjs
          --before "${BASE_SHA}"
          --functions-before "${BASE_SHA}"
          --hosting-before "${BASE_SHA}"
          --firestore-rules-before "${BASE_SHA}"
          --firestore-indexes-before "${BASE_SHA}"
          --sha "${GITHUB_SHA}"

      - name: Enforce final R5C2C14 blast radius
        shell: bash
        env:
          FUNCTIONS_REQUIRED: ${{ steps.impact.outputs.functions_deployment_required }}
          FUNCTIONS_FULL: ${{ steps.impact.outputs.functions_full_deployment }}
          FUNCTIONS_TARGETS: ${{ steps.impact.outputs.functions_targets }}
          HOSTING_CHANGED: ${{ steps.impact.outputs.hosting_changed }}
          RULES_CHANGED: ${{ steps.impact.outputs.firestore_rules_changed }}
          INDEXES_CHANGED: ${{ steps.impact.outputs.firestore_indexes_changed }}
          SCHOOL_TRANSPORT: ${{ steps.impact.outputs.school_transport_required }}
          AVS_TRANSPORT: ${{ steps.impact.outputs.avs_transport_required }}
          LEAD_IAM: ${{ steps.impact.outputs.lead_iam_required }}
        run: |
          set -euo pipefail
          test "${FUNCTIONS_REQUIRED}" = "true"
          test "${FUNCTIONS_FULL}" = "false"
          test "${FUNCTIONS_TARGETS}" = "prepareTeacherFinanceAnalyticsRollups"
          test "${HOSTING_CHANGED}" = "false"
          test "${RULES_CHANGED}" = "false"
          test "${INDEXES_CHANGED}" = "false"
          test "${SCHOOL_TRANSPORT}" = "false"
          test "${AVS_TRANSPORT}" = "false"
          test "${LEAD_IAM}" = "false"
          echo "Final R5C2C14 branch state verified."
