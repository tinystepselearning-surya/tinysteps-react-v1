name: Audit rolling session health

on:
  push:
    branches:
      - audit/fix-upcoming-session-materialization
    paths:
      - .github/workflows/audit-rolling-session-health.yml
      - scripts/audit-rolling-session-health.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: tinysteps-react-v1
      AUDIT_ANCHOR_YMD: '2026-09-12'

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/fix-upcoming-session-materialization

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TINYSTEPS_REACT_V1 }}
          create_credentials_file: true

      - name: Run STRICTLY read-only Firestore audit
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}
        run: node scripts/audit-rolling-session-health.mjs
