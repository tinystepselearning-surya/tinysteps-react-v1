name: Apply least-privilege security hardening once

on:
  push:
    branches:
      - security/least-privilege-user-rbac
    paths:
      - .github/workflows/security-hardening-once.yml

permissions:
  contents: write

jobs:
  apply-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/least-privilege-user-rbac
          fetch-depth: 0

      - name: Verify and apply exact security patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --recount --check scripts/security-least-privilege.patch
          git apply --recount scripts/security-least-privilege.patch

      - name: Commit hardened application code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules .github/workflows/deploy.yml src/pages/messages/MessagesPanel.tsx src/pages/teacher/hooks/useTeacherStudents.ts src/hooks/useData.ts src/pages/parent/ParentDashboard.tsx
          git commit -m "security: enforce least-privilege user access"
          git push origin HEAD:security/least-privilege-user-rbac
