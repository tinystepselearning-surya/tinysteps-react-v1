name: Apply least-privilege security hardening once

on:
  push:
    branches:
      - security/least-privilege-user-rbac
    paths:
      - .github/workflows/security-hardening-once.yml

permissions:
  contents: write

jobs:
  apply-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/least-privilege-user-rbac
          fetch-depth: 0

      - name: Apply audited least-privilege patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) Firestore: teacher game access is assignment-scoped; user directory is least privilege.
          replace_once(
              'firestore.rules',
              """    function canAccessKid(kidId) {\n      return isAdmin()\n        || isTeacher()\n        || (\n""",
              """    function canAccessKid(kidId) {\n      return isAdmin()\n        || (isTeacher() && isTeacherOfKid(kidId))\n        || (\n""",
          )

          replace_once(
              'firestore.rules',
              """    function messageThreadDocPath(threadId) {\n""",
              """    function learningPartnerCanReadUser(data) {\n      return isLP()\n        && ('assignedLPs' in data)\n        && data.assignedLPs is list\n        && (request.auth.uid in data.assignedLPs);\n    }\n\n    function messageThreadDocPath(threadId) {\n""",
          )

          replace_once(
              'firestore.rules',
              """    match /users/{uid} {\n      // Preserve the existing broad internal-user lookup behaviour\n      // temporarily, but external School Admin users can only read\n      // their own user document.\n      //\n      // Brick 1 introduces the dedicated school tenant collections.\n      allow read: if isSignedIn()\n        && (\n          !isSchoolAdmin()\n          || request.auth.uid == uid\n        );\n\n      allow create, delete:\n        if isAdmin();\n\n      allow update:\n        if isAdmin()\n        || (\n          request.auth.uid == uid\n          && !touchesProtectedUserFields()\n        );\n    }\n""",
              """    match /users/{uid} {\n      // Least privilege: admins may use the full directory; everyone else gets\n      // only the profile records required for their own role workflow.\n      allow get: if isAdmin()\n        || (isSignedIn() && request.auth.uid == uid)\n        || learningPartnerCanReadUser(resource.data);\n\n      // Collection/list queries expose the directory and are admin-only.\n      allow list: if isAdmin();\n\n      allow create, delete:\n        if isAdmin();\n\n      allow update:\n        if isAdmin()\n        || (\n          request.auth.uid == uid\n          && !touchesProtectedUserFields()\n        );\n    }\n""",
          )

          # 2) Messages: non-admin participants use names/roles snapshotted on the thread.
          replace_once(
              'src/pages/messages/MessagesPanel.tsx',
              """  useEffect(() => {\n    if (!selectedThread) return;\n\n    const senderIds = messages.map((message) => message.senderId);\n""",
              """  useEffect(() => {\n    if (!selectedThread || !isAdmin) return;\n\n    const senderIds = messages.map((message) => message.senderId);\n""",
          )
          replace_once(
              'src/pages/messages/MessagesPanel.tsx',
              """  }, [\n    messages,\n""",
              """  }, [\n    isAdmin,\n    messages,\n""",
          )

          # 3) Teacher student list: derive parent labels only from teacher-authorized kid/enrollment snapshots.
          replace_once(
              'src/pages/teacher/hooks/useTeacherStudents.ts',
              """  const parentIds = new Set<string>();\n  const courseIds = new Set<string>();\n  kidDocs.forEach(({ data }) => {\n    const parentId =\n      data.primaryParentId ||\n      data.parentId ||\n      (Array.isArray(data.parentIds) ? data.parentIds[0] : null);\n    if (parentId) parentIds.add(String(parentId));\n  });\n""",
              """  const courseIds = new Set<string>();\n""",
          )
          replace_once(
              'src/pages/teacher/hooks/useTeacherStudents.ts',
              """  const parentById = new Map<string, { name?: string; email?: string }>();\n  await Promise.all(\n    Array.from(parentIds).map(async (pid) => {\n      const userSnap = await getDocLogged(\n        'useTeacherStudents:parent-user-by-id',\n        doc(db, 'users', pid),\n        { source: 'src/pages/teacher/hooks/useTeacherStudents.ts' },\n      );\n      if (userSnap.exists()) {\n        const u = userSnap.data() as any;\n        parentById.set(pid, { name: u.displayName || u.name, email: u.email });\n        return;\n      }\n      const parentSnap = await getDocLogged(\n        'useTeacherStudents:parent-doc-by-id',\n        doc(db, 'parents', pid),\n        { source: 'src/pages/teacher/hooks/useTeacherStudents.ts' },\n      );\n      if (parentSnap.exists()) {\n        const p = parentSnap.data() as any;\n        parentById.set(pid, { name: p.displayName || p.name, email: p.email });\n      }\n    })\n  );\n""",
              """  const parentById = new Map<string, { name?: string; email?: string }>();\n  const addParentSnapshot = (row: Record<string, unknown>) => {\n    const parentId = String(\n      row.primaryParentId ||\n      row.parentId ||\n      (Array.isArray(row.parentIds) ? row.parentIds[0] : '') ||\n      '',\n    ).trim();\n    if (!parentId) return;\n    const name = String(\n      row.parentDisplayName || row.parentName || row.guardianName || '',\n    ).trim();\n    const email = String(row.parentEmail || row.guardianEmail || '').trim();\n    const existing = parentById.get(parentId) || {};\n    parentById.set(parentId, {\n      name: name || existing.name,\n      email: email || existing.email,\n    });\n  };\n  kidDocs.forEach(({ data }) => addParentSnapshot(data as Record<string, unknown>));\n  enrollmentDocsById.forEach((enrollment) =>\n    addParentSnapshot(enrollment as Record<string, unknown>),\n  );\n""",
          )

          # 4) Parent generic enrollment hook: teacher display is an enrollment snapshot, never a /users read.
          replace_once(
              'src/hooks/useData.ts',
              """      const teacherIds = new Set<string>();\n\n""",
              """,
          )
          replace_once(
              'src/hooks/useData.ts',
              """        if ((enrollment as any).teacherId) teacherIds.add((enrollment as any).teacherId);\n""",
              """,
          )
          replace_once(
              'src/hooks/useData.ts',
              """      const [kidsMap, coursesMap, teachersMap] = await Promise.all([\n        batchFetch('kids', Array.from(allKidIds)),\n        batchFetch('courses', Array.from(courseIds)),\n        batchFetch('users', Array.from(teacherIds)),\n      ]);\n""",
              """      const [kidsMap, coursesMap] = await Promise.all([\n        batchFetch('kids', Array.from(allKidIds)),\n        batchFetch('courses', Array.from(courseIds)),\n      ]);\n""",
          )
          replace_once(
              'src/hooks/useData.ts',
              """        const course = enrAny.courseId ? coursesMap.get(enrAny.courseId) || null : null;\n        const teacher = enrAny.teacherId ? teachersMap.get(enrAny.teacherId) || null : null;\n\n        results.push({ id: docSnap.id, ...enrollment, kids, course, teacher });\n""",
              """        const course = enrAny.courseId ? coursesMap.get(enrAny.courseId) || null : null;\n        const teacherId = String(\n          enrAny.teacherId || enrAny.teacherUid || enrAny.teacherUserId || '',\n        ).trim();\n        const teacherName = String(\n          enrAny.teacherDisplayName || enrAny.teacherName || enrAny.assignedTeacherName || '',\n        ).trim();\n        const teacherEmail = String(enrAny.teacherEmail || '').trim();\n        const teacher = teacherId\n          ? {\n              uid: teacherId,\n              id: teacherId,\n              displayName: teacherName || 'Teacher',\n              name: teacherName || 'Teacher',\n              ...(teacherEmail ? { email: teacherEmail } : {}),\n            }\n          : null;\n\n        results.push({ id: docSnap.id, ...enrollment, kids, course, teacher });\n""",
          )

          # 5) Parent profile: use teacher identity snapshots already carried by enrollment/session records.
          replace_once(
              'src/pages/parent/ParentDashboard.tsx',
              """  documentId,\n""",
              """,
          )
          old_teacher_lookup = """  const teacherIdsForProfile = useMemo(() => {\n    const enrollments = (enrollmentsQuery.data ?? []) as Enrollment[];\n    const ids = new Set<string>();\n    enrollments.forEach((enr) => {\n      const candidate = String(\n        enr.teacherId ||\n          enr.teacherUid ||\n          enr.teacherUserId ||\n          (enr as any).teacher ||\n          \"\"\n      ).trim();\n      if (candidate) ids.add(candidate);\n    });\n    return Array.from(ids);\n  }, [enrollmentsQuery.data]);\n\n  const teacherLookupQuery = useQuery({\n    queryKey: [\"teacherLookup\", teacherIdsForProfile],\n    enabled: profileOpen && teacherIdsForProfile.length > 0,\n    staleTime: 10 * 60 * 1000,\n    refetchOnWindowFocus: false,\n    refetchOnMount: false,\n    queryFn: async () => {\n      const map: Record<string, { name: string; email?: string }> = {};\n      if (!teacherIdsForProfile.length) return map;\n      const usersCol = collection(db, \"users\");\n      const chunks = chunkIds(teacherIdsForProfile, 10);\n      for (const chunk of chunks) {\n        const snap = await getDocs(\n          query(usersCol, where(documentId(), \"in\", chunk))\n        );\n        snap.forEach((docSnap) => {\n          const data = docSnap.data() as any;\n          const name = String(\n            data?.displayName ||\n              data?.name ||\n              data?.fullName ||\n              data?.email ||\n              docSnap.id\n          ).trim();\n          map[docSnap.id] = {\n            name: name || \"Teacher\",\n            email: data?.email ? String(data.email).trim() : undefined,\n          };\n        });\n      }\n      return map;\n    },\n  });\n"""
          new_teacher_lookup = """  const teacherProfilesForProfile = useMemo(() => {\n    const map: Record<string, { name: string; email?: string }> = {};\n    ((enrollmentsQuery.data ?? []) as Enrollment[]).forEach((enr) => {\n      const teacherId = String(\n        enr.teacherId ||\n          enr.teacherUid ||\n          enr.teacherUserId ||\n          (enr as any).teacher ||\n          \"\"\n      ).trim();\n      if (!teacherId) return;\n      const name = String(\n        (enr as any).teacherDisplayName ||\n          (enr as any).teacherName ||\n          (enr as any).assignedTeacherName ||\n          \"\"\n      ).trim();\n      const email = String((enr as any).teacherEmail || \"\").trim();\n      const existing = map[teacherId];\n      map[teacherId] = {\n        name: name || existing?.name || \"Teacher\",\n        ...(email || existing?.email ? { email: email || existing?.email } : {}),\n      };\n    });\n    return map;\n  }, [enrollmentsQuery.data]);\n"""
          replace_once('src/pages/parent/ParentDashboard.tsx', old_teacher_lookup, new_teacher_lookup)
          replace_once(
              'src/pages/parent/ParentDashboard.tsx',
              """      const teacherProfile = teacherId ? teacherLookupQuery.data?.[teacherId] : undefined;\n""",
              """      const teacherProfile = teacherId ? teacherProfilesForProfile[teacherId] : undefined;\n""",
          )
          replace_once(
              'src/pages/parent/ParentDashboard.tsx',
              """  }, [enrollmentsQuery.data, selectedKidId, teacherLookupQuery.data, formatCourseLabel]);\n""",
              """  }, [enrollmentsQuery.data, selectedKidId, teacherProfilesForProfile, formatCourseLabel]);\n""",
          )

          # 6) Replace RBAC test with explicit least-privilege expectations.
          Path('src/tests/firestore/userRbac.rules.spec.ts').write_text(r'''// @vitest-environment node

import { readFileSync } from 'node:fs';
import { resolve } from 'node:path';
import {
  assertFails,
  assertSucceeds,
  initializeTestEnvironment,
  type RulesTestEnvironment,
} from '@firebase/rules-unit-testing';
import { collection, doc, getDoc, getDocs, setDoc, updateDoc } from 'firebase/firestore';
import { afterAll, afterEach, beforeAll, describe, expect, it } from 'vitest';

const emulatorHost = process.env.FIRESTORE_EMULATOR_HOST;
const suite = emulatorHost ? describe : describe.skip;
let testEnv: RulesTestEnvironment;

beforeAll(async () => {
  if (!emulatorHost) return;
  const [host, rawPort] = emulatorHost.split(':');
  testEnv = await initializeTestEnvironment({
    projectId: 'tinysteps-rbac-rules',
    firestore: {
      host,
      port: Number(rawPort || '8085'),
      rules: readFileSync(resolve(process.cwd(), 'firestore.rules'), 'utf8'),
    },
  });
});

afterAll(async () => testEnv?.cleanup());
afterEach(async () => testEnv?.clearFirestore());

async function seedUsers() {
  await testEnv.withSecurityRulesDisabled(async (context) => {
    const db = context.firestore();
    const rows: Record<string, Record<string, unknown>> = {
      'school-admin-1': { role: 'schoolAdmin', roles: ['schoolAdmin'], status: 'active' },
      'parent-1': { role: 'parent', roles: ['parent'], status: 'active' },
      'parent-2': { role: 'parent', roles: ['parent'], status: 'active', assignedLPs: ['lp-2'] },
      'teacher-1': { role: 'teacher', roles: ['teacher'], status: 'active', assignedLPs: ['lp-1'] },
      'teacher-2': { role: 'teacher', roles: ['teacher'], status: 'active' },
      'lp-1': { role: 'learningPartner', roles: ['learningPartner'], status: 'active' },
      'lp-2': { role: 'learningPartner', roles: ['learningPartner'], status: 'active' },
      'admin-1': { role: 'admin', roles: ['admin'], status: 'active' },
    };
    for (const [uid, data] of Object.entries(rows)) {
      await setDoc(doc(db, 'users', uid), {
        uid,
        displayName: uid,
        email: `${uid}@example.com`,
        ...data,
      });
    }
  });
}

suite('users RBAC rules', () => {
  it('allows each signed-in role to read its own user document only', async () => {
    await seedUsers();
    for (const [uid, role] of [
      ['school-admin-1', 'schoolAdmin'],
      ['parent-1', 'parent'],
      ['teacher-1', 'teacher'],
      ['lp-1', 'learningPartner'],
    ] as const) {
      const db = testEnv.authenticatedContext(uid, { role }).firestore();
      await assertSucceeds(getDoc(doc(db, 'users', uid)));
    }
  });

  it('blocks parents and teachers from reading unrelated user profiles or listing the directory', async () => {
    await seedUsers();
    const parentDb = testEnv.authenticatedContext('parent-1', { role: 'parent' }).firestore();
    const teacherDb = testEnv.authenticatedContext('teacher-1', { role: 'teacher' }).firestore();

    await assertFails(getDoc(doc(parentDb, 'users', 'teacher-1')));
    await assertFails(getDoc(doc(parentDb, 'users', 'admin-1')));
    await assertFails(getDocs(collection(parentDb, 'users')));

    await assertFails(getDoc(doc(teacherDb, 'users', 'parent-1')));
    await assertFails(getDoc(doc(teacherDb, 'users', 'teacher-2')));
    await assertFails(getDocs(collection(teacherDb, 'users')));
  });

  it('allows a learning partner to get only explicitly assigned user profiles, never list users', async () => {
    await seedUsers();
    const lpDb = testEnv.authenticatedContext('lp-1', { role: 'learningPartner' }).firestore();
    await assertSucceeds(getDoc(doc(lpDb, 'users', 'teacher-1')));
    await assertFails(getDoc(doc(lpDb, 'users', 'parent-2')));
    await assertFails(getDoc(doc(lpDb, 'users', 'teacher-2')));
    await assertFails(getDocs(collection(lpDb, 'users')));
  });

  it('allows admins to read arbitrary profiles and list the directory', async () => {
    await seedUsers();
    const adminDb = testEnv.authenticatedContext('admin-1', { role: 'admin' }).firestore();
    await assertSucceeds(getDoc(doc(adminDb, 'users', 'parent-1')));
    const snap = await assertSucceeds(getDocs(collection(adminDb, 'users')));
    expect(snap.size).toBeGreaterThan(1);
  });

  it('allows safe profile self-updates but blocks authorization escalation', async () => {
    await seedUsers();
    const parentDb = testEnv.authenticatedContext('parent-1', { role: 'parent' }).firestore();
    const userRef = doc(parentDb, 'users', 'parent-1');
    await assertSucceeds(updateDoc(userRef, { displayName: 'Updated Parent' }));

    for (const patch of [
      { role: 'admin' },
      { rawRole: 'admin' },
      { roles: ['admin'] },
      { superUser: true },
      { permissions: ['admin'] },
      { status: 'archived' },
      { assignedLPs: ['admin-1'] },
      { assignedParents: ['admin-1'] },
      { assignedTeachers: ['admin-1'] },
      { assignedKids: ['admin-1'] },
      { childIds: ['admin-1'] },
    ]) {
      await assertFails(updateDoc(userRef, patch));
    }
  });

  it('still allows admins to manage protected user fields', async () => {
    await seedUsers();
    const adminDb = testEnv.authenticatedContext('admin-1', { role: 'admin' }).firestore();
    await assertSucceeds(updateDoc(doc(adminDb, 'users', 'parent-1'), {
      roles: ['parent'],
      status: 'archived',
    }));
  });

  it('accepts legacy School Admin token alias for self access', async () => {
    await seedUsers();
    const db = testEnv.authenticatedContext('school-admin-1', { role: 'school-admin' }).firestore();
    const snap = await assertSucceeds(getDoc(doc(db, 'users', 'school-admin-1')));
    expect(snap.exists()).toBe(true);
  });
});
''')

          # 7) Dedicated game-data relationship tests.
          Path('src/tests/firestore/kidGameRbac.rules.spec.ts').write_text(r'''// @vitest-environment node

import { readFileSync } from 'node:fs';
import { resolve } from 'node:path';
import {
  assertFails,
  assertSucceeds,
  initializeTestEnvironment,
  type RulesTestEnvironment,
} from '@firebase/rules-unit-testing';
import { doc, getDoc, setDoc } from 'firebase/firestore';
import { afterAll, afterEach, beforeAll, describe, it } from 'vitest';

const emulatorHost = process.env.FIRESTORE_EMULATOR_HOST;
const suite = emulatorHost ? describe : describe.skip;
let testEnv: RulesTestEnvironment;

beforeAll(async () => {
  if (!emulatorHost) return;
  const [host, rawPort] = emulatorHost.split(':');
  testEnv = await initializeTestEnvironment({
    projectId: 'tinysteps-kid-game-rbac',
    firestore: {
      host,
      port: Number(rawPort || '8085'),
      rules: readFileSync(resolve(process.cwd(), 'firestore.rules'), 'utf8'),
    },
  });
});

afterAll(async () => testEnv?.cleanup());
afterEach(async () => testEnv?.clearFirestore());

async function seed() {
  await testEnv.withSecurityRulesDisabled(async (context) => {
    const db = context.firestore();
    for (const [uid, role] of [
      ['teacher-a', 'teacher'],
      ['teacher-b', 'teacher'],
      ['parent-a', 'parent'],
      ['parent-b', 'parent'],
      ['admin-a', 'admin'],
    ] as const) {
      await setDoc(doc(db, 'users', uid), { uid, role, status: 'active' });
    }
    await setDoc(doc(db, 'kids', 'kid-a'), {
      parentIds: ['parent-a'],
      primaryParentId: 'parent-a',
      teacherId: 'teacher-a',
      teacherIds: ['teacher-a'],
    });
    await setDoc(doc(db, 'kids', 'kid-b'), {
      parentIds: ['parent-b'],
      primaryParentId: 'parent-b',
      teacherId: 'teacher-b',
      teacherIds: ['teacher-b'],
    });
    for (const kidId of ['kid-a', 'kid-b']) {
      await setDoc(doc(db, 'kids', kidId, 'gameProgress', 'letter-tracing'), { score: 1 });
      await setDoc(doc(db, 'kids', kidId, 'gameSummaries', 'letter-tracing'), { score: 1 });
      await setDoc(doc(db, 'kids', kidId, 'activity', 'head'), { updatedAtMs: 1 });
      await setDoc(doc(db, 'kids', kidId, 'gameSessions', 'session-1'), {
        createdByUid: kidId === 'kid-a' ? 'teacher-a' : 'teacher-b',
      });
    }
  });
}

suite('kid game RBAC rules', () => {
  it('allows an assigned teacher to read/write permitted game data for their own student', async () => {
    await seed();
    const db = testEnv.authenticatedContext('teacher-a', { role: 'teacher' }).firestore();
    await assertSucceeds(getDoc(doc(db, 'kids', 'kid-a', 'gameProgress', 'letter-tracing')));
    await assertSucceeds(getDoc(doc(db, 'kids', 'kid-a', 'gameSummaries', 'letter-tracing')));
    await assertSucceeds(getDoc(doc(db, 'kids', 'kid-a', 'activity', 'head')));
    await assertSucceeds(getDoc(doc(db, 'kids', 'kid-a', 'gameSessions', 'session-1')));
    await assertSucceeds(setDoc(doc(db, 'kids', 'kid-a', 'gameProgress', 'new-progress'), { score: 2 }));
    await assertSucceeds(setDoc(doc(db, 'kids', 'kid-a', 'gameSessions', 'teacher-created'), {
      createdByUid: 'teacher-a',
      gameId: 'letter-tracing',
    }));
  });

  it('blocks a teacher from another teacher student game data', async () => {
    await seed();
    const db = testEnv.authenticatedContext('teacher-a', { role: 'teacher' }).firestore();
    await assertFails(getDoc(doc(db, 'kids', 'kid-b', 'gameProgress', 'letter-tracing')));
    await assertFails(getDoc(doc(db, 'kids', 'kid-b', 'gameSummaries', 'letter-tracing')));
    await assertFails(getDoc(doc(db, 'kids', 'kid-b', 'activity', 'head')));
    await assertFails(getDoc(doc(db, 'kids', 'kid-b', 'gameSessions', 'session-1')));
    await assertFails(setDoc(doc(db, 'kids', 'kid-b', 'gameProgress', 'blocked'), { score: 2 }));
    await assertFails(setDoc(doc(db, 'kids', 'kid-b', 'gameSessions', 'blocked'), {
      createdByUid: 'teacher-a',
    }));
  });

  it('keeps parent access scoped to their own child', async () => {
    await seed();
    const db = testEnv.authenticatedContext('parent-a', { role: 'parent' }).firestore();
    await assertSucceeds(getDoc(doc(db, 'kids', 'kid-a', 'gameProgress', 'letter-tracing')));
    await assertFails(getDoc(doc(db, 'kids', 'kid-b', 'gameProgress', 'letter-tracing')));
  });

  it('rejects forged game-session ownership even for an assigned teacher', async () => {
    await seed();
    const db = testEnv.authenticatedContext('teacher-a', { role: 'teacher' }).firestore();
    await assertFails(setDoc(doc(db, 'kids', 'kid-a', 'gameSessions', 'forged'), {
      createdByUid: 'teacher-b',
    }));
  });

  it('preserves admin access', async () => {
    await seed();
    const db = testEnv.authenticatedContext('admin-a', { role: 'admin' }).firestore();
    await assertSucceeds(getDoc(doc(db, 'kids', 'kid-a', 'gameProgress', 'letter-tracing')));
    await assertSucceeds(getDoc(doc(db, 'kids', 'kid-b', 'gameProgress', 'letter-tracing')));
  });
});
''')

