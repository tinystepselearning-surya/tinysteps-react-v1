name: Temporary Balloon Pop Fullscreen Patch

on:
  push:
    branches:
      - feat/balloon-pop-immersive-fullscreen
    paths:
      - .github/workflows/temp-balloon-fullscreen-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/balloon-pop-immersive-fullscreen
          fetch-depth: 0

      - name: Enable immersive fullscreen on the public Balloon Pop page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/pages/public/FreeBalloonPopGamePage.tsx')
          text = page.read_text()
          old = '''            showTopBackButton={false}\n            disableFullscreen\n          />'''
          new = '''            showTopBackButton={false}\n          />'''
          if text.count(old) != 1:
              raise SystemExit(f'public fullscreen opt-out: expected 1 match, found {text.count(old)}')
          page.write_text(text.replace(old, new, 1))

          test = Path('src/tests/pages/public/FreeBalloonPopGamePage.spec.tsx')
          text = test.read_text()
          old_mock = '''vi.mock('../../../pages/KidsBalloonPop', () => ({\n  default: () => <div data-testid="balloon-pop-game">Balloon Pop Game</div>,\n}));'''
          new_mock = '''vi.mock('../../../pages/KidsBalloonPop', () => ({\n  default: (props: { disableFullscreen?: boolean }) => (\n    <div\n      data-testid="balloon-pop-game"\n      data-disable-fullscreen={String(Boolean(props.disableFullscreen))}\n    >\n      Balloon Pop Game\n    </div>\n  ),\n}));'''
          if text.count(old_mock) != 1:
              raise SystemExit(f'game mock: expected 1 match, found {text.count(old_mock)}')
          text = text.replace(old_mock, new_mock, 1)

          old_assert = '''    expect(screen.getByTestId('balloon-pop-game')).toBeInTheDocument();'''
          new_assert = '''    expect(screen.getByTestId('balloon-pop-game')).toBeInTheDocument();\n    expect(screen.getByTestId('balloon-pop-game')).toHaveAttribute('data-disable-fullscreen', 'false');'''
          if text.count(old_assert) != 1:
              raise SystemExit(f'fullscreen assertion: expected 1 match, found {text.count(old_assert)}')
          test.write_text(text.replace(old_assert, new_assert, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/public/FreeBalloonPopGamePage.tsx src/tests/pages/public/FreeBalloonPopGamePage.spec.tsx
          git commit -m "feat: enable immersive fullscreen for public Balloon Pop"
          git push origin HEAD:feat/balloon-pop-immersive-fullscreen