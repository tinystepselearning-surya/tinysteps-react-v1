name: R5C2C35 LP and Roles Acceptance
on:
  push:
    branches:
      - wave1-r5c2c35-admin-roles-lp-canonical
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci --ignore-scripts && npm ci --prefix functions --include=dev
      - name: LP, role and access regressions
        run: >
          npx vitest run --config functions/vitest.config.ts
          functions/test/canonicalAdminAssignmentRoleBatchRouting.spec.ts
          functions/test/canonicalAdminAccountMutationRouting.spec.ts
          functions/test/canonicalAdminGuard.spec.ts
          functions/test/authAccessReadModelMaintenanceRouting.spec.ts
      - name: Full Functions regression suite
        run: npm --prefix functions test
      - name: Functions TypeScript build
        run: npm --prefix functions run build
      - name: Focused lint
        run: >
          cd functions && npx eslint
          src/assignLP.ts
          src/adminSetUserRoleCanonical.ts
          test/canonicalAdminAssignmentRoleBatchRouting.spec.ts
          test/canonicalAdminAccountMutationRouting.spec.ts
      - name: Exact five-Function impact
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          baseline="$(git merge-base origin/main HEAD)"
          node scripts/resolve-deployment-impact.mjs --before "$baseline" --functions-before "$baseline" --sha "$GITHUB_SHA" | tee /tmp/impact.txt
          grep -q 'Functions deployment required: true' /tmp/impact.txt
          grep -q 'Functions full deployment: false' /tmp/impact.txt
          grep -q 'Functions impacted: 5' /tmp/impact.txt
          grep -q 'functions:assignLPToParent' /tmp/impact.txt
          grep -q 'functions:unassignLPFromParent' /tmp/impact.txt
          grep -q 'functions:assignLPToTeacher' /tmp/impact.txt
          grep -q 'functions:unassignLPFromTeacher' /tmp/impact.txt
          grep -q 'functions:adminSetUserRole' /tmp/impact.txt
          grep -q 'Hosting changed: false' /tmp/impact.txt
          grep -q 'Firestore rules changed: false' /tmp/impact.txt
          grep -q 'Firestore indexes changed: false' /tmp/impact.txt
