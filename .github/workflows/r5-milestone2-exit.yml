name: Milestone 2 Canonical Admin Exit Preflight
on:
  push:
    branches:
      - wave1-r5-milestone2-exit-gate
permissions:
  contents: read
jobs:
  exit-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci --ignore-scripts && npm ci --prefix functions --include=dev
      - name: Six-slice production ledger and pending closeout gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const j=JSON.parse(fs.readFileSync('docs/architecture/wave-1/migrations/identity-foundation-v1.json','utf8'));
          const slices=j.switchReads.r5.r5c.r5c2.slices;
          const expected={33:2,34:4,35:5,36:10,37:16,38:14};
          for(const [num,count] of Object.entries(expected)){
            const key='r5c2c'+num;
            const s=slices[key];
            const d=s?.productionDeployment;
            if(!s?.productionVerified || s.legacyFallback!==false ||
                s.authorizationSource!=='authAccessReadModels/{firebaseUid}' ||
                s.validation?.result!=='success' ||
                d?.result!=='success' ||
                d.functionsDeployed!==count ||
                d.functionsVerified!==count ||
                d.functionsCheckpointReady!==count ||
                !d.functionsProductionMarkerAdvanced ||
                d.functionsFullDeployment!==false ||
                d.hostingDeployed!==false ||
                d.firestoreRulesDeployed!==false ||
                d.firestoreIndexesDeployed!==false) throw new Error('Invalid production evidence: '+key);
          }
          const m=j.switchReads.r5.r5c.milestone2;
          if(m?.status!=='exit_audit_pending' ||
             m?.finalExitGate!=='pending' ||
             m.remainingLegacyGuardModulesAfterC38CodeMerge!==0 ||
             m.remainingLegacyGuardCallSitesAfterC38CodeMerge!==0 ||
             m.totalLegacyAdminGuardSitesMigratedAcrossMilestone2!==44 ||
             m.deployedFunctionRootsAcrossBatches!==51 ||
             m.sharedLegacyAdminGuardModified!==false ||
             m.lastProductionCommit!=='81af741aef78ea3d8e3cac66e548455ce3a9b43f' ||
             j.switchReads.r5.r5c.firestoreRulesCutover!==false ||
             j.switchReads.r5.r5c.storageRulesCutover!==false) throw new Error('Milestone 2 closeout contract not satisfied');
          console.log('Six production slices C33-C38 checkpoint-ready; Milestone 2 exit awaiting final CI green');
          NODE
      - name: Permanent no-legacy-guard and cross-batch focused tests
        run: >
          npx vitest run --config functions/vitest.config.ts
          functions/test/canonicalAdminMilestone2Exit.spec.ts
          functions/test/canonicalAdminMilestone2C36Routing.spec.ts
          functions/test/canonicalAdminMilestone2C37Routing.spec.ts
          functions/test/canonicalAdminMilestone2C38Routing.spec.ts
          functions/test/canonicalAdminLearnerMutationRouting.spec.ts
          functions/test/canonicalAdminGuard.spec.ts
      - name: Browser identity hardening regression
        run: npx vitest run src/tests/functions/wave1IdentityAuthorizationHardening.spec.ts
      - name: Full Functions regression suite
        run: npm --prefix functions test
      - name: Functions TypeScript build
        run: npm --prefix functions run build
      - name: Focused lint
        run: cd functions && npx eslint test/canonicalAdminMilestone2Exit.spec.ts
      - name: Documentation and test-only deployment classification
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          baseline="$(git merge-base origin/main HEAD)"
          node scripts/resolve-deployment-impact.mjs --before "$baseline" --functions-before "$baseline" --sha "$GITHUB_SHA" | tee /tmp/impact.txt
          grep -q 'Functions deployment required: false' /tmp/impact.txt
          grep -q 'Hosting changed: false' /tmp/impact.txt
          grep -q 'Firestore rules changed: false' /tmp/impact.txt
          grep -q 'Firestore indexes changed: false' /tmp/impact.txt
