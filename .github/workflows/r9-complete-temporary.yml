name: R9 Complete Temporary

on:
  push:
    branches:
      - seo/resources-r9-programmatic-seo-pilot

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/resources-r9-programmatic-seo-pilot
          fetch-depth: 0
      - name: Apply Brick 9 integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, count))

          # React route: one controlled dynamic route resolves only explicit R9 approvals.
          replace('src/app/routes.tsx',
              "const SubjectResourcesPage = lazy(() => import('../pages/SubjectResourcesPage'));\n",
              "const SubjectResourcesPage = lazy(() => import('../pages/SubjectResourcesPage'));\nconst PhonicsKnowledgePage = lazy(() => import('../pages/PhonicsKnowledgePage'));\n")
          replace('src/app/routes.tsx',
              "        { path: 'resources/phonics', element: <SubjectResourcesPage subject=\"phonics\" /> },\n",
              "        { path: 'resources/phonics', element: <SubjectResourcesPage subject=\"phonics\" /> },\n        { path: 'resources/phonics/:slug', element: <PhonicsKnowledgePage /> },\n")

          # Public manifest uses the explicit R9 approval registry, never all R8 candidates.
          replace('src/lib/publicRouteManifest.js',
              "const route = (path, group, {\n",
              "import { PHONICS_PROGRAMMATIC_PILOT_PATHS } from './phonicsProgrammaticPilot.js';\n\nconst route = (path, group, {\n")
          replace('src/lib/publicRouteManifest.js',
              "  route('/resources/phonics', 'static'),\n",
              "  route('/resources/phonics', 'static'),\n  ...PHONICS_PROGRAMMATIC_PILOT_PATHS.map((path) => route(path, 'static')),\n")

          # SEO registry consumes only explicitly approved R9 page metadata.
          replace('src/lib/routeSeoRegistry.js',
              "import { PUBLIC_COURSE_PAGE_CONFIGS } from './publicCoursePages.js';\n",
              "import { PUBLIC_COURSE_PAGE_CONFIGS } from './publicCoursePages.js';\nimport { PHONICS_PROGRAMMATIC_PILOT_SEO } from './phonicsProgrammaticPilot.js';\n")
          replace('src/lib/routeSeoRegistry.js',
              "export const ROUTE_SEO_REGISTRY = {\n",
              "export const ROUTE_SEO_REGISTRY = {\n  ...PHONICS_PROGRAMMATIC_PILOT_SEO,\n")

          # R5 ownership: each approved granular page owns one narrow informational skill intent.
          p = Path('src/lib/canonicalTopicOwnershipRegistry.js')
          text = p.read_text()
          if "phonicsProgrammaticPilot.js" not in text:
              text = "import { PHONICS_PROGRAMMATIC_PILOT_PAGES } from './phonicsProgrammaticPilot.js';\n\n" + text
          marker = "\n]);\n\nexport const CANONICAL_TOPIC_OWNERS_BY_ID"
          if marker not in text:
              raise SystemExit('canonical registry closing marker not found')
          insert = "\n  ...PHONICS_PROGRAMMATIC_PILOT_PAGES.map((page) => topic(page.topicId, {\n    subject: 'phonics-reading',\n    intent: 'informational',\n    ownerPath: page.path,\n    ownerRole: 'skill-guide',\n    hubPath: '/resources/phonics',\n    queryIntent: page.concept.searchIntent,\n    supportingPaths: [...new Set(['/resources/phonics', ...page.concept.supportingPaths])],\n    forbiddenCompetingOwners: [],\n  })),"
          text = text.replace(marker, insert + marker, 1)
          p.write_text(text)

          # R7 hierarchy/AEO context extends truthfully to approved granular phonics routes.
          replace('src/lib/breadcrumbAeoGeoRegistry.js',
              "  if (RESOURCE_PATH_LABELS[path]) {\n",
              "  if (path.startsWith('/resources/phonics/')) {\n    const currentName = String(title || 'Phonics guide').trim() || 'Phonics guide';\n    return freezeTrail([\n      home,\n      { name: 'Resources', path: '/resources' },\n      { name: RESOURCE_PATH_LABELS['/resources/phonics'], path: '/resources/phonics' },\n      { name: currentName, path },\n    ]);\n  }\n\n  if (RESOURCE_PATH_LABELS[path]) {\n")
          replace('src/lib/breadcrumbAeoGeoRegistry.js',
              "  const subject = path.startsWith('/blog/') ? subjectForBlogPath(path, category) : null;\n",
              "  const subject = path.startsWith('/resources/phonics/')\n    ? 'phonics-reading'\n    : path.startsWith('/blog/')\n      ? subjectForBlogPath(path, category)\n      : null;\n")

          # Make the approved pilot discoverable from the phonics subject hub.
          replace('src/pages/SubjectResourcesPage.tsx',
              "import KnowledgeBreadcrumbs from '../components/common/KnowledgeBreadcrumbs';\n",
              "import KnowledgeBreadcrumbs from '../components/common/KnowledgeBreadcrumbs';\nimport PhonicsPilotGuideGrid from '../components/resources/PhonicsPilotGuideGrid';\n")
          replace('src/pages/SubjectResourcesPage.tsx',
              "        </section>\n\n        <section className=\"border-y border-slate-200 bg-white/88\">\n",
              "        </section>\n\n        <PhonicsPilotGuideGrid />\n\n        <section className=\"border-y border-slate-200 bg-white/88\">\n")

          # R5 audit: subject hubs still own discovery; R9 granular resource pages may own narrow skill-guide intent only.
          replace('scripts/audit-canonical-topic-ownership.mjs',
              "  if (entry.ownerPath.startsWith('/resources/') && entry.ownerRole !== 'subject-hub') {\n    fail(`Resources child route cannot own non-discovery intent for ${entry.id}: ${entry.ownerPath}`);\n  }\n",
              "  const isR9PhonicsSkillGuide = /^r9-phonics-/.test(entry.id)\n    && entry.ownerPath.startsWith('/resources/phonics/')\n    && entry.ownerRole === 'skill-guide'\n    && entry.intent === 'informational'\n    && entry.hubPath === '/resources/phonics';\n  if (entry.ownerPath.startsWith('/resources/') && entry.ownerRole !== 'subject-hub' && !isR9PhonicsSkillGuide) {\n    fail(`Resources child route cannot own non-discovery intent for ${entry.id}: ${entry.ownerPath}`);\n  }\n")

          # R8 pure validator remains strict unless an exact R9 approval set is supplied.
          p = Path('scripts/phonics-knowledge-validation.mjs')
          text = p.read_text()
          text = text.replace(
              "  ownershipScreen = PHONICS_PILOT_OWNERSHIP_SCREEN,\n} = {}) {",
              "  ownershipScreen = PHONICS_PILOT_OWNERSHIP_SCREEN,\n  approvedPilotPages = [],\n} = {}) {")
          text = text.replace(
              "  const lessons = new Map(curriculum.map((x) => [x.id, x]));\n",
              "  const lessons = new Map(curriculum.map((x) => [x.id, x]));\n  const approvedByConcept = new Map((approvedPilotPages || []).map((page) => [page.conceptId, page]));\n")
          old = "      if (occupiedSlugs.has(slug) || [...occupied].some((p) => p.endsWith(`/${slug}`))) {\n        slugCollisions++; fail('slug-collision', c.id, slug);\n      }\n"
          new = "      const approved = approvedByConcept.get(c.id);\n      const approvedPath = `/resources/phonics/${slug}`;\n      const isExactApprovedR9 = Boolean(approved && approved.path === approvedPath && approved.slug === slug && approved.conceptId === c.id);\n      if ((occupiedSlugs.has(slug) || [...occupied].some((p) => p.endsWith(`/${slug}`))) && !isExactApprovedR9) {\n        slugCollisions++; fail('slug-collision', c.id, slug);\n      }\n"
          if old not in text: raise SystemExit('R8 slug collision pattern not found')
          text = text.replace(old, new, 1)
          old = "      if (owner || canonicalQuery || protectedMatch) {\n        ownershipCollisions++; fail('ownership-collision', c.id, owner?.id ?? canonicalQuery?.id ?? protectedMatch[0]);\n      }\n"
          new = "      const approvedOwnerMatch = isExactApprovedR9 && canonicalQuery?.id === approved?.topicId && !owner && !protectedMatch;\n      if ((owner || canonicalQuery || protectedMatch) && !approvedOwnerMatch) {\n        ownershipCollisions++; fail('ownership-collision', c.id, owner?.id ?? canonicalQuery?.id ?? protectedMatch[0]);\n      }\n"
          if old not in text: raise SystemExit('R8 ownership collision pattern not found')
          text = text.replace(old, new, 1)
          p.write_text(text)

          # R8 route-safety helpers gain a narrow, opt-in R9 whitelist; defaults stay prepublication-strict.
          p = Path('scripts/phonics-knowledge-route-safety.mjs')
          text = p.read_text()
          text = text.replace(
              "const R8_CHANGE_PATH = /^(?:src\\/content\\/phonicsKnowledge\\/[^/]+\\.(?:js|d\\.ts)|src\\/tests\\/seo\\/resourcesR8[^/]+\\.(?:js|ts)|scripts\\/(?:audit-resources-r8-phonics-knowledge|phonics-knowledge-[a-z-]+)\\.mjs|docs\\/seo\\/resources-architecture\\/R8_PHONICS_KNOWLEDGE_DATASET\\.md|\\.github\\/workflows\\/resources-r8-phonics-knowledge\\.yml)$/;\nexport function validateR8ChangedPaths(paths) {\n  return paths.filter((p) => !R8_CHANGE_PATH.test(p)).map((p) => ({ code: 'public-surface-delta', id: p, detail: 'Brick 8 may change only its data, validation, tests, documentation and dedicated workflow.' }));\n}\n",
              "const R8_CHANGE_PATH = /^(?:src\\/content\\/phonicsKnowledge\\/[^/]+\\.(?:js|d\\.ts)|src\\/tests\\/seo\\/resourcesR8[^/]+\\.(?:js|ts)|scripts\\/(?:audit-resources-r8-phonics-knowledge|phonics-knowledge-[a-z-]+)\\.mjs|docs\\/seo\\/resources-architecture\\/R8_PHONICS_KNOWLEDGE_DATASET\\.md|\\.github\\/workflows\\/resources-r8-phonics-knowledge\\.yml)$/;\nconst R9_CHANGE_PATH = /^(?:src\\/lib\\/(?:phonicsProgrammaticPilot\\.(?:js|d\\.ts)|canonicalTopicOwnershipRegistry\\.js|breadcrumbAeoGeoRegistry\\.js|publicRouteManifest\\.js|routeSeoRegistry\\.js)|src\\/app\\/routes\\.tsx|src\\/pages\\/(?:PhonicsKnowledgePage|SubjectResourcesPage)\\.tsx|src\\/components\\/resources\\/PhonicsPilotGuideGrid\\.tsx|src\\/tests\\/seo\\/resourcesR9[^/]+\\.(?:js|ts)|scripts\\/(?:audit-resources-r9-programmatic-pilot|audit-canonical-topic-ownership)\\.mjs|docs\\/seo\\/resources-architecture\\/R9_PROGRAMMATIC_SEO_PILOT\\.md|\\.github\\/workflows\\/resources-r9-programmatic-seo\\.yml)$/;\nexport function validateR8ChangedPaths(paths, { allowApprovedR9 = false } = {}) {\n  return paths.filter((p) => !R8_CHANGE_PATH.test(p) && !(allowApprovedR9 && R9_CHANGE_PATH.test(p))).map((p) => ({ code: 'public-surface-delta', id: p, detail: 'Brick 8 may change only its own contract unless the path is part of the explicit approved Brick 9 publication surface.' }));\n}\n")
          text = text.replace(
              "export function auditKnowledgePublicSurfaces(root, concepts, { dist = false } = {}) {\n  const errors = [];\n  const slugs = concepts.map((c) => c.futureSlugCandidate).filter(Boolean);\n",
              "export function auditKnowledgePublicSurfaces(root, concepts, { dist = false, approvedPaths = [] } = {}) {\n  const errors = [];\n  const approvedSlugs = new Set((approvedPaths || []).map((p) => String(p).split('/').filter(Boolean).at(-1)));\n  const slugs = concepts.map((c) => c.futureSlugCandidate).filter(Boolean);\n")
          text = text.replace(
              "    for (const slug of slugs) if (text.includes(slug)) errors.push({ code: 'candidate-publication', id: p, detail: slug });\n",
              "    for (const slug of slugs) if (!approvedSlugs.has(slug) && text.includes(slug)) errors.push({ code: 'candidate-publication', id: p, detail: slug });\n")
          text = text.replace(
              "    if (/\\b(?:from\\s*|import\\s*\\(?|require\\s*\\()\\s*['\"][^'\"]*phonicsKnowledge/.test(source) || /import\\.meta\\.glob\\([^)]*phonicsKnowledge/.test(source)) errors.push({ code: 'runtime-publication-import', id: relative });\n",
              "    const approvedRuntimeFile = approvedPaths.length > 0 && ['src/lib/phonicsProgrammaticPilot.js', 'src/pages/PhonicsKnowledgePage.tsx'].includes(relative);\n    if (!approvedRuntimeFile && (/\\b(?:from\\s*|import\\s*\\(?|require\\s*\\()\\s*['\"][^'\"]*phonicsKnowledge/.test(source) || /import\\.meta\\.glob\\([^)]*phonicsKnowledge/.test(source))) errors.push({ code: 'runtime-publication-import', id: relative });\n")
          text = text.replace(
              "    for (const slug of slugs) if (relative.split(path.sep).includes(slug) || source.includes(`/${slug}`)) errors.push({ code: 'candidate-output', id: relative, detail: slug });\n",
              "    for (const slug of slugs) if (!approvedSlugs.has(slug) && (relative.split(path.sep).includes(slug) || source.includes(`/${slug}`))) errors.push({ code: 'candidate-output', id: relative, detail: slug });\n")
          p.write_text(text)

          # R8 CLI opts into the exact explicit R9 set only when requested by post-R9 CI.
          p = Path('scripts/audit-resources-r8-phonics-knowledge.mjs')
          text = p.read_text()
          text = text.replace(
              "import { PHONICS_KNOWLEDGE_DATASET } from '../src/content/phonicsKnowledge/index.js';\n",
              "import { PHONICS_KNOWLEDGE_DATASET } from '../src/content/phonicsKnowledge/index.js';\nimport { PHONICS_PROGRAMMATIC_PILOT_PAGES, PHONICS_PROGRAMMATIC_PILOT_PATHS } from '../src/lib/phonicsProgrammaticPilot.js';\n")
          text = text.replace(
              "const result = validatePhonicsKnowledge({ blogPaths });\n",
              "const r9Approved = process.argv.includes('--r9-approved');\nconst approvedPilotPages = r9Approved ? PHONICS_PROGRAMMATIC_PILOT_PAGES : [];\nconst approvedPaths = r9Approved ? PHONICS_PROGRAMMATIC_PILOT_PATHS : [];\nconst result = validatePhonicsKnowledge({ blogPaths, approvedPilotPages });\n")
          text = text.replace(
              "result.errors.push(...auditKnowledgePublicSurfaces(root, PHONICS_KNOWLEDGE_DATASET, { dist: process.argv.includes('--dist') }));\n",
              "result.errors.push(...auditKnowledgePublicSurfaces(root, PHONICS_KNOWLEDGE_DATASET, { dist: process.argv.includes('--dist'), approvedPaths }));\n")
          text = text.replace(
              "  try { result.errors.push(...validateR8ChangedPaths(getR8ChangedPaths(root, base))); }\n",
              "  try { result.errors.push(...validateR8ChangedPaths(getR8ChangedPaths(root, base), { allowApprovedR9: r9Approved })); }\n")
          text = text.replace(
              "else console.log(`PASS: ${result.summary.totalConcepts} concepts; ${result.summary.curriculumReferences} curriculum references; zero ownership/slug collisions and zero candidate public URLs.`);\n",
              "else console.log(r9Approved\n  ? `PASS: ${result.summary.totalConcepts} concepts; ${result.summary.curriculumReferences} curriculum references; only the explicit ${approvedPaths.length}-page R9 approval set is public.`\n  : `PASS: ${result.summary.totalConcepts} concepts; ${result.summary.curriculumReferences} curriculum references; zero ownership/slug collisions and zero candidate public URLs.`);\n")
          p.write_text(text)

          # Existing R8 workflow validates the now-published site in explicit R9-aware mode.
          p = Path('.github/workflows/resources-r8-phonics-knowledge.yml')
          text = p.read_text()
          text = text.replace('node scripts/audit-resources-r8-phonics-knowledge.mjs --base "$PR_BASE_SHA" --report', 'node scripts/audit-resources-r8-phonics-knowledge.mjs --r9-approved --base "$PR_BASE_SHA" --report')
          text = text.replace('node scripts/audit-resources-r8-phonics-knowledge.mjs --report', 'node scripts/audit-resources-r8-phonics-knowledge.mjs --r9-approved --report')
          text = text.replace('run: node scripts/audit-resources-r8-phonics-knowledge.mjs --dist', 'run: node scripts/audit-resources-r8-phonics-knowledge.mjs --r9-approved --dist')
          p.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts .github/workflows/resources-r8-phonics-knowledge.yml
          if git diff --cached --quiet; then
            echo "No integration changes required"
            exit 0
          fi
          git commit -m "feat(resources): integrate Brick 9 pilot"
          git push origin HEAD:seo/resources-r9-programmatic-seo-pilot
