name: Commercial C1 Observed Search Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/commercialC1ObservedSearchEvidence.ts'
      - 'src/tests/seo/commercialC1ObservedSearchEvidence.spec.ts'
      - 'scripts/audit-commercial-c1-observed-search-evidence.mjs'
      - 'docs/seo/commercial-growth/C1_OBSERVED_GSC_BING_EVIDENCE_2026-09-10.md'
      - '.github/workflows/commercial-c1-observed-search-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c1-observed-search-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for prerender
        run: npx playwright install --with-deps chromium
      - name: Run observed-evidence contract tests
        run: npx vitest run src/tests/seo/commercialC1ObservedSearchEvidence.spec.ts src/tests/seo/commercialC1InternationalAiResearch.spec.ts src/tests/seo/commercialC1InternationalCoreSubjectCompletion.spec.ts src/tests/seo/commercialC1SearchUniverse.spec.ts src/tests/seo/commercialC0Foundation.spec.ts
      - name: Audit observed Google and Bing evidence
        run: node scripts/audit-commercial-c1-observed-search-evidence.mjs
      - name: Audit international and AI research
        run: node scripts/audit-commercial-c1-international-ai.mjs
      - name: Audit base C1 search universe
        run: node scripts/audit-commercial-c1-search-universe.mjs
      - name: Run type check
        run: npm run typecheck
      - name: Run full repository tests
        run: npm test
      - name: Build and prerender public site
        run: npm run build
      - name: Re-run observed-evidence audit after build
        run: node scripts/audit-commercial-c1-observed-search-evidence.mjs
      - name: Run SEO smoke
        run: npm run seo:smoke
