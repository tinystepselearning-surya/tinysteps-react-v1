name: R9 R8 Test Compat Temporary

on:
  push:
    branches:
      - seo/resources-r9-programmatic-seo-pilot

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/resources-r9-programmatic-seo-pilot
      - name: Patch R8 regression expectations for explicit R9 approvals
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/tests/seo/resourcesR8PhonicsKnowledgeDataset.spec.js')
          text = p.read_text()
          old = "import { CANONICAL_TOPIC_OWNERSHIP as owners } from '../../lib/canonicalTopicOwnershipRegistry.js';\n"
          new = old + "import { PHONICS_PROGRAMMATIC_PILOT_PAGES, PHONICS_PROGRAMMATIC_PILOT_PATHS } from '../../lib/phonicsProgrammaticPilot.js';\n"
          if old not in text: raise SystemExit('R8 import anchor missing')
          text = text.replace(old, new, 1)
          old = "const validate = (overrides = {}) => validatePhonicsKnowledge({ blogPaths, ...overrides });\n"
          new = "const validate = (overrides = {}) => validatePhonicsKnowledge({ blogPaths, approvedPilotPages: PHONICS_PROGRAMMATIC_PILOT_PAGES, ...overrides });\n"
          if old not in text: raise SystemExit('R8 validate helper anchor missing')
          text = text.replace(old, new, 1)
          old = "  it('keeps the actual publishing surfaces free of candidates and runtime imports', () => {\n    assert.deepEqual(auditKnowledgePublicSurfaces(process.cwd(), dataset), []);\n  });\n"
          new = "  it('allows only the explicit R9 approval set on publishing surfaces', () => {\n    assert.deepEqual(auditKnowledgePublicSurfaces(process.cwd(), dataset, { approvedPaths: PHONICS_PROGRAMMATIC_PILOT_PATHS }), []);\n  });\n"
          if old not in text: raise SystemExit('R8 publication assertion anchor missing')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tests/seo/resourcesR8PhonicsKnowledgeDataset.spec.js
          git commit -m "test(resources): preserve R8 guards after R9 approval"
          git push origin HEAD:seo/resources-r9-programmatic-seo-pilot
