name: Resources GV2 Vocabulary Taxonomy Lexical Model

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/vocabularyLexicalModel.ts'
      - 'src/lib/publicVocabularyContent.ts'
      - 'src/tests/seo/vocabularyLexicalModel.spec.ts'
      - 'src/tests/pages/public/WordMeaningFlashcards.spec.tsx'
      - 'src/lib/grammarVocabularyAuthorityRequirements.*'
      - 'docs/seo/resources-architecture/GV2_*'
      - '.github/workflows/resources-gv2-vocabulary-lexical-model.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  resources-gv2-vocabulary-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run GV2 lexical and compatibility regressions
        run: npx vitest run src/tests/seo/vocabularyLexicalModel.spec.ts src/tests/pages/public/WordMeaningFlashcards.spec.tsx src/tests/seo/grammarVocabularyAuthorityRequirements.spec.ts
      - name: Lint GV2 vocabulary files
        run: npx eslint src/lib/vocabularyLexicalModel.ts src/lib/publicVocabularyContent.ts src/tests/seo/vocabularyLexicalModel.spec.ts
      - name: Run type check
        run: npm run typecheck
      - name: Install Chromium for prerender
        run: npx playwright install --with-deps chromium
      - name: Build public site
        run: npm run build
