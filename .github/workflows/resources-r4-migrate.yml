name: Resources R4 Migration

on:
  push:
    branches: [seo/resources-r4-subject-hubs]

permissions:
  contents: write

jobs:
  migrate:
    if: startsWith(github.event.head_commit.message, 'chore(r4): start subject hub migration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/resources-r4-subject-hubs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Brick 4 subject-hub patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing replacement marker in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, count))

          # Gateway destinations: subject discovery now goes to subject hubs.
          replace('src/pages/ResourcesPage.tsx', "to: '/blog?topic=Phonics',", "to: '/resources/phonics',")
          replace('src/pages/ResourcesPage.tsx', "to: '/blog?topic=Grammar',", "to: '/resources/grammar',")
          replace('src/pages/ResourcesPage.tsx', "to: '/blog?topic=Speaking%20%26%20Communication',", "to: '/resources/speaking',")

          # Router: one shared subject-hub renderer, three explicit crawlable routes.
          replace(
              'src/app/routes.tsx',
              "const ResourcesPage = lazy(() => import('../pages/ResourcesPage'));\n",
              "const ResourcesPage = lazy(() => import('../pages/ResourcesPage'));\nconst SubjectResourcesPage = lazy(() => import('../pages/SubjectResourcesPage'));\n",
          )
          replace(
              'src/app/routes.tsx',
              "        { path: 'resources', element: <ResourcesPage /> },\n",
              "        { path: 'resources', element: <ResourcesPage /> },\n        { path: 'resources/phonics', element: <SubjectResourcesPage subject=\"phonics\" /> },\n        { path: 'resources/grammar', element: <SubjectResourcesPage subject=\"grammar\" /> },\n        { path: 'resources/speaking', element: <SubjectResourcesPage subject=\"speaking\" /> },\n",
          )

          # Static route manifest: subject hubs are real indexable/prerendered pages.
          replace(
              'src/lib/publicRouteManifest.js',
              "  route('/resources', 'static'),\n",
              "  route('/resources', 'static'),\n  route('/resources/phonics', 'resources'),\n  route('/resources/grammar', 'resources'),\n  route('/resources/speaking', 'resources'),\n",
          )

          # SEO ownership stays informational/branded, deliberately distinct from commercial programme pages.
          seo_block = """  '/resources/phonics': {
    title: 'Phonics & Reading Resource Hub | Tiny Steps Learning',
    description:
      'Browse Tiny Steps phonics and early-reading guides by learning pathway, practice need, and common reading problem. Find existing guides, games, and parent support in one place.',
    canonicalPath: '/resources/phonics',
    ogType: 'website',
  },
  '/resources/grammar': {
    title: 'Grammar & Writing Resource Hub | Tiny Steps Learning',
    description:
      'Browse Tiny Steps grammar and writing resources for sentence formation, grammar accuracy, writing development, common learning problems, and focused practice.',
    canonicalPath: '/resources/grammar',
    ogType: 'website',
  },
  '/resources/speaking': {
    title: 'Speaking & Communication Resource Hub | Tiny Steps Learning',
    description:
      'Browse Tiny Steps speaking and communication resources for fuller sentences, confidence, storytelling, classroom participation, common speaking problems, and practice.',
    canonicalPath: '/resources/speaking',
    ogType: 'website',
  },
"""
          replace('src/lib/routeSeoRegistry.js', "  '/blog': {\n", seo_block + "  '/blog': {\n")

          # R0 semantic registry: planned subject nodes become protected orchestration routes.
          replace(
              'src/lib/resourcesArchitectureRegistry.js',
              """  entry('/resources/phonics', {
    currentState: 'planned', pageFamily: 'subject-resource-hub', audience: 'parents', subject: 'phonics-reading',
    currentPurpose: 'Not live in R0.', primaryIntent: 'informational', primaryQueryOwner: 'planned: phonics and reading learning hub',
    commercialReadiness: 'low', ctaPolicy: 'related-resource', primaryDestination: null, protection: 'planned', futureResourceNode: '/resources/phonics',
  }),
  entry('/resources/grammar', {
    currentState: 'planned', pageFamily: 'subject-resource-hub', audience: 'parents', subject: 'grammar-writing',
    currentPurpose: 'Not live in R0.', primaryIntent: 'informational', primaryQueryOwner: 'planned: grammar and writing learning hub',
    commercialReadiness: 'low', ctaPolicy: 'related-resource', primaryDestination: null, protection: 'planned', futureResourceNode: '/resources/grammar',
  }),
  entry('/resources/speaking', {
    currentState: 'planned', pageFamily: 'subject-resource-hub', audience: 'parents', subject: 'speaking-communication',
    currentPurpose: 'Not live in R0.', primaryIntent: 'informational', primaryQueryOwner: 'planned: speaking and communication learning hub',
    commercialReadiness: 'low', ctaPolicy: 'related-resource', primaryDestination: null, protection: 'planned', futureResourceNode: '/resources/speaking',
  }),
""",
              """  entry('/resources/phonics', {
    currentState: 'route', pageFamily: 'subject-resource-hub', audience: 'parents', subject: 'phonics-reading',
    currentPurpose: 'Curated discovery layer for existing phonics and reading authorities, practice, and parent problem routes; it does not replace /phonics or any /blog/* intent owner.',
    primaryIntent: 'informational', primaryQueryOwner: 'Tiny Steps phonics and reading resource hub',
    commercialReadiness: 'low', ctaPolicy: 'related-resource', primaryDestination: '/blog?topic=Phonics', protection: 'protected', futureResourceNode: '/resources/phonics',
  }),
  entry('/resources/grammar', {
    currentState: 'route', pageFamily: 'subject-resource-hub', audience: 'parents', subject: 'grammar-writing',
    currentPurpose: 'Curated discovery layer for existing grammar and writing authorities, practice, and parent problem routes; it does not replace /grammar or any /blog/* intent owner.',
    primaryIntent: 'informational', primaryQueryOwner: 'Tiny Steps grammar and writing resource hub',
    commercialReadiness: 'low', ctaPolicy: 'related-resource', primaryDestination: '/blog?topic=Grammar', protection: 'protected', futureResourceNode: '/resources/grammar',
  }),
  entry('/resources/speaking', {
    currentState: 'route', pageFamily: 'subject-resource-hub', audience: 'parents', subject: 'speaking-communication',
    currentPurpose: 'Curated discovery layer for existing speaking and communication authorities, practice, and parent problem routes; it does not replace /speaking or any /blog/* intent owner.',
    primaryIntent: 'informational', primaryQueryOwner: 'Tiny Steps speaking and communication resource hub',
    commercialReadiness: 'low', ctaPolicy: 'related-resource', primaryDestination: '/blog?topic=Speaking%20%26%20Communication', protection: 'protected', futureResourceNode: '/resources/speaking',
  }),
""",
          )

          # Evolve old R0/R2 acceptance tests to the post-R4 state.
          replace(
              'src/tests/seo/resourcesR0SafetyBaseline.spec.js',
              "it('protects the Brick 2 /resources gateway while subject hubs remain planned', () => {",
              "it('protects the Resources gateway and the Brick 4 subject hubs', () => {",
          )
          replace(
              'src/tests/seo/resourcesR0SafetyBaseline.spec.js',
              "expect(byPath.get(path)).toMatchObject({ currentState: 'planned', protection: 'planned' });",
              "expect(byPath.get(path)).toMatchObject({ currentState: 'route', pageFamily: 'subject-resource-hub', protection: 'protected' });",
          )

          r2 = Path('src/tests/seo/resourcesR2LearningHub.spec.js')
          r2_text = r2.read_text()
          old = """  it('keeps the gateway focused on six existing ecosystem destinations until subject hubs are built', () => {
    const page = read('src/pages/ResourcesPage.tsx');

    for (const title of [
      'Phonics & Reading',
      'Grammar & Writing',
      'Speaking & Communication',
      'Parent Help',
      'Free Learning Activities',
      'Schools & Educators',
    ]) {
      expect(page).toContain(title);
    }

    for (const destination of [
      '/blog?topic=Phonics',
      '/blog?topic=Grammar',
      '/blog?topic=Speaking%20%26%20Communication',
      '/parents',
      '/free-english-games-for-kids',
      '/for-schools',
    ]) {
      expect(page).toContain(destination);
    }

    expect(page).toContain('Browse all guides');
    expect(page).not.toContain(\"to: '/resources/phonics'\");
    expect(page).not.toContain(\"to: '/resources/grammar'\");
    expect(page).not.toContain(\"to: '/resources/speaking'\");
  });

  it('does not prematurely publish the planned subject hubs or duplicate protected ecosystem hubs', () => {
    const manifestPaths = new Set(PUBLIC_ROUTE_MANIFEST.map((item) => item.path));
    for (const pathName of ['/resources/phonics', '/resources/grammar', '/resources/speaking']) {
      expect(manifestPaths.has(pathName)).toBe(false);
      expect(RESOURCE_ECOSYSTEM_REGISTRY.find((item) => item.path === pathName)).toMatchObject({
        currentState: 'planned',
        protection: 'planned',
      });
    }

    for (const duplicate of ['/resources/parents', '/resources/games', '/resources/schools', '/resources/blog']) {
      expect(manifestPaths.has(duplicate)).toBe(false);
    }
  });
"""
          new = """  it('keeps the gateway focused on six ecosystem destinations and routes the three learning subjects into dedicated hubs', () => {
    const page = read('src/pages/ResourcesPage.tsx');

    for (const title of [
      'Phonics & Reading',
      'Grammar & Writing',
      'Speaking & Communication',
      'Parent Help',
      'Free Learning Activities',
      'Schools & Educators',
    ]) {
      expect(page).toContain(title);
    }

    for (const destination of [
      '/resources/phonics',
      '/resources/grammar',
      '/resources/speaking',
      '/parents',
      '/free-english-games-for-kids',
      '/for-schools',
    ]) {
      expect(page).toContain(destination);
    }

    expect(page).toContain('Browse all guides');
  });

  it('publishes only the three approved subject hubs without duplicating parent, games, school, or blog hubs', () => {
    const manifestPaths = new Set(PUBLIC_ROUTE_MANIFEST.map((item) => item.path));
    for (const pathName of ['/resources/phonics', '/resources/grammar', '/resources/speaking']) {
      expect(manifestPaths.has(pathName)).toBe(true);
      expect(RESOURCE_ECOSYSTEM_REGISTRY.find((item) => item.path === pathName)).toMatchObject({
        currentState: 'route',
        pageFamily: 'subject-resource-hub',
        protection: 'protected',
      });
    }

    for (const duplicate of ['/resources/parents', '/resources/games', '/resources/schools', '/resources/blog']) {
      expect(manifestPaths.has(duplicate)).toBe(false);
    }
  });
"""
          if old not in r2_text:
              raise SystemExit('missing R2 subject-hub block')
          r2.write_text(r2_text.replace(old, new, 1))

          # LLM discovery: expose subject hubs without changing article ownership.
          replace(
              'public/llms.txt',
              '- [English Learning Resources for Kids, Parents & Educators](https://tinystepslearning.com/resources)\n',
              '- [English Learning Resources for Kids, Parents & Educators](https://tinystepslearning.com/resources)\n- [Phonics & Reading Resource Hub](https://tinystepslearning.com/resources/phonics)\n- [Grammar & Writing Resource Hub](https://tinystepslearning.com/resources/grammar)\n- [Speaking & Communication Resource Hub](https://tinystepslearning.com/resources/speaking)\n',
          )

          subject_page = r'''import type { FC } from 'react';
import { Link } from 'react-router-dom';
import Meta from '../components/common/Meta';
import { getRouteConfig } from '../lib/seo';
import { ORGANIZATION_ID, SITE_ORIGIN, WEBSITE_ID, organizationSchema, websiteSchema } from '../lib/schemas';

export type ResourceSubject = 'phonics' | 'grammar' | 'speaking';

type ResourceLink = {
  title: string;
  description: string;
  to: string;
  label: string;
};

type ResourceSection = {
  eyebrow: string;
  title: string;
  description: string;
  links: ResourceLink[];
};

type SubjectConfig = {
  title: string;
  eyebrow: string;
  intro: string;
  canonicalPath: string;
  allGuidesTo: string;
  allGuidesLabel: string;
  programmeTo: string;
  programmeLabel: string;
  accent: string;
  sections: ResourceSection[];
};

