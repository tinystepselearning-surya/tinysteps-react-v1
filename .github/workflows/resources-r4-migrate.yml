name: Resources R4 Migration

on:
  push:
    branches:
      - 'seo/resources-r4-subject-hubs'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/resources-r4-subject-hubs
          fetch-depth: 0
      - name: Apply Brick 4 patch
        run: python3 scripts/apply-resources-r4.py
      - name: Commit Brick 4 product patch
        shell: bash
        run: |
          rm scripts/apply-resources-r4.py .github/workflows/resources-r4-migrate.yml .github/workflows/resources-r4-subject-hubs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(resources): build subject resource hubs"
          git push origin HEAD:seo/resources-r4-subject-hubs
