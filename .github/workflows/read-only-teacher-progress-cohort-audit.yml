name: Read-only teacher progress cohort audit

on:
  push:
    branches:
      - audit/teacher-progress-cohort-readonly

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TINYSTEPS_REACT_V1 }}
          create_credentials_file: true
      - name: Classify active legacy vs canonical progress without writes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}
          FIREBASE_PROJECT_ID: tinysteps-react-v1
          FAREEHA_EMAIL_SHA256: b2d3257a784cc16f4f924229b8756fdf1e00cb00acff392fef1625870a9b433b
          VAISHNAVI_EMAIL_SHA256: 2873467048a6be142d65088a65b2bf5f8be9a74267b00540004a3130a114868b
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import { applicationDefault, initializeApp } from 'firebase-admin/app';
          import { getAuth } from 'firebase-admin/auth';
          import { getFirestore } from 'firebase-admin/firestore';

          initializeApp({ credential: applicationDefault(), projectId: process.env.FIREBASE_PROJECT_ID });
          const db = getFirestore();
          const auth = getAuth();
          const hash = (v) => crypto.createHash('sha256').update(String(v || '').trim().toLowerCase()).digest('hex');
          const targets = new Map([
            [process.env.FAREEHA_EMAIL_SHA256, 'fareeha'],
            [process.env.VAISHNAVI_EMAIL_SHA256, 'vaishnavi'],
          ]);
          const resolved = new Map();
          let pageToken;
          do {
            const page = await auth.listUsers(1000, pageToken);
            for (const user of page.users) {
              const label = targets.get(hash(user.email));
              if (label) resolved.set(label, user.uid);
            }
            pageToken = page.pageToken;
          } while (pageToken && resolved.size < 2);
          if (resolved.size !== 2) process.exit(2);

          const s = (v) => typeof v === 'string' ? v.trim() : '';
          const kidOf = (d) => s(d.kidId) || s(d.studentId) || s(d.childId) || (Array.isArray(d.kidIds) ? s(d.kidIds[0]) : '');
          const active = (d) => ['active','trial','paused','enrolled','current','ongoing',''].includes(s(d.status).toLowerCase());
          const canonicalTopicId = (id) => /^(phonics-foundations|early-phonics|advanced-phonics)__lesson-\d+$/i.test(id);

          for (const label of ['fareeha','vaishnavi']) {
            const uid = resolved.get(label);
            console.log(`::add-mask::${uid}`);
            const enrollmentSnap = await db.collection('enrollments').where('teacherId', '==', uid).get();
            const allEnrollments = enrollmentSnap.docs.map((doc) => ({ id: doc.id, data: doc.data() || {} }));
            const activeEnrollments = allEnrollments.filter((e) => active(e.data));
            const allByKidCourse = new Map();
            for (const e of allEnrollments) {
              const key = `${kidOf(e.data)}::${s(e.data.courseId)}`;
              const list = allByKidCourse.get(key) || [];
              list.push(e.id);
              allByKidCourse.set(key, list);
            }

            const summary = {
              teacher: label,
              activeEnrollments: activeEnrollments.length,
              activeKidsWithCanonicalProgress: 0,
              activeKidsLegacyOnly: 0,
              activeKidsNoProgress: 0,
              activeTotalCanonicalDocs: 0,
              activeTotalLegacyDocs: 0,
              legacyWithCourseId: 0,
              legacyMissingCourseId: 0,
              legacyCanonicalTopicId: 0,
              legacyUniqueKidCourseMapping: 0,
              legacyAmbiguousKidCourseMapping: 0,
              legacyNoKidCourseMapping: 0,
              canonicalDocsMatchingCurrentEnrollment: 0,
              canonicalDocsOtherEnrollment: 0,
            };

            for (const e of activeEnrollments) {
              const kidId = kidOf(e.data);
              const courseId = s(e.data.courseId);
              const snap = await db.collection('students').doc(kidId).collection('progress').limit(5000).get();
              let canonical = 0;
              let legacy = 0;
              for (const doc of snap.docs) {
                const d = doc.data() || {};
                const enrollmentId = s(d.enrollmentId);
                if (enrollmentId) {
                  canonical += 1;
                  summary.activeTotalCanonicalDocs += 1;
                  if (enrollmentId === e.id) summary.canonicalDocsMatchingCurrentEnrollment += 1;
                  else summary.canonicalDocsOtherEnrollment += 1;
                  continue;
                }
                legacy += 1;
                summary.activeTotalLegacyDocs += 1;
                const docCourse = s(d.courseId);
                if (docCourse) summary.legacyWithCourseId += 1; else summary.legacyMissingCourseId += 1;
                if (canonicalTopicId(doc.id)) summary.legacyCanonicalTopicId += 1;
                const key = `${kidId}::${docCourse}`;
                const candidates = docCourse ? (allByKidCourse.get(key) || []) : [];
                if (candidates.length === 1) summary.legacyUniqueKidCourseMapping += 1;
                else if (candidates.length > 1) summary.legacyAmbiguousKidCourseMapping += 1;
                else summary.legacyNoKidCourseMapping += 1;
              }
              if (canonical > 0) summary.activeKidsWithCanonicalProgress += 1;
              else if (legacy > 0) summary.activeKidsLegacyOnly += 1;
              else summary.activeKidsNoProgress += 1;
            }
            console.log(JSON.stringify(summary, null, 2));
          }
          NODE
