name: C3 Page 4 Reading Polish

on:
  push:
    branches:
      - seo/c1-parent-commercial-search-universe
    paths:
      - '.github/workflows/c3-page4-reading-polish.yml'

permissions:
  contents: write

jobs:
  polish-reading-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/c1-parent-commercial-search-universe
          fetch-depth: 0
      - name: Apply final Page 4 polish
        run: python scripts/tmp-c3-page4-reading-polish.py
      - name: Verify focused changes
        run: |
          git diff --check
          grep -F '₹{oneToOnePrice} per class' src/pages/public/ReadingClassesForKidsPage.tsx
          grep -F 'Writing Classes for Kids' src/pages/public/ReadingClassesForKidsPage.tsx
      - name: Commit final Page 4 polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/public/ReadingClassesForKidsPage.tsx
          git commit -m 'C3 page 4: finish reading owner polish'
          git push origin HEAD:seo/c1-parent-commercial-search-universe
