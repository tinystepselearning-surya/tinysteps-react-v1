name: Resources R3 Navigation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/NavBar/NavBar.tsx'
      - 'src/components/common/Footer.tsx'
      - 'src/tests/seo/resourcesR3Navigation.spec.js'
      - 'src/tests/seo/resourcesR2LearningHub.spec.js'
      - 'src/tests/seo/resourcesR0SafetyBaseline.spec.js'
      - 'src/lib/publicRouteManifest.js'
      - 'src/lib/routeSeoRegistry.js'
      - 'src/lib/resourcesArchitectureRegistry.js'
      - 'scripts/audit-resources-r0.mjs'
      - 'scripts/audit-resources-r0-rendered.mjs'
      - 'docs/seo/resources-architecture/**'
      - '.github/workflows/resources-r3-navigation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resources-r3-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Brick 3, Brick 2 and R0 regression tests
        run: >-
          npx vitest run
          src/tests/seo/resourcesR3Navigation.spec.js
          src/tests/seo/resourcesR2LearningHub.spec.js
          src/tests/seo/resourcesR0SafetyBaseline.spec.js

      - name: Run structural Resources safety audit
        run: node scripts/audit-resources-r0.mjs

      - name: Run type check
        run: npm run typecheck

      - name: Build and prerender public site
        run: npm run build

      - name: Run rendered Resources safety audit
        run: node scripts/audit-resources-r0-rendered.mjs

      - name: Run SEO smoke test
        run: npm run seo:smoke
