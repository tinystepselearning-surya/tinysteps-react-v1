name: Apply upcoming live-date session fix

on:
  push:
    branches:
      - fix/sessions-upcoming-live-date-read
    paths:
      - .github/workflows/apply-upcoming-live-date-fix.yml
      - scripts/apply-upcoming-live-date-fix.mjs

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/sessions-upcoming-live-date-read
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Apply targeted patch
        run: node scripts/apply-upcoming-live-date-fix.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run Sessions Management snapshot tests
        run: npx vitest run src/tests/pages/TodaysNotificationsSnapshot.spec.ts src/tests/pages/TodaysNotifications.spec.tsx

      - name: Lint changed source
        run: npx eslint src/pages/admin/TodaysNotifications.tsx src/lib/sessionsManagementSnapshot.ts

      - name: Commit fix and remove temporary tooling
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-upcoming-live-date-fix.yml scripts/apply-upcoming-live-date-fix.mjs
          git add src/pages/admin/TodaysNotifications.tsx src/lib/sessionsManagementSnapshot.ts
          git diff --cached --check
          git commit -m "fix: keep upcoming Sessions Management dates live"
          git push origin HEAD:fix/sessions-upcoming-live-date-read
