name: Validate R5C2B Admin Diagnostics

on:
  push:
    branches:
      - wave1/identity-r5c2b-admin-diagnostics-20261004

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions --include=dev

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Run R5C2B authorization and diagnostic tests
        run: >-
          npx vitest run --config functions/vitest.config.ts
          functions/test/canonicalAdminGuard.spec.ts
          functions/test/canonicalAdminDiagnosticsRouting.spec.ts
          functions/test/authAccessAuthorization.spec.ts
          functions/test/auditAllTransferredSessionSnapshotIssues.spec.ts

      - name: Run historical attendance page routing regression
        run: npx vitest run src/tests/pages/HistoricalAttendanceCorrectionRouting.spec.ts

      - name: Run deployment-impact classifier regressions
        run: node --test scripts/test/functions-impact.node-test.mjs

      - name: Analyze deployment impact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          main_sha="$(git rev-parse origin/main)"
          node scripts/resolve-deployment-impact.mjs \
            --before "${main_sha}" \
            --functions-before "${main_sha}" \
            --hosting-before "${main_sha}" \
            --firestore-rules-before "${main_sha}" \
            --firestore-indexes-before "${main_sha}" \
            --sha "${GITHUB_SHA}"
