name: B8 Validation

on:
  push:
    branches:
      - seo/blog-b08-first-party-knowledge-v2
  workflow_dispatch:

jobs:
  validate-b8:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused B6/B7/B8/hero/blog SEO tests
        run: >-
          npx vitest run
          src/tests/seo/blogB8FirstPartyKnowledge.spec.ts
          src/tests/seo/blogIntentOwnership.spec.ts
          src/tests/seo/blogEditorialTrust.spec.ts
          src/tests/seo/blogHeroFamilies.spec.ts
          src/tests/seo/blogBaselineAudit.spec.ts
          src/tests/seo/blogConsolidationSource.spec.ts
          src/tests/seo/blogIndexingPolicy.spec.ts
          src/tests/seo/blogIndexUx.spec.ts

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run full root unit suite
        run: npm run test:unit -- --run

      - name: Run production build
        run: npm run build

      - name: Run SEO smoke
        run: npm run seo:smoke

      - name: Run route integrity check
        run: npm run seo:route-integrity

      - name: Run indexability report
        run: npm run seo:indexability-report

      - name: Run indexation guard
        run: npm run seo:indexation-check

      - name: Run rendered HTML SEO check
        run: npm run seo:rendered-check
