name: Homepage Mobile Release Gate

on:
  pull_request:
    paths:
      - 'src/pages/HomePage.tsx'
      - 'src/components/Home/ConversionHero.tsx'
      - 'src/components/common/Header.tsx'
      - 'src/components/common/FloatingAssistant.tsx'
      - 'src/tests/components/FloatingAssistant.test.tsx'
      - 'src/tests/components/HeaderNavigation.spec.tsx'
      - 'src/tests/seo/homeAiEntityVisibility.spec.ts'
      - 'src/tests/seo/homeMachineReadability.spec.ts'
      - 'tests/homepage-premium-responsive.spec.ts'
      - 'tests/homepage-gateway-destinations.spec.ts'
      - '.github/workflows/homepage-mobile-release-gate.yml'
      - '.github/workflows/homepage-lighthouse-baseline.yml'
  push:
    branches:
      - 'fix/home-mobile-ux-refinement-20261026'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-mobile-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-homepage:
    name: TypeScript, homepage regressions, browser, and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout proposed code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run typecheck
      - name: Focused homepage and navigation unit, SEO contract tests
        run: >-
          npx vitest run
          src/tests/components/FloatingAssistant.test.tsx
          src/tests/components/HeaderNavigation.spec.tsx
          src/tests/seo/homeAiEntityVisibility.spec.ts
          src/tests/seo/homeMachineReadability.spec.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test mobile and desktop homepage journeys
        run: >-
          npx playwright test
          tests/homepage-premium-responsive.spec.ts
          tests/homepage-gateway-destinations.spec.ts
      - name: Build the production Hosting artifact
        run: npm run build:deploy
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-mobile-playwright-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Confirm validation-only execution
        run: echo "All checks complete. This workflow does not deploy to Firebase."


  live-lighthouse-baseline:
    name: Live homepage Lighthouse baseline (read-only audit branch)
    if: github.head_ref == 'audit/home-mobile-pagespeed-baseline-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Measure live homepage mobile and desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          for mode in mobile desktop; do
            if [[ "$mode" == desktop ]]; then preset="--preset=desktop"; else preset="--form-factor=mobile"; fi
            npx --yes lighthouse@12.8.2 https://tinystepslearning.com/ \
              --chrome-path="$CHROME_PATH" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance \
              "$preset" \
              --output=json \
              --output-path="artifacts/homepage-lighthouse-${mode}.json" \
              --quiet
          done
      - name: Print metrics and main diagnostics
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const device of ['mobile', 'desktop']) {
            const r = JSON.parse(fs.readFileSync(`artifacts/homepage-lighthouse-${device}.json`, 'utf8'));
            const a = r.audits;
            console.log(JSON.stringify({
              device,
              url: r.finalDisplayedUrl,
              fetchTime: r.fetchTime,
              lighthouseVersion: r.lighthouseVersion,
              score: Math.round(r.categories.performance.score * 100),
              firstContentfulPaintMs: a['first-contentful-paint']?.numericValue,
              largestContentfulPaintMs: a['largest-contentful-paint']?.numericValue,
              totalBlockingTimeMs: a['total-blocking-time']?.numericValue,
              cumulativeLayoutShift: a['cumulative-layout-shift']?.numericValue,
              speedIndexMs: a['speed-index']?.numericValue,
              biggestOpportunities: Object.values(a)
                .filter(x => x?.details?.overallSavingsMs > 100 || x?.details?.overallSavingsBytes > 10000)
                .map(x => ({ id:x.id, title:x.title,
                  savingsMs:x.details?.overallSavingsMs, savingsBytes:x.details?.overallSavingsBytes }))
                .slice(0,12),
            }, null, 2));
          }
          NODE
      - name: Upload Lighthouse source reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-lighthouse-live-baseline
          path: artifacts/homepage-lighthouse-*.json
          if-no-files-found: warn
          retention-days: 14
