name: Patch parent worksheets tab wiring

on:
  push:
    branches:
      - feature/parent-worksheets-tab-grid
    paths:
      - .github/workflows/patch-parent-worksheets-tab.yml

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/parent-worksheets-tab-grid
          fetch-depth: 0

      - name: Apply focused ParentDashboard changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/pages/parent/ParentDashboard.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '  ExternalLink,\n  Gamepad2,',
              '  ExternalLink,\n  FileText,\n  Gamepad2,',
              'FileText import',
          )

          replace_once(
              '  { id: "skills", label: "Skills", icon: Sparkles },\n  { id: "classes", label: "Classes", icon: CalendarDays },',
              '  { id: "skills", label: "Skills", icon: Sparkles },\n  { id: "worksheets", label: "Worksheets", icon: FileText },\n  { id: "classes", label: "Classes", icon: CalendarDays },',
              'sidebar Worksheets item',
          )

          replace_once(
              '    "skills",\n    "classes",',
              '    "skills",\n    "worksheets",\n    "classes",',
              'safeTab worksheets key',
          )

          replace_once(
              '    enabled: !!user?.uid && !!selectedKidId && activeTab === "classes",',
              '    enabled: !!user?.uid && !!selectedKidId && activeTab === "worksheets",',
              'worksheet query tab gating',
          )

          replace_once(
              '  const activeClassRows =\n    classesView === "calendar" || classesView === "worksheets"\n      ? []\n      : classRowsByFilter[classesView];',
              '  const activeClassRows =\n    classesView === "calendar"\n      ? []\n      : classRowsByFilter[classesView];',
              'class active rows',
          )

          replace_once(
              '''    {\n      id: "worksheets" as const,\n      label: "Worksheets",\n      description: "Practice resources shared by Tiny Steps.",\n      count: parentWorksheetsQuery.isLoading ? null : visibleParentWorksheets.length,\n    },\n''',
              '',
              'remove worksheets from class resources',
          )

          replace_once(
              '    parentRecordingFolderUrl,\n    parentWorksheetsQuery.isLoading,\n    visibleParentWorksheets.length,\n  ]);',
              '    parentRecordingFolderUrl,\n  ]);',
              'class resource dependencies',
          )

          marker = '        {/* Classes tab: canonical sessions bucketed for parent review */}'
          standalone = '''        {/* Dedicated Worksheets tab: lesson-aligned parent practice library */}\n        {activeTab === "worksheets" && (\n          <div className="space-y-3 sm:space-y-4">\n            <ParentWorksheetLibrary\n              items={visibleParentWorksheets}\n              loading={parentWorksheetsQuery.isLoading}\n              refreshing={parentWorksheetsQuery.isFetching}\n              onRefresh={() => void parentWorksheetsQuery.refetch()}\n            />\n          </div>\n        )}\n\n'''
          replace_once(marker, standalone + marker, 'standalone worksheets render')

          replace_once(
              '''              resourceContent={classesView === "worksheets" ? (\n              <ParentWorksheetLibrary\n                items={visibleParentWorksheets}\n                loading={parentWorksheetsQuery.isLoading}\n                refreshing={parentWorksheetsQuery.isFetching}\n                onRefresh={() => void parentWorksheetsQuery.refetch()}\n              />\n            ) : classesView === "calendar" ? (''',
              '              resourceContent={classesView === "calendar" ? (',
              'remove embedded worksheet class resource content',
          )

          path.write_text(text)
          PY

          git diff --check
          git diff -- src/pages/parent/ParentDashboard.tsx

      - name: Commit focused dashboard wiring
        shell: bash
        run: |
          if git diff --quiet -- src/pages/parent/ParentDashboard.tsx; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/parent/ParentDashboard.tsx
          git commit -m "feat(parent): wire standalone worksheets tab"
          git push origin HEAD:feature/parent-worksheets-tab-grid
