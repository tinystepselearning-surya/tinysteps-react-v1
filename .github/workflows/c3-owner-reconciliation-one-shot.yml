name: C3 Owner Reconciliation One Shot

on:
  push:
    branches:
      - seo/c1-parent-commercial-search-universe
    paths:
      - 'scripts/reconcile-commercial-c3-owner-pages.mjs'
      - '.github/workflows/c3-owner-reconciliation-one-shot.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/c1-parent-commercial-search-universe
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Apply deterministic C3 reconciliation
        run: |
          # Remove one obsolete no-op assertion and fix literal template placeholders
          # inside the temporary audit-generator block before executing it.
          sed -i "/speaking trust chip anchor/d" scripts/reconcile-commercial-c3-owner-pages.mjs
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/reconcile-commercial-c3-owner-pages.mjs')
          s = p.read_text()
          s = s.replace(r'\\${', r'\${')
          p.write_text(s)
          PY
          node scripts/reconcile-commercial-c3-owner-pages.mjs
          # The second-pass audit found a second copy of this unsupported frequency
          # statement in the trust-proof section. Keep the claim factual and frequency-neutral.
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/public/OnlineEnglishClassesForKidsPage.tsx')
          s = p.read_text().replace('Weekly parent updates after classes begin', 'Parent progress visibility after classes begin')
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for prerender
        run: npx playwright install --with-deps chromium

      - name: Run C3 and upstream commercial tests
        run: >-
          npx vitest run
          src/tests/seo/commercialC3OwnerPageAudit.spec.ts
          src/tests/seo/commercialC2KeywordOwnership.spec.ts
          src/tests/seo/commercialC1ObservedSearchEvidence.spec.ts
          src/tests/seo/commercialC1InternationalAiResearch.spec.ts

      - name: Audit C3 owner pages
        run: node scripts/audit-commercial-c3-owner-pages.mjs

      - name: Audit C2 ownership
        run: node scripts/audit-commercial-c2-keyword-ownership.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Full repository tests
        run: npm test

      - name: Production build and prerender
        run: npm run build

      - name: Post-build C3 audit
        run: node scripts/audit-commercial-c3-owner-pages.mjs

      - name: SEO smoke
        run: npm run seo:smoke

      - name: Commit reconciled owner pages
        run: |
          if git diff --quiet; then
            echo 'No reconciliation diff produced.'
            exit 1
          fi
          git config user.name 'tiny-steps-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pages src/lib/routeSeoRegistry.js src/lib/commercialC3OwnerPageAudit.ts src/tests/seo/commercialC3OwnerPageAudit.spec.ts scripts/audit-commercial-c3-owner-pages.mjs vite.config.js
          git commit -m 'C3: reconcile all canonical commercial owner pages'
          git push origin HEAD:seo/c1-parent-commercial-search-universe
