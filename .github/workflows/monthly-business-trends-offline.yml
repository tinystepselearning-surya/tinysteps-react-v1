name: Monthly Business Trends offline verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/business-analytics-*.mjs'
      - 'scripts/test/business-analytics-*.node-test.mjs'
      - 'src/pages/admin/MonthlyBusinessTrends.tsx'
      - 'src/pages/admin/monthlyBusinessAnalytics.ts'
      - 'src/pages/admin/AnalyticsDashboardV3.tsx'
      - 'src/pages/admin/analyticsReadPlan.ts'
      - 'src/tests/pages/AnalyticsDashboardV3ReadPlan.spec.tsx'
      - '.github/workflows/monthly-business-trends-offline.yml'
permissions:
  contents: read
jobs:
  offline-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test/business-analytics-projection.node-test.mjs scripts/test/business-analytics-incremental.node-test.mjs
  ui-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run src/tests/pages/AnalyticsDashboardV3ReadPlan.spec.tsx
      - run: npm run typecheck
