name: Full Regression Certification

on:
  schedule:
    # 06:00 IST daily. GitHub Actions cron is UTC.
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-regression-certification
  cancel-in-progress: true

jobs:
  full-unit-suite:
    name: Full unit suite + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions --include=dev

      - name: Run complete unit suite with coverage
        run: npm run test:full:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-coverage-${{ github.sha }}
          path: coverage
          if-no-files-found: warn
          retention-days: 7

      - name: Publish coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
