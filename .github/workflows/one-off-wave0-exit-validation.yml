name: One-off Wave 0 Exit Validation

on:
  push:
    branches:
      - wave0/migration-standard-exit-review

permissions:
  contents: read

jobs:
  wave0-exit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exit-review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Wave 0 exit
        run: node scripts/validate-wave0-exit.mjs

      - name: Upload Wave 0 exit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave0-exit-validation-${{ github.sha }}
          path: reports/wave0-exit-validation.json
          if-no-files-found: error
          retention-days: 1
