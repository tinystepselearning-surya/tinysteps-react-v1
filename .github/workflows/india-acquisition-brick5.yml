name: India Acquisition Brick 5 Evidence Links Gate

on:
  pull_request:
    paths:
      - 'src/pages/public/OnlineEnglishClassesForKidsPage.tsx'
      - 'scripts/test/india-acquisition-brick5-evidence.node-test.mjs'
      - 'docs/seo/india-acquisition/BRICK_05_*'
      - '.github/workflows/india-acquisition-brick5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trusted-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test verified proof destinations and commercial SEO ownership
        run: node --test scripts/test/india-acquisition-brick5-evidence.node-test.mjs
      - name: TypeScript check
        run: npm run typecheck
      - name: Full production build and prerender SEO checks
        run: npm run build
