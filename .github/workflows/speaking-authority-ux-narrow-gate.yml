name: Speaking Authority UX Narrow Gate

on:
  push:
    branches:
      - ux/speaking-authority-latest-ui-20260920
    paths:
      - src/pages/public/ConfidenceBuildingProgramKidsPage.tsx
      - src/pages/PricingPage.tsx
      - src/pages/CurriculumPage.tsx
      - src/pages/TestimonialsPage.tsx
      - .github/workflows/speaking-authority-ux-narrow-gate.yml

permissions:
  contents: read

jobs:
  ux-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify latest UX markers
        run: |
          grep -q 'max-w-7xl' src/pages/public/ConfidenceBuildingProgramKidsPage.tsx
          grep -q 'rounded-\[32px\]' src/pages/public/ConfidenceBuildingProgramKidsPage.tsx
          ! grep -q 'page-gradient' src/pages/PricingPage.tsx
          ! grep -q 'glass-panel' src/pages/PricingPage.tsx
          ! grep -q 'gradient-chip' src/pages/PricingPage.tsx
          ! grep -q 'page-gradient' src/pages/CurriculumPage.tsx
          ! grep -q 'glass-panel' src/pages/CurriculumPage.tsx
          ! grep -q 'gradient-chip' src/pages/CurriculumPage.tsx
          grep -q 'font-heading' src/pages/TestimonialsPage.tsx
          grep -q 'rounded-\[32px\]' src/pages/TestimonialsPage.tsx

      - name: Run targeted regression tests
        run: |
          npx vitest run \
            src/tests/seo/commercialC3OwnerPageAudit.spec.ts \
            src/tests/seo/speakingGrowthBrick6.spec.ts \
            src/tests/seo/speakingGrowthBrick9.spec.ts \
            src/tests/seo/b14TrustEntitySchools.spec.ts \
            src/tests/seo/speakingGrowthFinalIntegration.spec.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Production build and prerender
        run: npm run build

      - name: SEO smoke
        run: npm run seo:smoke

      - name: Diff check
        run: git diff --check HEAD^ HEAD
