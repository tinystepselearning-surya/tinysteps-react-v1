name: One-shot blog title feed cleanup

on:
  push:
    branches:
      - seo/blog-index-title-guides

permissions:
  contents: write

jobs:
  cleanup-feed-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove unrelated generated-feed churn
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('public/feed.xml'),
              Path('public/rss.xml'),
              Path('public/blog/feed.xml'),
              Path('public/blog/rss.xml'),
          ]
          for path in files:
              text = path.read_text()
              text = text.replace(
                  '<lastBuildDate>Sat, 05 Sep 2026 22:14:38 GMT</lastBuildDate>',
                  '<lastBuildDate>Tue, 01 Sep 2026 15:14:03 GMT</lastBuildDate>',
              )
              path.write_text(text)

          for path in [Path('public/feed.xml'), Path('public/rss.xml')]:
              text = path.read_text()
              text = text.replace(
                  '<title>Parent FAQ: Classes, Fees &amp; English Learning | Tiny Steps</title>',
                  '<title>Frequently Asked Questions | Tiny Steps Learning</title>',
              )
              text = text.replace(
                  '<description>Answers for parents about Tiny Steps online English classes for kids: fees, class duration, teachers, progress, scheduling, policies and the free assessment.</description>',
                  '<description>Find answers to common questions about our 1:1 online English classes, curriculum, scheduling, pricing, and more.</description>',
              )
              path.write_text(text)
          PY

      - name: Verify final diff is blog-title only
        shell: bash
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD || true
          test "$(git diff origin/main -- src/lib/routeSeoRegistry.js | grep -c '^[-+]    title:' || true)" -eq 2
          test "$(git diff origin/main -- src/pages/blog/BlogIndexPage.tsx | grep -c '^[-+]  const metaTitle' || true)" -eq 2
          for f in public/feed.xml public/rss.xml public/blog/feed.xml public/blog/rss.xml; do
            test "$(git diff origin/main -- "$f" | grep -c '^[-+]      <title>' || true)" -eq 2
          done
          ! git diff origin/main -- public/feed.xml public/rss.xml | grep -q 'Frequently Asked Questions\|Parent FAQ'
          ! git diff origin/main -- public/feed.xml public/rss.xml public/blog/feed.xml public/blog/rss.xml | grep -q 'lastBuildDate'

      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-blog-title-cleanup.yml
          git add public/feed.xml public/rss.xml public/blog/feed.xml public/blog/rss.xml
          git commit -m "chore: keep blog title feed diff surgical"
          git push origin HEAD:seo/blog-index-title-guides
