name: Commercial C1 International + AI Research

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/commercialC1InternationalAiResearch.ts'
      - 'src/tests/seo/commercialC1InternationalAiResearch.spec.ts'
      - 'scripts/audit-commercial-c1-international-ai.mjs'
      - 'docs/seo/commercial-growth/C1_INTERNATIONAL_AI_RESEARCH.md'
      - '.github/workflows/commercial-c1-international-ai.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c1-international-ai:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for prerender
        run: npx playwright install --with-deps chromium
      - name: Run C1 international/AI tests
        run: npx vitest run src/tests/seo/commercialC1InternationalAiResearch.spec.ts src/tests/seo/commercialC1SearchUniverse.spec.ts src/tests/seo/commercialC0Foundation.spec.ts
      - name: Audit international/AI research
        run: node scripts/audit-commercial-c1-international-ai.mjs
      - name: Audit base C1 research
        run: node scripts/audit-commercial-c1-search-universe.mjs
      - name: Run type check
        run: npm run typecheck
      - name: Run full repository tests
        run: npm test
      - name: Build and prerender public site
        run: npm run build
      - name: Re-run international/AI audit after build
        run: node scripts/audit-commercial-c1-international-ai.mjs
      - name: Run SEO smoke
        run: npm run seo:smoke
