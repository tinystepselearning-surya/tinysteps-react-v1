name: Resources R1 Semantic Facts

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/config/semanticFacts.ts'
      - 'src/config/publicFacts.ts'
      - 'src/config/publicOffer.ts'
      - 'src/config/pricing.ts'
      - 'src/constants/publicContact.ts'
      - 'src/content/courses.ts'
      - 'src/content/phonicsCurriculum.ts'
      - 'src/lib/schemas.ts'
      - 'src/lib/officialProfiles.ts'
      - 'src/lib/founderProfiles.ts'
      - 'src/lib/pinterestProfile.ts'
      - 'src/lib/quoraProfile.ts'
      - 'src/components/common/Meta.tsx'
      - 'src/components/common/Footer.tsx'
      - 'src/components/entity/OfficialProfilesSection.tsx'
      - 'src/tests/seo/resourcesR1SemanticFacts.spec.ts'
      - 'src/tests/seo/quoraEntityLink.spec.ts'
      - 'src/tests/seo/b15OffsiteEntityCorroboration.spec.ts'
      - 'scripts/audit-public-facts.mjs'
      - 'docs/seo/resources-architecture/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resources-r1-semantic-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Brick 1 semantic facts tests
        run: >-
          npx vitest run
          src/tests/seo/resourcesR1SemanticFacts.spec.ts
          src/tests/seo/quoraEntityLink.spec.ts
          src/tests/seo/b15OffsiteEntityCorroboration.spec.ts

      - name: Run public semantic facts source audit
        run: npm run content:public-facts

      - name: Run type check
        run: npm run typecheck

      # Mirror the production build chain as named steps so any regression is
      # attributable to the exact existing SEO/prerender guard that rejects it.
      - name: Run prebuild shadowing and RSS checks
        run: npm run prebuild

      - name: Generate sitemaps
        run: npm run gen:sitemaps

      - name: Run blog consolidation source audit
        run: npm run seo:blog-consolidation

      - name: Build Vite application
        run: npx vite build

      - name: Write build metadata
        run: node scripts/write-build-info.mjs

      - name: Prerender public website
        run: node scripts/prerender.mjs

      - name: Run rendered SEO checks
        run: npm run seo:rendered-check

      - name: Run rendered blog consolidation audit
        run: npm run seo:blog-rendered-consolidation

      - name: Run rendered public semantic facts audit
        run: npm run content:public-facts-rendered

      - name: Run route integrity guard
        run: npm run seo:route-integrity

      - name: Run indexation guard
        run: npm run seo:indexation-check

      - name: Generate indexability report
        run: npm run seo:indexability-report

      - name: Run GSC crawled-not-indexed audit
        run: npm run seo:gsc-crawled-audit

      - name: Run GSC archive rendering audit
        run: npm run seo:gsc-archive-rendering

      - name: Write GSC index submission targets
        run: npm run seo:gsc-index-targets

      - name: Verify public bundle budget
        run: npm run bundle:public-check

      - name: Run public offer consistency guard
        run: npm run content:offer-consistency

      - name: Write IndexNow key
        run: node scripts/write-indexnow-key.mjs
