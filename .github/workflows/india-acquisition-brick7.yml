name: India Acquisition Brick 7 Grammar Intent Gate

on:
  pull_request:
    paths:
      - 'src/pages/grammar.tsx'
      - 'scripts/test/india-acquisition-brick7-grammar.node-test.mjs'
      - 'docs/seo/india-acquisition/BRICK_07_*'
      - '.github/workflows/india-acquisition-brick7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grammar-intent-and-prerender:
    name: Check Grammar ownership, parent-choice facts and rendered build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium for prerender
        run: npx playwright install --with-deps chromium
      - name: Verify Grammar commercial intent and group format claims
        run: node --test scripts/test/india-acquisition-brick7-grammar.node-test.mjs
      - name: TypeScript validation
        run: npm run typecheck
      - name: Build and check generated SEO surfaces
        run: npm run build
