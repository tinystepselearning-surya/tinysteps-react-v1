name: Team Two-Layer Portraits and Teaching Quality Gate

on:
  pull_request:
    paths:
      - 'public/team/**'
      - 'src/pages/TeamPage.tsx'
      - 'src/pages/team/**'
      - 'src/types/teamPhotoManifest.d.ts'
      - 'scripts/teamPhotoManifest.mjs'
      - 'scripts/test/team-photo-manifest.node-test.mjs'
      - 'vite.config.js'
      - '.github/workflows/team-two-layer-portraits.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  team-page:
    name: Verify two-layer roster, photos, academic assurance and SEO
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check teacher filename parsing, consent-safe roster and audit content
        run: node --test scripts/test/team-photo-manifest.node-test.mjs
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run Team page rendering and metadata regression tests
        run: npx vitest run src/tests/pages/TeamPage.spec.tsx
      - name: Install Chromium for real prerender
        run: npx playwright install --with-deps chromium
      - name: Build complete public site (no deployment)
        run: npm run build
      - name: Verify Google-readable Team HTML and canonical
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const html = fs.readFileSync('dist/team/index.html', 'utf8');
          assert.match(html, /Meet the educators behind every live lesson/);
          assert.match(html, /Early Years &amp; Primary English Educators/);
          assert.match(html, /Teacher training is only the beginning/);
          assert.match(html, /Ongoing lesson and conduct reviews/);
          assert.match(html, /Feedback, coaching and follow-up/);
          assert.match(html, /rel="canonical"[^>]*href="https:\/\/tinystepslearning\.com\/team"/);
          assert.doesNotMatch(html, /<meta[^>]*name="robots"[^>]*content="noindex/);
          assert.match(html, /\/priya-founder-tiny-steps-learning\.webp|\/team\/Founder\.webp/);
          const { getTeamPhotoManifest } = await import('./scripts/teamPhotoManifest.mjs');
          const published = getTeamPhotoManifest('public/team');
          for (const portrait of published.teachers) {
            assert.ok(html.includes(portrait.src), portrait.name + ': image present in rendered Team page');
            assert.ok(html.includes(portrait.name), portrait.name + ': visible name present in Team page');
            assert.ok(fs.existsSync('dist' + decodeURIComponent(portrait.src)), portrait.name + ': actual WebP copied into hosting artifact');
          }
          assert.ok(html.includes(published.founderPhotoSrc), 'founder chosen asset appears in prerender');

          console.log('Founder, teachers, ongoing audits, canonical and build HTML verified');
          NODE