name: Legacy Session Writers Retirement
on:
  pull_request:
    paths:
      - 'functions/src/scheduling/legacy14DayCutover.ts'
      - 'functions/src/scheduling/rollingScheduleMaterializer.ts'
      - 'functions/src/scheduling/rollingScheduleLifecycle.ts'
      - 'functions/src/scheduling/rollingScheduleReconciliation.ts'
      - 'functions/src/scheduling/rollingScheduleCompatibility.ts'
      - 'functions/src/scheduling/rollingScheduleCourseTransition.ts'
      - 'functions/src/scheduling/rollingScheduleRepair.ts'
      - 'functions/src/scheduling/futureScheduleOrchestration.ts'
      - 'functions/src/scheduled/rollingScheduleEdgeReplenisher.ts'
      - 'functions/src/createSessionsFromSchedule.ts'
      - 'functions/src/lifecycle.ts'
      - 'functions/test/legacy14DaySessionWritersRetired.spec.ts'
      - '.github/workflows/legacy-session-writers-retirement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-deploy-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Install frontend and Functions test dependencies
        run: npm ci --ignore-scripts && npm ci --prefix functions --include=dev --ignore-scripts
      - name: Full Functions TypeScript build
        run: npm --prefix functions run build
      - name: Cutover hard-stop and entire functions regression suite
        run: npm --prefix functions test
      - name: Verify targeted Functions deployment impact (no deploy)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          baseline="$(git merge-base origin/main HEAD)"
          node scripts/resolve-deployment-impact.mjs \
            --before "$baseline" \
            --functions-before "$baseline" \
            --sha "$(git rev-parse HEAD)" | tee /tmp/legacy-writer-impact.txt
          grep -q 'Functions full deployment: false' /tmp/legacy-writer-impact.txt
          grep -q 'Hosting changed: false' /tmp/legacy-writer-impact.txt
          grep -q 'Firestore rules changed: false' /tmp/legacy-writer-impact.txt
          grep -q 'Firestore indexes changed: false' /tmp/legacy-writer-impact.txt
      - name: Deployment safety
        run: echo "Verification only; no Cloud Functions or Firestore updates."
