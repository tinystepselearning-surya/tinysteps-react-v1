name: Commercial Parent-Intent Routing Pilot Gate

on:
  pull_request:
    paths:
      - 'src/content/blog/shared/conversionFamilies.ts'
      - 'src/tests/seo/blogB11LeadAttribution.spec.ts'
      - 'docs/seo/commercial-parent-intent-routing-pilot-20261116.md'
      - '.github/workflows/commercial-parent-intent-routing-gate.yml'

permissions:
  contents: read

jobs:
  verify-parent-intent-routing:
    name: Blog intent, programme owners, TypeScript and SEO build (no deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check blog conversion and programme owner regressions
        run: >-
          npx vitest run
          src/tests/seo/blogB11LeadAttribution.spec.ts
          src/tests/seo/readingAuthorityConsolidation.spec.ts
          src/tests/seo/speakingEcosystemNavigation.spec.ts
          src/tests/seo/commercialC3OwnerPageAudit.spec.ts
      - name: TypeScript check
        run: npm run typecheck
      - name: Install Chromium for SEO prerender
        run: npx playwright install --with-deps chromium
      - name: Validate production SEO build without deploying
        run: npm run build
