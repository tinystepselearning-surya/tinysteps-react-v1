name: ARG-1 Demo Request Event Semantics Gate

on:
  pull_request:
    paths:
      - 'src/components/forms/PublicAssessmentForm.tsx'
      - 'src/lib/conversionTracking.ts'
      - 'src/tests/components/PublicAssessmentForm.spec.tsx'
      - 'scripts/audit-commercial-c5-conversion-flow.mjs'
      - 'docs/acquisition/ARG1_DEMO_REQUEST_EVENT_CUTOVER_20261101.md'
      - '.github/workflows/arg1-demo-request-event-semantics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-vs-booking:
    name: Verify lead receipt and booking-event semantics
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium for SEO prerender
        run: npx playwright install --with-deps chromium
      - name: Form integration tests
        run: npx vitest run src/tests/components/PublicAssessmentForm.spec.tsx
      - name: Commercial C5 source contract
        run: node scripts/audit-commercial-c5-conversion-flow.mjs
      - name: TypeScript check
        run: npm run typecheck
      - name: Full prerender and SEO build
        run: npm run build
