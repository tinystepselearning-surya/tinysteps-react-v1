name: India Acquisition Brick 3 Phonics Commercial Gate

on:
  pull_request:
    paths:
      - 'src/pages/phonics.tsx'
      - 'scripts/test/india-acquisition-brick3-phonics.node-test.mjs'
      - 'docs/seo/india-acquisition/BRICK_03_*'
      - '.github/workflows/india-acquisition-brick3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phonics-intent-and-render:
    name: Verify Phonics ownership, format facts and rendered build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Phonics format regression tests
        run: node --test scripts/test/india-acquisition-brick3-phonics.node-test.mjs
      - name: TypeScript validation
        run: npm run typecheck
      - name: Full build, SEO and prerender validation
        run: npm run build
