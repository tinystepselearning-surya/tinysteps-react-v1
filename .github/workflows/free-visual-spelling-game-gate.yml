name: Free Visual Spelling Game Quality Gate

on:
  pull_request:
    paths:
      - 'src/app/routes.tsx'
      - 'src/lib/visualSpellingPuzzles.ts'
      - 'src/pages/kids/games/VisualSpellingPuzzleLab.tsx'
      - 'src/pages/kids/games/VisualSpellingPuzzleLab.css'
      - 'src/pages/public/PublicEnglishGamePlayer.tsx'
      - 'src/pages/public/FreeEnglishGameLandingPage.tsx'
      - 'src/pages/public/SpellingGamesLanding.tsx'
      - 'src/pages/kids/games/phonics/CvcWordReader/MakeAWordRimeGame.tsx'
      - 'src/lib/publicEnglishGames.ts'
      - 'src/tests/pages/public/FreeEnglishGameLandingPage.spec.tsx'
      - 'src/pages/public/FreeEnglishGamesHubPage.tsx'
      - 'src/pages/KidsGamesHub.tsx'
      - 'src/tests/pages/VisualSpellingPuzzles.spec.ts'
      - 'src/tests/pages/VisualSpellingPuzzleLab.spec.tsx'
      - 'tests/free-visual-spelling-focus.spec.ts'
      - '.github/workflows/free-visual-spelling-game-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-visual-spelling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Visual spelling puzzles — TypeScript and focused unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Validate all spelling content and anonymous gameplay
        run: >-
          npx vitest run
          src/tests/pages/VisualSpellingPuzzles.spec.ts
          src/tests/pages/VisualSpellingPuzzleLab.spec.tsx
          src/tests/pages/public/FreeEnglishGameLandingPage.spec.tsx
      - name: Install Chromium for game route checks
        run: npx playwright install --with-deps chromium
      - name: Test immersive puzzle route and classic-game regression in browser
        run: npx playwright test tests/free-visual-spelling-focus.spec.ts
      - name: No deploy
        run: echo 'Validation only; never deploys or modifies Firebase.'
