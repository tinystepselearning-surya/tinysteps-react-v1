name: TSOS V2 isolated D13 verification
on:
  push:
    branches: [docs/tsos-v2-d13-isolated-verification]
permissions:
  contents: read
jobs:
  marker-resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
      - name: Verify exact Git history and resolver output
        shell: bash
        run: |
          set -euo pipefail
          candidate="a5a6555c7cd956d12875c16d1953ae62e81f4148"
          main="$(git rev-parse refs/remotes/origin/main)"
          functions="$(git rev-parse refs/remotes/origin/ci/functions-production)"
          hosting="$(git rev-parse refs/remotes/origin/ci/hosting-production)"
          rules="$(git rev-parse refs/remotes/origin/ci/firestore-rules-production)"
          indexes="$(git rev-parse refs/remotes/origin/ci/firestore-indexes-production)"
          git checkout --detach "$candidate"
          echo "Candidate: $candidate" | tee -a "$GITHUB_STEP_SUMMARY"
          export GITHUB_OUTPUT="$RUNNER_TEMP/tsos-impact"
          node scripts/resolve-deployment-impact.mjs --before "$main" --functions-before "$functions" --hosting-before "$hosting" --firestore-rules-before "$rules" --firestore-indexes-before "$indexes" --sha "$candidate"
          for result in functions_deployment_required=false functions_full_deployment=false functions_targets= functions_retired_targets= hosting_changed=false firestore_rules_changed=false firestore_indexes_changed=false; do
            grep -Fx "$result" "$GITHUB_OUTPUT"
          done
  collector-and-functions-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a5a6555c7cd956d12875c16d1953ae62e81f4148
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix functions --ignore-scripts --include=dev --no-audit --no-fund
      - name: Test collector and previously skipped Functions cases in demo Firestore
        shell: bash
        run: |
          set -euo pipefail
          unset FIREBASE_TOKEN GOOGLE_APPLICATION_CREDENTIALS
          node -e 'const src=require("./firebase.json");require("node:fs").writeFileSync("firebase.d13.local.json",JSON.stringify({firestore:src.firestore,emulators:{firestore:{host:"127.0.0.1",port:8787},ui:{enabled:false},singleProjectMode:false}}))'
          cat > d13-emulator-checks.sh <<'SCRIPT'
          set -euo pipefail
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8787
          GCLOUD_PROJECT=demo-tsos-bounded-collector GOOGLE_CLOUD_PROJECT=demo-tsos-bounded-collector node --test scripts/test/bounded-reconciliation-collector.emulator.node-test.mjs
          export GCLOUD_PROJECT=demo-tinysteps-admissions-retry GOOGLE_CLOUD_PROJECT=demo-tinysteps-admissions-retry
          npm --prefix functions test -- --maxWorkers=1 test/websiteLeadDeduplication.emulator.spec.ts test/leadFunnel.emulator.spec.ts
          npm --prefix functions test -- --maxWorkers=1 test/leadDemoAutoWorkflow.emulator.spec.ts -t 'emulator integrity'
          npm --prefix functions test -- --maxWorkers=1 test/getParentWorksheetResources.spec.ts -t 'Firestore integration'
          M3_FINANCE_EMULATOR_ONLY=1 GCLOUD_PROJECT=demo-tinysteps-finance-consistency GOOGLE_CLOUD_PROJECT=demo-tinysteps-finance-consistency npm --prefix functions test -- --maxWorkers=1 test/milestone3FirestoreFinanceEmulator.spec.ts test/milestone3FirestoreFinanceCompatibility.spec.ts
          SCRIPT
          npx --yes firebase-tools@15.37.0 emulators:exec --config firebase.d13.local.json --project demo-tinysteps-admissions-retry --only firestore 'bash d13-emulator-checks.sh'
