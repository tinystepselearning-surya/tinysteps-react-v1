name: ARG-2 Prospective Acquisition Report Gate

on:
  pull_request:
    paths:
      - 'functions/src/prospectiveAcquisitionMetrics.ts'
      - 'functions/src/getProspectiveAcquisitionSummary.ts'
      - 'functions/src/index.ts'
      - 'functions/test/prospectiveAcquisitionMetrics.spec.ts'
      - 'src/pages/admin/ProspectiveAcquisitionSummary.tsx'
      - 'src/pages/admin/LeadSourceAnalysis.tsx'
      - 'docs/acquisition/ARG2_LIVE_REPORT_RELEASE_GATES_20261101.md'
      - '.github/workflows/arg2-prospective-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    name: Verify restricted forward-only acquisition reporting
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
      - name: Install functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund
      - name: Run targeted aggregate tests
        run: cd functions && npx vitest run --config vitest.config.ts functions/test/prospectiveAcquisitionMetrics.spec.ts
      - name: Build Functions TypeScript
        run: npm --prefix functions run build
      - name: Install website dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Full SEO/prerender build
        run: npm run build
