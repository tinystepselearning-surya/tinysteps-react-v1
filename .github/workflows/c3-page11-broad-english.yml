name: C3 Page 11 Broad English Apply

on:
  push:
    branches:
      - seo/c1-parent-commercial-search-universe
    paths:
      - '.github/workflows/c3-page11-broad-english.yml'

permissions:
  contents: write

jobs:
  apply-broad-english:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/c1-parent-commercial-search-universe
          fetch-depth: 0
      - name: Remove cosmetic grid patch from helper
        run: python scripts/tmp-c3-page11-remove-grid-patch.py
      - name: Apply Page 11 broad English reconciliation
        run: python scripts/tmp-c3-page11-broad-english.py
      - name: Focused source check
        run: |
          git diff --check
          grep -F "Online English Classes for Kids | Live 1:1 | Tiny Steps" src/pages/public/OnlineEnglishClassesForKidsPage.tsx
          grep -F "Online English Classes for Kids | Live 1:1 | Tiny Steps" src/lib/routeSeoRegistry.js
          grep -F "title: 'Writing'" src/pages/public/OnlineEnglishClassesForKidsPage.tsx
          grep -F "title: 'Spoken English'" src/pages/public/OnlineEnglishClassesForKidsPage.tsx
          grep -F "title: 'Public Speaking & Communication'" src/pages/public/OnlineEnglishClassesForKidsPage.tsx
      - name: Commit Page 11 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/public/OnlineEnglishClassesForKidsPage.tsx src/lib/routeSeoRegistry.js
          git commit -m 'C3 page 11: reconcile broad global English owner'
          git push origin HEAD:seo/c1-parent-commercial-search-universe
