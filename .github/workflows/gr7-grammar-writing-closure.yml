name: GR7 Grammar Writing Closure Freeze

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/grammarWritingKnowledgeTaxonomy.*'
      - 'src/lib/grammarWritingTenseArchitecture.*'
      - 'src/lib/grammarWritingWritingProgression.*'
      - 'src/lib/grammarWritingParentProblemArchitecture.*'
      - 'src/lib/grammarWritingPracticeUtilities.*'
      - 'src/lib/grammarWritingGr6SemanticGraph.*'
      - 'src/lib/grammarWritingGr7Closure.*'
      - 'src/lib/grammarWritingKnowledgeArchitecture.js'
      - 'src/lib/grammarWritingSemanticJourneyGraph.js'
      - 'src/lib/grammarWritingSemanticCanonicalOwnership.js'
      - 'src/lib/canonicalTopicOwnershipRegistry.js'
      - 'src/content/courses.ts'
      - 'src/tests/seo/grammarWritingGr1Taxonomy.spec.ts'
      - 'src/tests/seo/grammarWritingGr2TenseArchitecture.spec.ts'
      - 'src/tests/seo/grammarWritingGr3WritingProgression.spec.ts'
      - 'src/tests/seo/grammarWritingGr4ParentProblems.spec.ts'
      - 'src/tests/seo/grammarWritingGr5PracticeUtilities.spec.ts'
      - 'src/tests/seo/grammarWritingGr6SemanticGraph.spec.ts'
      - 'src/tests/seo/grammarWritingGr7Closure.spec.ts'
      - 'src/tests/seo/resourcesR17GrammarWritingArchitecture.spec.ts'
      - 'src/tests/seo/resourcesR19GrammarWritingSemanticJourneys.spec.ts'
      - 'scripts/audit-grammar-writing-gr1-taxonomy.mjs'
      - 'scripts/audit-grammar-writing-gr2-tenses.mjs'
      - 'scripts/audit-grammar-writing-gr3-writing-progression.mjs'
      - 'scripts/audit-grammar-writing-gr4-parent-problems.mjs'
      - 'scripts/audit-grammar-writing-gr5-practice-utilities.mjs'
      - 'scripts/audit-grammar-writing-gr6-semantic-graph.mjs'
      - 'scripts/audit-grammar-writing-gr7-closure.mjs'
      - 'scripts/audit-resources-r19-grammar-writing-semantic-journeys.mjs'
      - 'docs/seo/resources-architecture/GR1_*'
      - 'docs/seo/resources-architecture/GR2_*'
      - 'docs/seo/resources-architecture/GR3_*'
      - 'docs/seo/resources-architecture/GR4_*'
      - 'docs/seo/resources-architecture/GR5_*'
      - 'docs/seo/resources-architecture/GR6_*'
      - 'docs/seo/resources-architecture/GR7_*'
      - '.github/workflows/gr7-grammar-writing-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gr7-grammar-writing-closure-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for prerender
        run: npx playwright install --with-deps chromium
      - name: Run GR1-GR7 and grammar Resources regression tests
        run: npx vitest run src/tests/seo/grammarWritingGr1Taxonomy.spec.ts src/tests/seo/grammarWritingGr2TenseArchitecture.spec.ts src/tests/seo/grammarWritingGr3WritingProgression.spec.ts src/tests/seo/grammarWritingGr4ParentProblems.spec.ts src/tests/seo/grammarWritingGr5PracticeUtilities.spec.ts src/tests/seo/grammarWritingGr6SemanticGraph.spec.ts src/tests/seo/grammarWritingGr7Closure.spec.ts src/tests/seo/resourcesR17GrammarWritingArchitecture.spec.ts src/tests/seo/resourcesR19GrammarWritingSemanticJourneys.spec.ts
      - name: Audit GR1 grammar and writing taxonomy
        run: node scripts/audit-grammar-writing-gr1-taxonomy.mjs --report
      - name: Audit GR2 tense architecture
        run: node scripts/audit-grammar-writing-gr2-tenses.mjs --report
      - name: Audit GR3 writing progression
        run: node scripts/audit-grammar-writing-gr3-writing-progression.mjs --report
      - name: Audit GR4 parent problem architecture
        run: node scripts/audit-grammar-writing-gr4-parent-problems.mjs --report
      - name: Audit GR5 practice utilities
        run: node scripts/audit-grammar-writing-gr5-practice-utilities.mjs --report
      - name: Audit GR6 semantic graph
        run: node scripts/audit-grammar-writing-gr6-semantic-graph.mjs --report
      - name: Audit GR7 closure freeze
        run: node scripts/audit-grammar-writing-gr7-closure.mjs --report
      - name: Audit R19 grammar and writing semantic journeys
        run: node scripts/audit-resources-r19-grammar-writing-semantic-journeys.mjs --report
      - name: Audit R17 grammar and writing architecture after R18 execution
        run: node scripts/audit-resources-r17-grammar-writing-architecture.mjs --r18-executed --report
      - name: Audit canonical topic ownership
        run: node scripts/audit-canonical-topic-ownership.mjs
      - name: Check shadowing
        run: node scripts/check-shadowing.mjs
      - name: Run type check
        run: npm run typecheck
      - name: Build and prerender public site
        run: npm run build
      - name: Re-audit rendered R19 grammar and writing journeys
        run: node scripts/audit-resources-r19-grammar-writing-semantic-journeys.mjs --dist --report
      - name: Check public games navigation
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/gr7-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/login >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/gr7-preview.log
            exit 1
          fi
          npm run seo:public-games-navigation
      - name: Run SEO smoke
        run: npm run seo:smoke
      - name: Upload GR1-GR7 closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grammar-writing-gr1-gr7-closure
          path: |
            artifacts/grammar-writing-gr1-taxonomy.json
            artifacts/grammar-writing-gr2-tenses.json
            artifacts/grammar-writing-gr3-writing-progression.json
            artifacts/grammar-writing-gr4-parent-problems.json
            artifacts/grammar-writing-gr5-practice-utilities.json
            artifacts/grammar-writing-gr6-semantic-graph.json
            artifacts/grammar-writing-gr7-closure.json
            artifacts/resources-r19-grammar-writing-semantic-journeys.json
          if-no-files-found: warn
