name: GSC Content Quality & Consolidation Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gsc-content-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and prerender public pages
        run: npm run build

      - name: Certify GSC content quality and consolidation
        run: node scripts/gsc-content-quality-guard.mjs

      - name: Upload GSC content quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-content-quality-report
          path: artifacts/gsc-content-quality-report.json
          if-no-files-found: ignore
