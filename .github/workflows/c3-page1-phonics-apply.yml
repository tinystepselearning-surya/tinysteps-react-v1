name: C3 Page 1 Phonics Apply

on:
  push:
    paths:
      - '.github/workflows/c3-page1-phonics-apply.yml'
      - 'scripts/c3-page1-phonics-apply.py'

permissions:
  contents: write

jobs:
  apply-phonics-owner:
    if: github.ref == 'refs/heads/seo/c1-parent-commercial-search-universe'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/c1-parent-commercial-search-universe
          fetch-depth: 0
      - name: Apply Page 1 reconciliation
        run: python scripts/c3-page1-phonics-apply.py
      - name: Review Page 1 diff
        run: |
          git diff --check
          git diff -- src/pages/phonics.tsx src/lib/routeSeoRegistry.js
      - name: Commit Page 1 only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/phonics.tsx src/lib/routeSeoRegistry.js
          git commit -m "C3 page 1: thoroughly reconcile phonics commercial owner"
          git push origin HEAD:seo/c1-parent-commercial-search-universe
