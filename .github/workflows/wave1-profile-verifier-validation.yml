name: Wave 1 Profile Verifier Validation

on:
  push:
    branches:
      - wave1/identity-profile-independent-verifier

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check scripts/verification/wave1-identity-profile-verify-lib.mjs
          node --check scripts/wave1-identity-profile-verify.mjs
          node --check scripts/test/wave1-identity-profile-verify.node-test.mjs
      - name: Independent verifier regression tests
        run: node --test scripts/test/wave1-identity-profile-verify.node-test.mjs
