name: Resources GV3 Grammar Reference Extension

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/grammarReferenceExtension*'
      - 'src/lib/grammarKnowledgeRegistry*'
      - 'src/lib/grammarKnowledgeSources.js'
      - 'src/lib/publicRouteManifest.js'
      - 'src/lib/routeSeoRegistry.js'
      - 'src/lib/canonicalTopicOwnershipRegistry.js'
      - 'src/lib/aiAnswerLayerRegistry.js'
      - 'src/pages/GrammarKnowledgePage.tsx'
      - 'src/pages/SubjectResourcesPage.tsx'
      - 'src/components/resources/GrammarReferenceExtensionGuideGrid.tsx'
      - 'src/tests/seo/grammarReferenceExtensionGv3.spec.ts'
      - 'src/tests/seo/grammarProgrammaticResources.spec.ts'
      - 'src/tests/seo/resourcesR24R26AiAnswerLayers.spec.ts'
      - 'scripts/audit-grammar-reference-extension-gv3.mjs'
      - 'scripts/audit-canonical-topic-ownership.mjs'
      - 'scripts/audit-ai-answer-layers.mjs'
      - 'scripts/generate-rss.mjs'
      - 'docs/seo/resources-architecture/GV3_*'
      - '.github/workflows/resources-gv3-grammar-reference-extension.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  resources-gv3-grammar-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run GV3 authority and architecture regressions
        run: >
          npx vitest run
          src/tests/seo/grammarReferenceExtensionGv3.spec.ts
          src/tests/seo/grammarProgrammaticResources.spec.ts
          src/tests/seo/grammarVocabularyAuthorityRequirements.spec.ts
          src/tests/seo/resourcesR24R26AiAnswerLayers.spec.ts
          src/tests/seo/grammarWritingGr6SemanticGraph.spec.ts
          src/tests/seo/commercialC7ContextualHandoffs.spec.ts
      - name: Audit GV3 source publication contract
        run: node scripts/audit-grammar-reference-extension-gv3.mjs
      - name: Audit canonical ownership
        run: node scripts/audit-canonical-topic-ownership.mjs
      - name: Lint GV3 TypeScript surfaces
        run: >
          npx eslint
          src/pages/GrammarKnowledgePage.tsx
          src/pages/SubjectResourcesPage.tsx
          src/components/resources/GrammarReferenceExtensionGuideGrid.tsx
          src/tests/seo/grammarReferenceExtensionGv3.spec.ts
      - name: Run type check
        run: npm run typecheck
      - name: Install Chromium for prerender
        run: npx playwright install --with-deps chromium
      - name: Build and prerender public site
        run: npm run build
      - name: Verify rendered GV3 publication contract
        run: node scripts/audit-grammar-reference-extension-gv3.mjs --dist
      - name: Verify generated AI answer layers
        run: node scripts/audit-ai-answer-layers.mjs --generated
