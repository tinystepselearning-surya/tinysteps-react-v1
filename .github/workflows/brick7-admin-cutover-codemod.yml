name: Brick 7 Admin Cutover Codemod

on:
  push:
    branches:
      - rolling-schedule-brick-7-admin-cutover
    paths:
      - .github/workflows/brick7-admin-cutover-codemod.yml
      - scripts/brick7-admin-cutover-codemod.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rolling-schedule-brick-7-admin-cutover
      - name: Apply admin cutover
        run: python3 scripts/brick7-admin-cutover-codemod.py
      - name: Commit transformed source
        run: |
          rm scripts/brick7-admin-cutover-codemod.py
          rm .github/workflows/brick7-admin-cutover-codemod.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/StudentManagement/StudentList.tsx scripts/brick7-admin-cutover-codemod.py .github/workflows/brick7-admin-cutover-codemod.yml
          git commit -m "Cut admin scheduler over to rolling recurrence"
          git push origin HEAD:rolling-schedule-brick-7-admin-cutover
