name: Brick 7 Admin Cutover Codemod

on:
  push:
    branches:
      - rolling-schedule-brick-7-admin-cutover
    paths:
      - .github/workflows/brick7-admin-cutover-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rolling-schedule-brick-7-admin-cutover
      - name: Apply Brick 7 codemod
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/pages/admin/StudentManagement/StudentList.tsx')
          s = p.read_text()
          original = s

          # Remove schedule-stats-only import; rolling admin UI no longer scans all sessions.
          s = s.replace("import { doesSessionMatchEnrollmentSchedule } from '../../../lib/sessionScheduleIntegrity';\n", '')

          # Extend the enrollment schedule type with the canonical rolling contract while retaining legacy read fields.
          old = """  schedule?: {\n    timezone?: string;\n    // Weekday mapping follows JS Date.getDay(): 0=Sun, 1=Mon, ... 6=Sat.\n"""
          new = """  schedule?: {\n    schemaVersion?: number;\n    deliveryMode?: string;\n    revision?: number;\n    timezone?: string;\n    // Weekday mapping follows JS Date.getDay(): 0=Sun, 1=Mon, ... 6=Sat.\n"""
          if old not in s: raise SystemExit('Enrollment schedule type anchor missing')
          s = s.replace(old, new, 1)

          # Remove the obsolete finite coverage estimator and full-history modal statistics helpers.
          pattern = re.compile(r"const SCHEDULE_EXCEPTION_SOURCE_TOKENS = \[.*?\nfunction formatYMDCompact\(d: Date\): string \{", re.S)
          m = pattern.search(s)
          if not m: raise SystemExit('finite coverage/stat helper block missing')
          s = s[:m.start()] + "function formatYMDCompact(d: Date): string {" + s[m.end():]

          # Replace finite schedule state with one rolling lifecycle action state.
          old = """  const [feePerClass, setFeePerClass] = useState<number>(0);\n  const [generateWeeks, setGenerateWeeks] = useState<number>(8);\n  const [plannedSessions, setPlannedSessions] = useState<number>(0);\n  const [endDate, setEndDate] = useState<string>(''); // optional\n  const [meetingLink, setMeetingLink] = useState<string>(''); // optional (Zoom/Meet)\n  const [savingSchedule, setSavingSchedule] = useState<boolean>(false);\n  const [pauseUpcomingCount, setPauseUpcomingCount] = useState<number>(1);\n  const [pausingSchedule, setPausingSchedule] = useState<boolean>(false);\n  const [resumingSchedule, setResumingSchedule] = useState<boolean>(false);\n  const [scheduleLiveStats, setScheduleLiveStats] = useState<{\n    consumedCount: number;\n    activeFutureCount: number;\n    pausedFutureCount: number;\n    makeupRescheduleCount: number;\n    pendingMakeupCount: number;\n  } | null>(null);\n"""
          new = """  const [feePerClass, setFeePerClass] = useState<number>(0);\n  const [meetingLink, setMeetingLink] = useState<string>(''); // optional Teams meeting link\n  const [savingSchedule, setSavingSchedule] = useState<boolean>(false);\n  const [scheduleLifecycleAction, setScheduleLifecycleAction] = useState<'paused' | 'active' | 'discontinued' | null>(null);\n"""
          if old not in s: raise SystemExit('schedule state block missing')
          s = s.replace(old, new, 1)

          # Remove finite form hydration and coverage preview.
          old = """    setDurationMins(normalizedSlots[0]?.durationMinutes ?? baseDuration);\n    setGenerateWeeks(safeNumber(enrollment.schedule?.weeksAhead, 8));\n    setPlannedSessions(safeNumber(enrollment.schedule?.plannedSessions, 0));\n    setEndDate(\n      typeof enrollment.schedule?.endDateYmd === 'string'\n        ? enrollment.schedule.endDateYmd\n        : '',\n    );\n    setFeePerClass(safeNumber(enrollment.feePerClass, 0));\n"""
          new = """    setDurationMins(normalizedSlots[0]?.durationMinutes ?? baseDuration);\n    setFeePerClass(safeNumber(enrollment.feePerClass, 0));\n"""
          if old not in s: raise SystemExit('finite hydration block missing')
          s = s.replace(old, new, 1)
          preview = re.compile(r"  const plannedCoveragePreview = useMemo\(.*?\n  \);\n", re.S)
          s, count = preview.subn('', s, count=1)
          if count != 1: raise SystemExit('plannedCoveragePreview block missing')

          # Add a local rolling-contract detector used for safe gradual conversion.
          anchor = """function normalizeEnrollmentStatus(value: any): string {\n"""
          helper = """function isCanonicalRollingEnrollmentForAdmin(enrollment: EnrollmentLite | null | undefined): boolean {\n  return Boolean(\n    enrollment?.schedule &&\n    Number(enrollment.schedule.schemaVersion) === 1 &&\n    String(enrollment.schedule.deliveryMode || '').trim().toLowerCase() === 'rolling' &&\n    String(enrollment.schedule.timezone || '').trim() === 'Asia/Kolkata'\n  );\n}\n\n"""
          if anchor not in s: raise SystemExit('normalizeEnrollmentStatus anchor missing')
          s = s.replace(anchor, helper + anchor, 1)

          # Remove the broad classSessions-by-enrollment modal statistics effect and finite progress display values.
          pattern = re.compile(r"  useEffect\(\(\) => \{\n    let cancelled = false;\n    const run = async \(\) => \{\n      if \(!selectedScheduleEnrollment\?\.id\).*?\n  const studentById = useMemo", re.S)
          m = pattern.search(s)
          if not m: raise SystemExit('schedule live stats/progress block missing')
          replacement = """  const selectedScheduleStatus = normalizeEnrollmentStatus(selectedScheduleEnrollment?.status);\n  const selectedScheduleIsRolling = isCanonicalRollingEnrollmentForAdmin(selectedScheduleEnrollment);\n  const selectedScheduleIsTerminal = isPastEnrollmentStatus(selectedScheduleStatus);\n\n  const studentById = useMemo"""
          s = s[:m.start()] + replacement + s[m.end():]

          # Remove finite resets on modal open.
          s = s.replace("""    setScheduleEnrollmentId(first.id);\n    setGenerateWeeks(8);\n    setEndDate('');\n    setPauseUpcomingCount(1);\n    applyScheduleFormFromEnrollment(first);\n""", """    setScheduleEnrollmentId(first.id);\n    applyScheduleFormFromEnrollment(first);\n""", 1)

          # Replace legacy finite schedule save orchestration with rolling activation/reconciliation.
          start = s.index('  async function handleSaveSchedule() {')
          end = s.index('  async function handleCreateAdHocSession()', start)
          new_handlers = r'''  async function handleSaveSchedule() {
    if (!scheduleFor) return;

    const enrolls = enrollmentsByStudent[scheduleFor.id] || [];
    const selectedEnrollment = enrolls.find((e) => e.id === scheduleEnrollmentId);
    if (!scheduleEnrollmentId || !selectedEnrollment) {
      toast({ title: 'Select an enrollment', variant: 'destructive' });
      return;
    }

    const enrollStart = parseISODateOnly(enrollmentStartDate);
    const classStart = parseISODateOnly(classesStartDate);
    if (!enrollStart || !classStart) {
      toast({ title: 'Invalid start date', variant: 'destructive' });
      return;
    }

    const fee = safeNumber(feePerClass, 0);
    if (fee <= 0) {
      toast({ title: 'Fee per class required', description: 'Enter a fee > 0.', variant: 'destructive' });
      return;
    }
    if (!Array.isArray(weeklySlots) || weeklySlots.length === 0) {
      toast({ title: 'At least one weekly slot is required', variant: 'destructive' });
      return;
    }

    const normalizedSlots = sortWeeklySlots(
      weeklySlots.map((slot) => ({
        slotId: slot.slotId,
        weekday: Number(slot.weekday),
        time: String(slot.time || '').trim(),
        durationMinutes: Number(slot.durationMinutes),
      })),
    );
    const duplicateKeys = new Set<string>();
    for (const slot of normalizedSlots) {
      if (!isValidWeekday(slot.weekday)) {
        toast({ title: 'Invalid weekday in a slot', variant: 'destructive' });
        return;
      }
      if (!isValidTimeHHmm(slot.time)) {
        toast({ title: 'Invalid time in a slot', description: 'Use HH:MM format.', variant: 'destructive' });
        return;
      }
      if (!Number.isFinite(slot.durationMinutes) || slot.durationMinutes <= 0) {
        toast({ title: 'Duration must be positive in all slots', variant: 'destructive' });
        return;
      }
      const duplicateKey = `${slot.weekday}_${slot.time}_${clampDurationMinutes(slot.durationMinutes, durationMins)}`;
      if (duplicateKeys.has(duplicateKey)) {
        toast({ title: 'Duplicate slot found', description: 'Remove duplicate weekday + time + duration entries.', variant: 'destructive' });
        return;
      }
      duplicateKeys.add(duplicateKey);
    }

    const weeklySlotsPayload = normalizedSlots.map((slot) => ({
      weekday: slot.weekday,
      time: slot.time,
      durationMinutes: clampDurationMinutes(slot.durationMinutes, durationMins),
    }));
    const payload = {
      enrollmentId: scheduleEnrollmentId,
      enrollmentStartDate,
      classesStartDate,
      feePerClass: fee,
      joinUrl: meetingLink ? meetingLink : null,
      currency: 'INR',
      weeklySlots: weeklySlotsPayload,
    };

    setSavingSchedule(true);
    try {
      const regionalFunctions = getFunctions(undefined, 'asia-south1');
      if (isCanonicalRollingEnrollmentForAdmin(selectedEnrollment)) {
        const reconcileRollingEnrollmentSchedule = httpsCallable<
          typeof payload,
          {
            scheduleChanged: boolean;
            scheduleRevision: number;
            horizonDays: number;
            orchestrationState: 'reconciled' | 'saved_paused' | 'unchanged';
            cancelledStaleSessions: number;
            protectedStaleSessions: number;
            patchedRetainedSessions: number;
            protectedRetainedSessions: number;
            restoredPreviouslyReconciledSessions: number;
            materializedSessionsCreated: number;
            materializedSessionsPreserved: number;
          }
        >(regionalFunctions, 'reconcileRollingEnrollmentSchedule');
        const result = await reconcileRollingEnrollmentSchedule(payload);
        const data = result.data;
        const protectedCount = safeNumber(data.protectedStaleSessions, 0) + safeNumber(data.protectedRetainedSessions, 0);
        toast({
          title: data.scheduleChanged ? 'Recurring schedule updated' : 'Schedule saved',
          description:
            `Continuous weekly schedule is ${selectedScheduleStatus === 'paused' ? 'saved while paused' : 'active'}. ` +
            `${safeNumber(data.materializedSessionsCreated, 0)} upcoming session${safeNumber(data.materializedSessionsCreated, 0) === 1 ? '' : 's'} created; ` +
            `${safeNumber(data.materializedSessionsPreserved, 0)} preserved.` +
            (safeNumber(data.cancelledStaleSessions, 0) > 0 ? ` ${data.cancelledStaleSessions} stale future session${data.cancelledStaleSessions === 1 ? '' : 's'} cancelled.` : '') +
            (safeNumber(data.restoredPreviouslyReconciledSessions, 0) > 0 ? ` ${data.restoredPreviouslyReconciledSessions} prior occurrence${data.restoredPreviouslyReconciledSessions === 1 ? '' : 's'} restored.` : '') +
            (protectedCount > 0 ? ` ${protectedCount} protected session${protectedCount === 1 ? '' : 's'} left untouched.` : ''),
        });
      } else {
        const saveRollingEnrollmentSchedule = httpsCallable<
          typeof payload & { idempotencyKey: string },
          {
            scheduleRevision: number;
            horizonDays: number;
            orchestrationState: 'activated' | 'saved_paused' | 'replayed';
            initialMaterialization: {
              expectedCount: number;
              existingCount: number;
              createdCount: number;
              raceAlreadyExistsCount: number;
              materializedThroughYmd: string;
            } | null;
            pausedSessionsCancelled: number;
          }
        >(regionalFunctions, 'saveRollingEnrollmentSchedule');
        const idempotencyKey =
          typeof globalThis.crypto?.randomUUID === 'function'
            ? globalThis.crypto.randomUUID()
            : `rolling_${scheduleEnrollmentId}_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
        const result = await saveRollingEnrollmentSchedule({...payload, idempotencyKey});
        const materialized = result.data.initialMaterialization;
        toast({
          title: 'Continuous schedule activated',
          description: materialized
            ? `Weekly recurrence is now continuous. ${safeNumber(materialized.createdCount, 0)} upcoming session${safeNumber(materialized.createdCount, 0) === 1 ? '' : 's'} created and ${safeNumber(materialized.existingCount, 0) + safeNumber(materialized.raceAlreadyExistsCount, 0)} preserved within the 14-day operational window.`
            : 'Weekly recurrence is saved as a continuous schedule. It will remain paused until you resume the enrollment.',
        });
      }

      setScheduleFor(null);
      clearEnrollmentsCacheForStudents([scheduleFor.id]);
      await enrollmentsQuery.refetch();
    } catch (err: any) {
      console.error('Error saving rolling schedule:', err);
      toast({
        title: 'Unable to save schedule',
        description: extractCallableErrorMessage(err, 'Failed to save the continuous recurring schedule.'),
        variant: 'destructive',
      });
    } finally {
      setSavingSchedule(false);
    }
  }

  async function handleRollingScheduleLifecycle(target: 'paused' | 'active' | 'discontinued') {
    if (!scheduleFor || !scheduleEnrollmentId || !selectedScheduleEnrollment) return;
    if (!isCanonicalRollingEnrollmentForAdmin(selectedScheduleEnrollment)) {
      toast({
        title: 'Save schedule first',
        description: 'Save this enrollment once to convert its recurring timetable to continuous scheduling before changing lifecycle state.',
        variant: 'destructive',
      });
      return;
    }
    if (target === 'discontinued') {
      const confirmed = window.confirm('Discontinue this enrollment? Recurring classes will stop until a new enrollment is created.');
      if (!confirmed) return;
    }

    setScheduleLifecycleAction(target);
    try {
      const regionalFunctions = getFunctions(undefined, 'asia-south1');
      const setRollingEnrollmentLifecycle = httpsCallable<
        { enrollmentId: string; status: 'paused' | 'active' | 'discontinued'; reason?: string },
        {
          previousStatus: string;
          status: 'active' | 'paused' | 'discontinued';
          cancelledSessionsCount: number;
          restoredSessionsCount: number;
          materializedSessionsCreated: number;
          materializedSessionsPreserved: number;
        }
      >(regionalFunctions, 'setRollingEnrollmentLifecycle');
      const result = await setRollingEnrollmentLifecycle({
        enrollmentId: scheduleEnrollmentId,
        status: target,
        ...(target === 'discontinued' ? { reason: 'admin_discontinued' } : {}),
      });
      const data = result.data;
      if (target === 'paused') {
        toast({
          title: 'Schedule paused',
          description: `Recurring classes are paused indefinitely. ${safeNumber(data.cancelledSessionsCount, 0)} eligible upcoming session${safeNumber(data.cancelledSessionsCount, 0) === 1 ? '' : 's'} suspended; protected history was left untouched.`,
        });
      } else if (target === 'active') {
        toast({
          title: 'Schedule resumed',
          description: `Continuous recurrence is active again. ${safeNumber(data.restoredSessionsCount, 0)} paused occurrence${safeNumber(data.restoredSessionsCount, 0) === 1 ? '' : 's'} restored and ${safeNumber(data.materializedSessionsCreated, 0)} missing upcoming session${safeNumber(data.materializedSessionsCreated, 0) === 1 ? '' : 's'} created.`,
        });
      } else {
        toast({
          title: 'Enrollment discontinued',
          description: `Recurring scheduling has stopped. ${safeNumber(data.cancelledSessionsCount, 0)} eligible upcoming session${safeNumber(data.cancelledSessionsCount, 0) === 1 ? '' : 's'} cancelled; protected history remains intact.`,
        });
        setScheduleFor(null);
      }
      clearEnrollmentsCacheForStudents([scheduleFor.id]);
      await enrollmentsQuery.refetch();
    } catch (err: any) {
      console.error('Error changing rolling schedule lifecycle:', err);
      toast({
        title: 'Unable to change schedule status',
        description: extractCallableErrorMessage(err, 'Failed to update the continuous schedule status.'),
        variant: 'destructive',
      });
    } finally {
      setScheduleLifecycleAction(null);
    }
  }

'''
          s = s[:start] + new_handlers + s[end:]

          # Replace the finite-control section of the modal with rolling lifecycle controls.
          start_marker = '                <div>\n                  <div className="text-sm font-medium mb-1">Generate for (weeks)</div>'
          end_marker = '                <div className="md:col-span-2">\n                  <div className="text-sm font-medium mb-1">Teams meeting link (optional)</div>'
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          rolling_ui = r'''                <div className="md:col-span-2 rounded-lg border border-slate-200 bg-slate-50 p-3">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <div>
                      <div className="text-sm font-medium text-slate-800">Continuous recurring schedule</div>
                      <div className="text-xs text-slate-600 mt-1">
                        Weekly classes continue automatically while this enrollment is active. The system keeps only the next 14 days operationally materialized.
                      </div>
                    </div>
                    <span className={`rounded-full px-2.5 py-1 text-xs font-semibold ${
                      selectedScheduleStatus === 'paused'
                        ? 'bg-amber-100 text-amber-800'
                        : selectedScheduleIsTerminal
                          ? 'bg-slate-200 text-slate-700'
                          : 'bg-emerald-100 text-emerald-800'
                    }`}>
                      {selectedScheduleStatus === 'paused'
                        ? 'Paused'
                        : selectedScheduleIsTerminal
                          ? 'Discontinued'
                          : 'Active'}
                    </span>
                  </div>

                  {!selectedScheduleIsRolling ? (
                    <div className="mt-3 rounded-md border border-blue-200 bg-blue-50 px-3 py-2 text-xs text-blue-800">
                      This enrollment uses the previous finite schedule format. Saving once will convert it to continuous scheduling; no historical sessions are deleted.
                    </div>
                  ) : null}

                  {selectedScheduleIsRolling && !selectedScheduleIsTerminal ? (
                    <div className="mt-3 flex flex-wrap gap-2">
                      {selectedScheduleStatus === 'paused' ? (
                        <Button
                          type="button"
                          variant="outline"
                          disabled={scheduleLifecycleAction !== null || savingSchedule}
                          onClick={() => handleRollingScheduleLifecycle('active')}
                        >
                          {scheduleLifecycleAction === 'active' ? 'Resuming...' : 'Resume schedule'}
                        </Button>
                      ) : (
                        <Button
                          type="button"
                          variant="outline"
                          disabled={scheduleLifecycleAction !== null || savingSchedule}
                          onClick={() => handleRollingScheduleLifecycle('paused')}
                        >
                          {scheduleLifecycleAction === 'paused' ? 'Pausing...' : 'Pause schedule'}
                        </Button>
                      )}
                      <Button
                        type="button"
                        variant="outline"
                        disabled={scheduleLifecycleAction !== null || savingSchedule}
                        onClick={() => handleRollingScheduleLifecycle('discontinued')}
                      >
                        {scheduleLifecycleAction === 'discontinued' ? 'Discontinuing...' : 'Discontinue enrollment'}
                      </Button>
                    </div>
                  ) : null}
                </div>

'''
          s = s[:start] + rolling_ui + s[end:]

          # Update modal copy to reflect permanent recurrence.
          s = s.replace(
            "Schedule new class sessions for this student's enrolled courses.",
            "Set the student's weekly recurring timetable. It stays active until you pause or discontinue the enrollment.",
            1,
          )
          s = s.replace(
            'Schedule changes apply only to eligible upcoming sessions. Past/completed/billed sessions are not changed.',
            'Schedule changes reconcile only the 14-day operational window. Past, completed, billed, makeup, rescheduled and manual sessions are protected.',
            1,
          )
          s = s.replace(
            'Missed past sessions should be handled via reschedule workflow, not recurring schedule edits.',
            'There is no weeks, planned-class, or end-date cap. Pause remains in effect until Resume is selected.',
            1,
          )

          # Disable save for terminal enrollments; legacy non-terminal enrollments can be converted on first save.
          s = s.replace(
            '<Button onClick={handleSaveSchedule} disabled={savingSchedule}>\n              {savingSchedule ? \'Saving...\' : \'Save Schedule\'}\n            </Button>',
            '<Button onClick={handleSaveSchedule} disabled={savingSchedule || scheduleLifecycleAction !== null || selectedScheduleIsTerminal}>\n              {savingSchedule ? \'Saving...\' : selectedScheduleIsRolling ? \'Save Schedule\' : \'Activate Continuous Schedule\'}\n            </Button>',
            1,
          )

          if s == original: raise SystemExit('codemod made no changes')
          # Hard fail if obsolete finite UI/callables remain in StudentList.
          forbidden = [
            'saveEnrollmentScheduleAndGenerateSessions',
            'pauseEnrollmentUpcomingSessions',
            'resumeEnrollmentSchedule',
            'Generate for (weeks)',
            'Planned classes (optional)',
            'Pause upcoming classes',
            'End date (optional)',
            'setGenerateWeeks(',
            'setPlannedSessions(',
            'setPauseUpcomingCount(',
            'scheduleLiveStats',
            'plannedCoveragePreview',
          ]
          remaining = [token for token in forbidden if token in s]
          if remaining: raise SystemExit(f'obsolete schedule tokens remain: {remaining}')
          for required in ['saveRollingEnrollmentSchedule', 'reconcileRollingEnrollmentSchedule', 'setRollingEnrollmentLifecycle']:
            if required not in s: raise SystemExit(f'missing rolling callable: {required}')
          p.write_text(s)
          PY

          rm .github/workflows/brick7-admin-cutover-codemod.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/StudentManagement/StudentList.tsx .github/workflows/brick7-admin-cutover-codemod.yml
          git commit -m "Cut admin scheduler over to rolling recurrence"
          git push origin HEAD:rolling-schedule-brick-7-admin-cutover
