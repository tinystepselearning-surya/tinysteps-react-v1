name: Commercial C8 Trust Evidence Differentiation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/commercialC8TrustEvidenceDifferentiation.ts'
      - 'src/tests/seo/commercialC8TrustEvidenceDifferentiation.spec.ts'
      - 'scripts/audit-commercial-c8-trust-evidence-differentiation.mjs'
      - 'docs/seo/commercial-growth/C8_TRUST_EVIDENCE_DIFFERENTIATION_*'
      - 'src/lib/commercialC7ValidationFreeze.ts'
      - 'src/pages/TeamPage.tsx'
      - 'src/pages/FounderPriyaPage.tsx'
      - 'src/pages/team/TeamPageSections.tsx'
      - 'src/pages/CurriculumPage.tsx'
      - 'src/pages/ClassSamplesPage.tsx'
      - 'src/pages/TestimonialsPage.tsx'
      - 'src/pages/phonics.tsx'
      - 'src/pages/grammar.tsx'
      - 'src/pages/speaking.tsx'
      - 'src/pages/ForSchoolsPage.tsx'
      - 'src/components/programs/ResponsiveTeachingSection.tsx'
      - 'src/lib/schemas.ts'
      - '.github/workflows/commercial-c8-trust-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commercial-c8-trust-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VITE_ASK_TINY_STEPS_FIREBASE_API_KEY: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_API_KEY }}
      VITE_ASK_TINY_STEPS_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_AUTH_DOMAIN }}
      VITE_ASK_TINY_STEPS_FIREBASE_PROJECT_ID: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_PROJECT_ID }}
      VITE_ASK_TINY_STEPS_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_STORAGE_BUCKET }}
      VITE_ASK_TINY_STEPS_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_ASK_TINY_STEPS_FIREBASE_APP_ID: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_APP_ID }}
      VITE_ASK_TINY_STEPS_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.VITE_ASK_TINY_STEPS_RECAPTCHA_ENTERPRISE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run C8 and frozen trust baseline tests
        run: >-
          npx vitest run
          src/tests/seo/commercialC8TrustEvidenceDifferentiation.spec.ts
          src/tests/seo/commercialC7ValidationFreeze.spec.ts
          src/tests/seo/b14TrustEntitySchools.spec.ts
          src/tests/pages/TeamPage.spec.tsx
      - name: Audit C8 trust evidence differentiation
        run: node scripts/audit-commercial-c8-trust-evidence-differentiation.mjs
      - name: Audit frozen C7 architecture
        run: node scripts/audit-commercial-c7-r5-validation-freeze.mjs
      - name: Run type check
        run: npm run typecheck
      - name: Run full repository tests
        run: npm test
      - name: Validate Ask Tiny Steps production build configuration
        run: node scripts/validate-ask-tiny-steps-build-env.mjs
      - name: Build and prerender public site
        run: npm run build
      - name: Re-run C8 audit after build
        run: node scripts/audit-commercial-c8-trust-evidence-differentiation.mjs
      - name: Run SEO smoke
        run: npm run seo:smoke
