name: Resources GV1 Grammar Vocabulary Authority Requirements

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/grammarVocabularyAuthorityRequirements.*'
      - 'src/tests/seo/grammarVocabularyAuthorityRequirements.spec.ts'
      - 'scripts/audit-grammar-vocabulary-authority-requirements.mjs'
      - 'docs/seo/resources-architecture/GV1_*'
      - '.github/workflows/resources-gv1-grammar-vocabulary-authority.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  resources-gv1-authority-requirements:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run GV1 requirements and Grammar-boundary regressions
        run: npx vitest run src/tests/seo/grammarVocabularyAuthorityRequirements.spec.ts src/tests/seo/grammarProgrammaticResources.spec.ts src/tests/seo/grammarWritingGr1Taxonomy.spec.ts
      - name: Audit Grammar + Vocabulary authority requirements
        run: node scripts/audit-grammar-vocabulary-authority-requirements.mjs
      - name: Run type check
        run: npm run typecheck
