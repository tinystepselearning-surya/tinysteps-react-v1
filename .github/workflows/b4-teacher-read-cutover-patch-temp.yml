name: Temporary B4 teacher read cutover patch

on:
  push:
    branches:
      - refactor/canonical-teacher-read-cutover
    paths:
      - scripts/apply-b4-teacher-read-cutover.mjs
      - .github/workflows/b4-teacher-read-cutover-patch-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout B4 branch
        uses: actions/checkout@v4
        with:
          ref: refactor/canonical-teacher-read-cutover
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Apply guarded B4 patch
        run: node scripts/apply-b4-teacher-read-cutover.mjs

      - name: Verify intended source shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          if git diff --quiet; then
            echo "::error::B4 patch produced no changes."
            exit 1
          fi

      - name: Commit B4 patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/teacherIdentity.ts \
            src/tests/lib/teacherIdentity.spec.ts \
            src/pages/teacher/hooks/useTeacherSessions.ts \
            src/pages/teacher/hooks/useUpcomingSessions.ts \
            src/pages/teacher/components/students/TeacherMyStudentsV2.tsx \
            src/hooks/useTeacherFilteredData.ts \
            src/pages/teacher/hooks/useTeacherStudents.ts \
            src/tests/teacher/teacherReadCutover.spec.ts
          git commit -m "refactor(teacher): cut active reads over to canonical teacherId"
          git push origin HEAD:refactor/canonical-teacher-read-cutover
