name: R5C2C34 Teacher Finance Acceptance
on:
  push:
    branches:
      - wave1-r5c2c34-teacher-finance-canonical-admin
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci --ignore-scripts && npm ci --prefix functions --include=dev
      - name: Focused canonical Admin and finance regression tests
        run: >
          npx vitest run --config functions/vitest.config.ts
          functions/test/canonicalAdminTeacherFinanceBatchRouting.spec.ts
          functions/test/canonicalAdminGuard.spec.ts
          functions/test/teacherPayoutPeriod.spec.ts
          functions/test/teacherOrphanEarnings.spec.ts
          functions/test/voidTeacherOrphanEarningsMonthBound.spec.ts
          functions/test/certifyTeacherEarningsSessionCreateFastPath.spec.ts
          functions/test/demoCompletionCorrection.spec.ts
          functions/test/demoEarningPolicy.spec.ts
      - name: Full Functions suite
        run: npm --prefix functions test
      - name: Functions build
        run: npm --prefix functions run build
      - name: Focused lint
        run: >
          cd functions && npx eslint
          src/recordTeacherPayoutV2.ts
          src/voidTeacherOrphanEarnings.ts
          src/certifyTeacherEarningsSessionCreateFastPath.ts
          src/adminCorrectDemoCompletion.ts
          test/canonicalAdminTeacherFinanceBatchRouting.spec.ts
      - name: Exact bounded deployment impact
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          baseline="$(git merge-base origin/main HEAD)"
          node scripts/resolve-deployment-impact.mjs --before "$baseline" --functions-before "$baseline" --sha "$GITHUB_SHA" | tee /tmp/impact.txt
          grep -q 'Functions deployment required: true' /tmp/impact.txt
          grep -q 'Functions full deployment: false' /tmp/impact.txt
          grep -q 'Functions impacted: 4' /tmp/impact.txt
          grep -q 'functions:recordTeacherPayoutV2' /tmp/impact.txt
          grep -q 'functions:voidTeacherOrphanEarnings' /tmp/impact.txt
          grep -q 'functions:certifyTeacherEarningsSessionCreateFastPath' /tmp/impact.txt
          grep -q 'functions:adminCorrectDemoCompletion' /tmp/impact.txt
          grep -q 'Hosting changed: false' /tmp/impact.txt
          grep -q 'Firestore rules changed: false' /tmp/impact.txt
          grep -q 'Firestore indexes changed: false' /tmp/impact.txt
