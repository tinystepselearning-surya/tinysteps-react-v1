name: One-off Shared Experience Inventory

on:
  push:
    branches:
      - wave0/shared-experience-inventory

permissions:
  contents: read

jobs:
  shared-experience-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout inventory branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run inventory contract tests
        run: npm run test:shared-experience-inventory

      - name: Run static shared experience inventory
        run: npm run audit:shared-experience

      - name: Upload shared experience inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-experience-inventory-${{ github.sha }}
          path: reports/shared-experience-inventory.json
          if-no-files-found: error
          retention-days: 1
