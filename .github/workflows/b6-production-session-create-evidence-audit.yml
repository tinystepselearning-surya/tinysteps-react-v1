name: B6 production session-create evidence audit

on:
  push:
    branches:
      - audit/b6-production-session-create-evidence
    paths:
      - functions/scripts/b6ProductionSessionCreateEvidence.js
      - functions/scripts/b6VerifyFlaggedEarningServiceDates.js
      - functions/src/helpers/teacherEarningsCanonicalAudit.ts
      - functions/src/helpers/teacherEarningsSessionCreateFastPath.ts
      - functions/src/helpers/serviceDate.ts
      - .github/workflows/b6-production-session-create-evidence-audit.yml

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: tinysteps-react-v1
  AUDIT_MONTH_KEY: 2026-08

jobs:
  read-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact audit commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Refuse any non-audit branch or unexpected project
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/audit/b6-production-session-create-evidence"
          test "${FIREBASE_PROJECT_ID}" = "tinysteps-react-v1"
          echo "Audit branch: ${GITHUB_REF_NAME}"
          echo "Audit SHA: ${GITHUB_SHA}"
          echo "Production project: ${FIREBASE_PROJECT_ID}"
          echo "Audit month: ${AUDIT_MONTH_KEY}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions --include=dev --ignore-scripts

      - name: Build existing audit helpers
        run: npm --prefix functions run build

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TINYSTEPS_REACT_V1 }}
          create_credentials_file: true

      - name: Run read-only flagged-row canonical service-date verification
        run: >-
          node functions/scripts/b6VerifyFlaggedEarningServiceDates.js
          --project=${{ env.FIREBASE_PROJECT_ID }}
          --month=${{ env.AUDIT_MONTH_KEY }}
          --max-docs=10000
          --expected-flagged=83
          --output=artifacts/b6-flagged-earning-service-date-verification.json
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: b6-flagged-earning-service-date-verification-${{ github.sha }}
          path: artifacts/b6-flagged-earning-service-date-verification.json
          if-no-files-found: error
          retention-days: 7
