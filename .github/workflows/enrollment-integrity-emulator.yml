name: Enrollment Integrity Emulator

on:
  workflow_dispatch:

concurrency:
  group: enrollment-integrity-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  enrollment-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions --include=dev

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run enrollment integrity emulator suite
        run: npm run test:emulator:enrollment-integrity
