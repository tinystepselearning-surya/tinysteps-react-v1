name: TSSA-SCQ Phase 4 Lead Save Telemetry Gate

on:
  pull_request:
    paths:
      - 'src/components/forms/PublicAssessmentForm.tsx'
      - 'src/tests/components/PublicAssessmentForm.spec.tsx'
      - '.github/workflows/tssa-scq-phase4-lead-submit-save-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lead-save-analytics:
    name: Verify post-save lead analytics and production-style build (no deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Isolated assessment form submission tests
        run: npx vitest run src/tests/components/PublicAssessmentForm.spec.tsx
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify generated public frontend without deployment
        run: npm run build:deploy
