name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Create Vite env file
        run: echo "VITE_APPCHECK_KEY=${{ secrets.VITE_APPCHECK_KEY }}" > app/.env.production
      - name: Install dependencies
        run: |
          if [ -f app/package-lock.json ]; then
            npm -C app ci
          else
            npm -C app install
          fi
      - name: Build app
        run: npm -C app run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TINYSTEPS_REACT_V1 }}
          projectId: tinysteps-react-v1
          entryPoint: ./app
