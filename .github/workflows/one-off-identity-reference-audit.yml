name: One-off Identity Reference Audit

on:
  push:
    branches:
      - wave0/identity-reference-audit

permissions:
  contents: read

jobs:
  identity-reference-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run audit contract tests
        run: npm run test:identity-reference-audit

      - name: Authenticate read-only audit process to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TINYSTEPS_REACT_V1 }}
          create_credentials_file: true

      - name: Run read-only identity and reference audit
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}
        run: npm run audit:identity-references

      - name: Upload identity audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-reference-audit-${{ github.sha }}
          path: reports/identity-reference-audit.json
          if-no-files-found: error
          retention-days: 1
