name: R9 Fix Canonical Blog Normalization Temporary

on:
  push:
    branches:
      - seo/resources-r9-programmatic-seo-pilot

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/resources-r9-programmatic-seo-pilot
      - name: Use normalized blog routes in canonical ownership audit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/audit-canonical-topic-ownership.mjs')
          text = p.read_text()
          anchor = "import { PUBLIC_REDIRECT_MANIFEST, PUBLIC_ROUTE_MANIFEST } from '../src/lib/publicRouteManifest.js';\n"
          if anchor not in text: raise SystemExit('import anchor missing')
          text = text.replace(anchor, anchor + "import { extractBlogEntriesFromPostFiles } from './blog-route-utils.mjs';\n", 1)
          old = "const blogFiles = await walk(BLOG_POSTS_DIR);\nconst blogSource = (await Promise.all(blogFiles.map((file) => fs.readFile(file, 'utf8')))).join('\\n');\n\nfunction blogSlugExists(slug) {\n  const escaped = slug.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');\n  return new RegExp(`slug\\\\s*:\\\\s*['\\\"]${escaped}['\\\"]`).test(blogSource);\n}\n"
          new = "const blogFiles = await walk(BLOG_POSTS_DIR);\nconst blogSource = (await Promise.all(blogFiles.map((file) => fs.readFile(file, 'utf8')))).join('\\n');\nconst normalizedBlogEntries = extractBlogEntriesFromPostFiles(BLOG_POSTS_DIR);\nconst normalizedBlogSlugs = new Set(normalizedBlogEntries.flatMap((entry) => [entry.slug, entry.sourceSlug].filter(Boolean)));\n\nfunction blogSlugExists(slug) {\n  if (normalizedBlogSlugs.has(slug)) return true;\n  const escaped = slug.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');\n  return new RegExp(`slug\\\\s*:\\\\s*['\\\"]${escaped}['\\\"]`).test(blogSource);\n}\n"
          if old not in text: raise SystemExit('blog resolver block missing')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-canonical-topic-ownership.mjs
          git commit -m "fix(resources): audit normalized canonical blog slugs"
          git push origin HEAD:seo/resources-r9-programmatic-seo-pilot
