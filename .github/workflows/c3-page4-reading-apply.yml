name: C3 Page 4 Reading Apply

on:
  push:
    branches:
      - seo/c1-parent-commercial-search-universe
    paths:
      - '.github/workflows/c3-page4-reading-apply.yml'

permissions:
  contents: write

jobs:
  apply-reading-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/c1-parent-commercial-search-universe
          fetch-depth: 0
      - name: Apply reading reconciliation
        run: python scripts/tmp-c3-page4-reading-apply.py
      - name: Verify focused Page 4 diff
        run: |
          git diff --check
          grep -F "Online Reading Classes for Kids | Live 1:1 | Tiny Steps" src/pages/public/ReadingClassesForKidsPage.tsx
          grep -F "reading classes near me" src/pages/public/ReadingClassesForKidsPage.tsx
          grep -F "Reading Fluency Programme" src/pages/public/ReadingClassesForKidsPage.tsx
          ! grep -F "'reading fluency classes'" src/pages/public/ReadingClassesForKidsPage.tsx
          ! grep -F '<ClusterSeoNav cluster="phonics"' src/pages/public/ReadingClassesForKidsPage.tsx
          grep -F "Tiny Steps Online Reading Classes for Kids" src/lib/structuredDataGraph.ts
          grep -F "Online Reading Classes for Kids | Live 1:1 | Tiny Steps" src/lib/routeSeoRegistry.js
      - name: Commit Page 4 reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/public/ReadingClassesForKidsPage.tsx src/lib/routeSeoRegistry.js src/lib/structuredDataGraph.ts
          git commit -m 'C3 page 4: reconcile general reading owner'
          git push origin HEAD:seo/c1-parent-commercial-search-universe
