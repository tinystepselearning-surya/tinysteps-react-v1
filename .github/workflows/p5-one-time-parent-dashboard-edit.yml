name: P5 temporary validation

on:
  push:
    branches:
      - feat/parent-dashboard-brick-p5-parent-overview

permissions:
  contents: write

jobs:
  validate-p5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P5 branch
        uses: actions/checkout@v4
        with:
          ref: feat/parent-dashboard-brick-p5-parent-overview
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Apply P5 canonical Overview wiring if needed
        run: node scripts/p5-wire-parent-overview-v2.mjs

      - name: Commit integration when changed
        shell: bash
        run: |
          if ! git diff --quiet -- src/pages/parent/ParentDashboard.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/pages/parent/ParentDashboard.tsx
            git commit -m "feat(parent): wire Overview to P3 and P4 canonical models"
            git push origin HEAD:feat/parent-dashboard-brick-p5-parent-overview
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run P5 selector tests
        run: npx vitest run src/tests/parent/parentOverviewProjection.spec.ts

      - name: Run type check
        run: npm run typecheck

      - name: Run linter
        run: npm run lint
