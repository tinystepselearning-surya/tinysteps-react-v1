name: Resources R2 Atomic Route Migration

on:
  push:
    branches:
      - seo/resources-r2-learning-hub

permissions:
  contents: write

jobs:
  migrate-resources-route:
    if: ${{ !contains(github.event.head_commit.message, '[r2-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Brick 2 branch
        uses: actions/checkout@v4
        with:
          ref: seo/resources-r2-learning-hub
          fetch-depth: 0

      - name: Apply atomic Resources migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, value):
              Path(path).write_text(value, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'Expected migration source not found in {path}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          # React route: /resources becomes a real page; legacy /main/resources follows it.
          replace_once(
              'src/app/routes.tsx',
              "const BlogPage = lazy(() => import('../pages/BlogPage'));\nconst BlogPostPage = lazy(() => import('../pages/BlogPostPage'));",
              "const BlogPage = lazy(() => import('../pages/BlogPage'));\nconst ResourcesPage = lazy(() => import('../pages/ResourcesPage'));\nconst BlogPostPage = lazy(() => import('../pages/BlogPostPage'));",
          )
          replace_once(
              'src/app/routes.tsx',
              '{ path: \'main/resources\', element: <Navigate to="/blog" replace /> },',
              '{ path: \'main/resources\', element: <Navigate to="/resources" replace /> },',
          )
          replace_once(
              'src/app/routes.tsx',
              '{ path: \'resources\', element: <Navigate to="/blog" replace /> },',
              '{ path: \'resources\', element: <ResourcesPage /> },',
          )

          # Hosting: stop redirecting the canonical Resources URL to /blog.
          firebase_path = 'firebase.json'
          firebase = read(firebase_path)
          for line in [
              '      { "source": "/resources", "destination": "/blog", "type": 301 },\n',
              '      { "source": "/resources/", "destination": "/blog", "type": 301 },\n',
          ]:
              if line not in firebase:
                  raise SystemExit(f'Expected Firebase redirect not found: {line.strip()}')
              firebase = firebase.replace(line, '', 1)
          firebase = firebase.replace(
              '{ "source": "/main/resources", "destination": "/blog", "type": 301 }',
              '{ "source": "/main/resources", "destination": "/resources", "type": 301 }',
              1,
          )
          firebase = firebase.replace(
              '{ "source": "/main/resources/", "destination": "/blog", "type": 301 }',
              '{ "source": "/main/resources/", "destination": "/resources", "type": 301 }',
              1,
          )
          write(firebase_path, firebase)

          # Central public route manifest: make /resources indexable, sitemap-eligible and prerendered.
          replace_once(
              'src/lib/publicRouteManifest.js',
              "  route('/blog', 'static'),\n",
              "  route('/blog', 'static'),\n  route('/resources', 'static'),\n",
          )

          # SEO registry: give the gateway one independent search intent and self canonical.
          resources_seo = """  '/resources': {\n    title: 'English Learning Resources for Kids, Parents & Educators | Tiny Steps',\n    description:\n      'Explore phonics and reading, grammar and writing, speaking and communication guides, parent help, free learning activities, and school resources from Tiny Steps.',\n    canonicalPath: '/resources',\n    ogType: 'website',\n  },\n"""
          replace_once(
              'src/lib/routeSeoRegistry.js',
              "  '/blog': {\n",
              resources_seo + "  '/blog': {\n",
          )

          # Semantic ownership registry: promote the former alias into a protected gateway.
          registry_path = 'src/lib/resourcesArchitectureRegistry.js'
          registry = read(registry_path)
          start_marker = '  // R0 records the current redirect state. Brick 2 must change all route/hosting\n'
          start = registry.find(start_marker)
          if start < 0:
              raise SystemExit('Could not find R0 /resources transition block in resourcesArchitectureRegistry.js')
          end = registry.find("  entry('/resources/phonics',", start)
          if end < 0:
              raise SystemExit('Could not find /resources/phonics marker in resourcesArchitectureRegistry.js')
          resources_block = """  // Brick 2 promotes the former /resources alias into the protected educational-discovery gateway.\n  entry('/resources', {\n    currentState: 'route',\n    pageFamily: 'learning-resource-gateway',\n    audience: 'mixed',\n    subject: 'general-english',\n    currentPurpose: 'Primary educational discovery gateway across subject guides, parent support, practice, and school resources.',\n    primaryIntent: 'informational',\n    primaryQueryOwner: 'English learning resources for kids, parents and educators',\n    commercialReadiness: 'low',\n    ctaPolicy: 'related-resource',\n    primaryDestination: '/blog',\n    protection: 'protected',\n    futureResourceNode: null,\n  }),\n"""
          registry = registry[:start] + resources_block + registry[end:]
          write(registry_path, registry)

          # R0 safety test evolves from pre-change snapshot into regression protection for the launched gateway.
          test_path = 'src/tests/seo/resourcesR0SafetyBaseline.spec.js'
          test = read(test_path)
          old_test = """  it('freezes /resources as a redirect and subject hubs as planned during R0', () => {\n    const byPath = new Map(RESOURCE_ECOSYSTEM_REGISTRY.map((item) => [item.path, item]));\n\n    expect(byPath.get('/resources')).toMatchObject({\n      currentState: 'redirect',\n      expectedRedirectTarget: '/blog',\n      protection: 'opportunity',\n    });\n\n    for (const path of ['/resources/phonics', '/resources/grammar', '/resources/speaking']) {\n      expect(byPath.get(path)).toMatchObject({ currentState: 'planned', protection: 'planned' });\n    }\n  });\n"""
          new_test = """  it('protects the Brick 2 /resources gateway while subject hubs remain planned', () => {\n    const byPath = new Map(RESOURCE_ECOSYSTEM_REGISTRY.map((item) => [item.path, item]));\n\n    expect(byPath.get('/resources')).toMatchObject({\n      currentState: 'route',\n      pageFamily: 'learning-resource-gateway',\n      protection: 'protected',\n    });\n\n    for (const path of ['/resources/phonics', '/resources/grammar', '/resources/speaking']) {\n      expect(byPath.get(path)).toMatchObject({ currentState: 'planned', protection: 'planned' });\n    }\n  });\n"""
          if old_test not in test:
              raise SystemExit('Could not find old /resources R0 test block')
          write(test_path, test.replace(old_test, new_test, 1))

          # Structural R0 audit now verifies the safe post-Brick-2 state instead of demanding the old redirect.
          audit_path = 'scripts/audit-resources-r0.mjs'
          audit = read(audit_path)
          start = audit.find("  const resources = RESOURCE_ECOSYSTEM_REGISTRY.find((item) => item.path === '/resources');")
          end = audit.find('\n\n  const wildcard =', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not isolate /resources state block in audit-resources-r0.mjs')
          new_audit_block = """  const resources = RESOURCE_ECOSYSTEM_REGISTRY.find((item) => item.path === '/resources');\n  if (!resources || resources.currentState !== 'route') {\n    record('error', 'resources-current-state', '/resources must be recorded as an independent route after Brick 2.');\n  } else {\n    const directFirebaseRedirect = firebaseRedirects.find((item) => item.source === '/resources' || item.source === '/resources/');\n    if (directFirebaseRedirect) {\n      record('error', 'resources-stale-firebase-redirect', `Firebase still redirects ${directFirebaseRedirect.source} to ${directFirebaseRedirect.destination}.`);\n    }\n\n    const routeRedirectPattern = /path:\\s*['\"]resources['\"][\\s\\S]{0,180}Navigate\\s+to=['\"]\\/blog['\"]/m;\n    if (routeRedirectPattern.test(routesSource)) {\n      record('error', 'resources-stale-react-redirect', 'React still redirects /resources to /blog after Brick 2.');\n    }\n\n    const routePagePattern = /path:\\s*['\"]resources['\"][\\s\\S]{0,180}<ResourcesPage\\s*\\/>/m;\n    if (!routePagePattern.test(routesSource)) {\n      record('error', 'resources-react-page-missing', 'Could not confirm that React renders ResourcesPage at /resources.');\n    }\n\n    if (PUBLIC_REDIRECT_MANIFEST.some((item) => item.source === '/resources' || item.source === '/resources/')) {\n      record('error', 'resources-public-redirect-manifest-stale', '/resources must not remain in PUBLIC_REDIRECT_MANIFEST after Brick 2.');\n    }\n\n    const mainResourcesRedirect = firebaseRedirects.find((item) => item.source === '/main/resources');\n    if (!mainResourcesRedirect || mainResourcesRedirect.destination !== '/resources' || mainResourcesRedirect.type !== 301) {\n      record('error', 'main-resources-legacy-target', 'Legacy /main/resources must permanently redirect to the new /resources gateway.');\n    }\n  }"""
          audit = audit[:start] + new_audit_block + audit[end:]
          write(audit_path, audit)

          # Historic GSC remediation entry now recognizes /resources/ as trailing-slash normalization to /resources.
          replace_once(
              'scripts/gsc-crawled-not-indexed-manifest.mjs',
              "  { path: '/resources/', action: 'redirect', indexTarget: false, target: '/blog', note: 'Legacy resources alias; permanent redirect consolidates to the canonical content hub.' },",
              "  { path: '/resources/', action: 'redirect', indexTarget: false, target: '/resources', normalization: 'trailingSlash', note: 'Trailing-slash duplicate; normalize to the independent Tiny Steps Resources gateway.' },",
          )

          # Legacy /main shell guard follows the new canonical gateway.
          replace_once(
              'scripts/seo-indexation-guard.mjs',
              "  ['/main/resources', '/blog'],",
              "  ['/main/resources', '/resources'],",
          )

          # Make the new gateway visible to the existing machine-readable authority map.
          llms_path = 'public/llms.txt'
          llms = read(llms_path)
          resources_line = '- [English Learning Resources for Kids, Parents & Educators](https://tinystepslearning.com/resources)\n'
          if resources_line not in llms:
              marker = '## Core Pages\n'
              if marker not in llms:
                  raise SystemExit('Could not find Core Pages section in llms.txt')
              llms = llms.replace(marker, marker + resources_line, 1)
              write(llms_path, llms)

          # Self-delete so this migration workflow cannot run again or reach main.
          Path('.github/workflows/resources-r2-patcher.yml').unlink()
          PY

      - name: Commit atomic migration
        shell: bash
        run: |
          git config user.name "Tiny Steps SEO Automation"
          git config user.email "tinystepselearning@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(resources): launch learning gateway [r2-patched]"
          git push origin HEAD:seo/resources-r2-learning-hub
