name: India Acquisition Brick 8 Speaking Intent Gate

on:
  pull_request:
    paths:
      - 'src/pages/speaking.tsx'
      - 'scripts/test/india-acquisition-brick8-speaking.node-test.mjs'
      - 'docs/seo/india-acquisition/BRICK_08_*'
      - '.github/workflows/india-acquisition-brick8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speaking-intent-and-render:
    name: Verify speaking offer, owner boundaries and SEO prerender
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test speaking and group parent claim integrity
        run: node --test scripts/test/india-acquisition-brick8-speaking.node-test.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Build and verify SEO prerender
        run: npm run build
