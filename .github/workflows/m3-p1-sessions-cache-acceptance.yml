name: R5 M3 P1 Sessions Cache Authorization Acceptance
on:
  push:
    branches:
      - wave1-r5-m3-p1-sessions-cache-auth-boundary
permissions:
  contents: read
jobs:
  behavior:
    name: Cache, actor switch and admin screen behavior
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: P1 actor boundary, reminder fallback and Firebase Auth regressions
        run: >
          npx vitest run
          src/tests/lib/sessionsManagementCacheAuthBoundary.spec.ts
          src/tests/pages/TodaysNotificationsSnapshot.spec.ts
          src/tests/components/AuthBootstrap.spec.tsx
          src/tests/hooks/useAuth.spec.tsx
          src/tests/functions/wave1IdentityAuthorizationHardening.spec.ts
      - name: Broad application regressions excluding six unchanged baseline test-debt contracts
        run: >
          npx vitest run
          --exclude src/tests/functions/attendanceValidationFirstTimeBaselineRouting.spec.ts
          --exclude src/tests/functions/attendanceValidationLatestCheckRouting.spec.ts
          --exclude src/tests/functions/attendanceValidationMonthlyParentProgressRouting.spec.ts
          --exclude src/tests/functions/attendanceValidationUnifiedRangeRouting.spec.ts
          --exclude src/tests/functions/monthlyParentProgressCallableIdempotency.spec.ts
          --exclude src/tests/seo/speakingGrowthBrick6.spec.ts
      - name: Critical operational suite (separate from stale test-contract exclusions)
        run: npm run test:critical
  typecheck-lint:
    name: Application TypeScript, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Focused P1 lint
        run: >
          npx eslint
          src/lib/sessionsManagementSnapshot.ts
          src/lib/auth.ts
          src/components/common/AuthBootstrap.tsx
          src/pages/admin/todaysNotificationsManualData.ts
          src/pages/admin/TodaysNotifications.tsx
          src/tests/lib/sessionsManagementCacheAuthBoundary.spec.ts
          src/tests/pages/TodaysNotificationsSnapshot.spec.ts
      - name: Full application lint
        run: npm run lint
      - name: Install Playwright Chromium for prerender validation
        run: npx playwright install --with-deps chromium
      - name: Public site production build and existing integrity checks
        run: npm run build
  deployment-impact:
    name: Hosting-only release guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Forbid changes to backend resources and security rules
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          baseline="$(git merge-base origin/main HEAD)"
          if git diff --name-only "$baseline" HEAD | grep -E '^(functions/src/|firestore\.rules$|storage\.rules$|firestore\.indexes\.json$|firebase\.json$)'; then
            echo 'Unexpected backend, security or deployment configuration change'; exit 1
          fi
          node scripts/resolve-deployment-impact.mjs --before "$baseline" --functions-before "$baseline" --sha "$GITHUB_SHA" | tee /tmp/impact.txt
          grep -q 'Functions deployment required: false' /tmp/impact.txt
          grep -q 'Functions full deployment: false' /tmp/impact.txt
          grep -q 'Functions impacted: 0' /tmp/impact.txt
          grep -q 'Hosting changed: true' /tmp/impact.txt
          grep -q 'Firestore rules changed: false' /tmp/impact.txt
          grep -q 'Firestore indexes changed: false' /tmp/impact.txt
