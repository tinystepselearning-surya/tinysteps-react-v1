name: Milestone 3 Finance Offline

on:
  pull_request:
    paths:
      - 'src/tests/admin/attendanceValidationResolutionWorkflow.spec.ts'
      - 'src/tests/attendance/attendanceStatusSimplification.spec.ts'
      - 'src/tests/functions/attendanceValidationDirtySessionRouting.spec.ts'
      - 'src/tests/pages/RollingScheduleCalendarProjectionRouting.spec.ts'
      - 'docs/architecture/wave-1/IDENTITY_R5_M3_STEP4_FINANCE_READ_SAFETY_REVIEW.md'
      - 'functions/test/milestone3Finance*.spec.ts'
      - 'functions/test/support/finance*.ts'
      - 'functions/test/finance-pagination.tsconfig.json'
      - 'docs/architecture/wave-1/IDENTITY_R5_M3_FINANCE_PAGINATION_OFFLINE_REPORT.md'
      - '.github/workflows/milestone3-finance-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-finance:
    name: Synthetic finance, full regression and zero deployment impact
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci --ignore-scripts && npm ci --prefix functions --include=dev --ignore-scripts
      - name: Finance reference, prototype and write-boundary tests
        run: |
          mkdir -p artifacts/finance-offline
          npx vitest run --config functions/vitest.config.ts functions/test/milestone3Finance*.spec.ts --reporter=json --outputFile=artifacts/finance-offline/focused.json
      - name: Full regression suites (no credentials or production adapters)
        run: |
          npm --prefix functions test -- --reporter=json --outputFile=artifacts/finance-offline/functions.json
          npm test -- --reporter=json --outputFile=artifacts/finance-offline/root.json
      - name: Print failed test cases from JSON reports (preserves failing job)
        if: failure()
        run: |
          node --input-type=module <<'NODE'
          import {existsSync, readFileSync} from 'node:fs';
          for (const suite of ['focused.json', 'previous-60.json', 'emulator-tests.json', 'functions.json', 'root.json']) {
            const file = 'artifacts/finance-offline/' + suite;
            if (!existsSync(file)) continue;
            const report = JSON.parse(readFileSync(file, 'utf8'));
            console.log(suite + ': ' + (report.numPassedTests ?? '?') +
              ' passed; ' + (report.numFailedTests ?? '?') + ' failed');
            for (const result of report.testResults ?? []) {
              const failed = (result.assertionResults ?? []).filter(a => a.status === 'failed');
              if (!failed.length && result.status !== 'failed') continue;
              console.log('FAILED FILE: ' + String(result.name).slice(0, 220));
              for (const assertion of failed.slice(0, 20)) {
                console.log('FAILED TEST: ' + String(assertion.fullName).slice(0, 250));
                for (const message of (assertion.failureMessages ?? []).slice(0, 2)) {
                  console.log(String(message).slice(0, 1500));
                }
              }
            }
          }
          NODE
      - name: Production and prototype TypeScript checks
        run: |
          npm --prefix functions run build
          npm run typecheck
          npx tsc -p functions/test/finance-pagination.tsconfig.json
      - name: Lint production baseline and new offline files
        run: |
          npm run lint
          npm --prefix functions run lint
          cd functions
          npx eslint test/milestone3Finance*.spec.ts test/support/finance*.ts
      - name: Exact deployment impact and offline-only diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          baseline="$(git merge-base "$BASE_SHA" HEAD)"
          git diff --name-only "$baseline" HEAD > artifacts/finance-offline/changed-paths.txt
          unexpected="$(grep -Ev '^(functions/test/milestone3Finance[^/]*\.spec\.ts|functions/test/support/finance[^/]*\.ts|functions/test/finance-pagination\.tsconfig\.json|docs/architecture/wave-1/IDENTITY_R5_M3_FINANCE_PAGINATION_OFFLINE_REPORT\.md|src/tests/admin/attendanceValidationResolutionWorkflow\.spec\.ts|src/tests/attendance/attendanceStatusSimplification\.spec\.ts|src/tests/functions/attendanceValidationDirtySessionRouting\.spec\.ts|src/tests/pages/RollingScheduleCalendarProjectionRouting\.spec\.ts|docs/architecture/wave-1/IDENTITY_R5_M3_STEP4_FINANCE_READ_SAFETY_REVIEW\.md|\.github/workflows/milestone3-firestore-finance\.yml|\.github/workflows/milestone3-finance-offline\.yml)$' artifacts/finance-offline/changed-paths.txt || true)"
          if test -n "$unexpected"; then echo 'Unexpected path in offline-only finance PR'; exit 1; fi
          node scripts/resolve-deployment-impact.mjs --before "$baseline" --functions-before "$baseline" --sha "$GITHUB_SHA" | tee artifacts/finance-offline/deployment-impact.txt
          grep -q 'Functions deployment required: false' artifacts/finance-offline/deployment-impact.txt
          grep -q 'Functions full deployment: false' artifacts/finance-offline/deployment-impact.txt
          grep -q 'Functions impacted: 0' artifacts/finance-offline/deployment-impact.txt
          grep -q 'Firestore rules changed: false' artifacts/finance-offline/deployment-impact.txt
          grep -q 'Firestore indexes changed: false' artifacts/finance-offline/deployment-impact.txt
          grep -q 'Hosting changed: false' artifacts/finance-offline/deployment-impact.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milestone3-finance-offline
          path: artifacts/finance-offline/
          retention-days: 14
