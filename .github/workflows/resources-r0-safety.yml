name: Resources R0 Safety Baseline

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/resourcesArchitectureRegistry.js'
      - 'scripts/audit-resources-r0.mjs'
      - 'scripts/audit-resources-r0-rendered.mjs'
      - 'src/tests/seo/resourcesR0SafetyBaseline.spec.js'
      - 'docs/seo/resources-architecture/**'
      - 'src/lib/publicRouteManifest.js'
      - 'src/lib/routeSeoRegistry.js'
      - 'src/app/routes.tsx'
      - 'firebase.json'
      - 'public/robots.txt'
      - 'public/sitemap*.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resources-r0-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run R0 structural safety audit
        run: node scripts/audit-resources-r0.mjs --write

      - name: Run focused R0 regression test
        run: npx vitest run src/tests/seo/resourcesR0SafetyBaseline.spec.js

      - name: Build and prerender public website
        run: npm run build

      - name: Run R0 rendered inventory audit
        run: node scripts/audit-resources-r0-rendered.mjs --write

      - name: Upload R0 baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resources-r0-safety-baseline
          path: artifacts/seo/resources-r0/
          if-no-files-found: warn
