name: Temporary teacher topic resume patch

on:
  push:
    branches:
      - fix/teacher-topics-resume-last-saved

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/teacher-topics-resume-last-saved
          fetch-depth: 0

      - name: Patch canonical teacher topic editor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/teacher/StudentTopicProgressEditorCanonicalV2.tsx')
          text = path.read_text()

          replacements = [
              (
                  "import React, { useEffect, useMemo, useState } from 'react';",
                  "import React, { useEffect, useMemo, useRef, useState } from 'react';",
              ),
              (
                  "import { useKidTopicProgress } from '../../hooks/useKidTopicProgress';\nimport { useAuthStore } from '../../store/useAuthStore';",
                  "import { useKidTopicProgress } from '../../hooks/useKidTopicProgress';\nimport { selectTeacherTopicResumeId } from '../../lib/teacherTopicResume';\nimport { useAuthStore } from '../../store/useAuthStore';",
              ),
              (
                  "  const [lastSavedAt, setLastSavedAt] = useState<number | null>(null);\n\n  const {\n    topics: existingTopics,",
                  "  const [lastSavedAt, setLastSavedAt] = useState<number | null>(null);\n  const resumeSelectionAppliedRef = useRef('');\n\n  const {\n    topics: resumeTopics,\n    loading: resumeLoading,\n    error: resumeError,\n  } = useKidTopicProgress(\n    kidId,\n    selectedCourseId || null,\n    Boolean(selectedCourseId && enrollmentId),\n    enrollmentId ?? null,\n  );\n\n  const {\n    topics: existingTopics,",
              ),
              (
                  "  useEffect(() => {\n    if (!courseTopics.length) {\n      setSelectedTopicId('');\n      return;\n    }\n    if (!courseTopics.some((topic) => topic.id === selectedTopicId)) {\n      setSelectedTopicId(courseTopics[0].id);\n    }\n  }, [courseTopics, selectedTopicId]);",
                  "  useEffect(() => {\n    const resumeSelectionKey = `${kidId}::${selectedCourseId || ''}::${enrollmentId || ''}`;\n    if (!courseTopics.length) {\n      setSelectedTopicId('');\n      return;\n    }\n\n    const currentSelectionIsValid = courseTopics.some((topic) => topic.id === selectedTopicId);\n    if (\n      currentSelectionIsValid\n      && resumeSelectionAppliedRef.current === resumeSelectionKey\n    ) {\n      return;\n    }\n\n    if (resumeLoading || resumeError) {\n      if (!currentSelectionIsValid) setSelectedTopicId('');\n      return;\n    }\n\n    const resumeTopicId = selectTeacherTopicResumeId(resumeTopics, courseTopics);\n    setSelectedTopicId(resumeTopicId ?? courseTopics[0].id);\n    resumeSelectionAppliedRef.current = resumeSelectionKey;\n  }, [\n    courseTopics,\n    enrollmentId,\n    kidId,\n    resumeError,\n    resumeLoading,\n    resumeTopics,\n    selectedCourseId,\n    selectedTopicId,\n  ]);",
              ),
              (
                  "  const disabled = existingLoading || configLoading || !selectedCourseId || !selectedTopic;",
                  "  const disabled = resumeLoading || Boolean(resumeError) || existingLoading || configLoading || !selectedCourseId || !selectedTopic;",
              ),
              (
                  "      {existingError ? <p className=\"text-xs text-red-600\">Couldn&apos;t load progress: {existingError}</p> : null}\n      {configError ?",
                  "      {resumeError ? <p className=\"text-xs text-red-600\">Couldn&apos;t determine the last saved lesson: {resumeError}</p> : null}\n      {existingError ? <p className=\"text-xs text-red-600\">Couldn&apos;t load progress: {existingError}</p> : null}\n      {configError ?",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected patch anchor not found: {old[:120]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/teacher/StudentTopicProgressEditorCanonicalV2.tsx
          git commit -m "fix(teacher): resume from last saved topic progress"
          git push origin HEAD:fix/teacher-topics-resume-last-saved
