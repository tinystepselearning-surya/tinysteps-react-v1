name: SEO Crawl & Discovery Guard

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/seo-crawl-discovery.yml'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'firebase.json'
      - 'index.html'
      - 'vite.config.*'
      - 'tsconfig*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-crawl-discovery.yml'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'firebase.json'
      - 'index.html'
      - 'vite.config.*'
      - 'tsconfig*.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  crawl-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and prerender canonical public pages
        run: npm run build

      - name: Certify crawl and discovery graph
        run: node scripts/seo-crawl-discovery-guard.mjs

      - name: Upload crawl discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-crawl-discovery-report
          path: artifacts/seo-crawl-discovery-report.json
          if-no-files-found: ignore
