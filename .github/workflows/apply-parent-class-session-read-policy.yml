name: Apply parent class-session read policy

on:
  push:
    branches:
      - fix/firestore-class-sessions-read-amplification
    paths:
      - .github/workflows/apply-parent-class-session-read-policy.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/firestore-class-sessions-read-amplification
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded patch
        run: node scripts/apply-parent-class-session-read-policy.mjs

      - name: Commit generated source change
        run: |
          if git diff --quiet -- src/pages/parent/ParentDashboard.tsx; then
            echo "No dashboard change produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/parent/ParentDashboard.tsx
          git commit -m "refactor(parent): bound class-session reads"
          git push origin HEAD:fix/firestore-class-sessions-read-amplification
