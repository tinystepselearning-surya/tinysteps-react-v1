name: Wave 1 Brick 3 Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Lint Functions
        run: npm --prefix functions run lint

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Run Brick 1-3 focused identity tests
        run: npm --prefix functions run test -- test/identityLegacySync.spec.ts test/identityReadAdapter.spec.ts test/identityShadowCanary.spec.ts

      - name: Run Wave 1 identity foundation suite
        run: npm run test:wave1-identity-foundation
