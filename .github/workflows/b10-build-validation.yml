import path from 'node:path';
import { describe, expect, it } from 'vitest';
import { blogPosts } from '../../content/blog';
import {
  BLOG_COLLECTION_ID,
  BLOG_FAQ_ID,
  BLOG_ID,
  BLOG_TECHNICAL_AUTHORITY,
  buildBlogKeywords,
