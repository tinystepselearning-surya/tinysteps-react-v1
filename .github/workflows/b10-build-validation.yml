  },
  'how-to-improve-reading-fluency-in-children': {
    cluster: 'Phonics',
    role: 'pillar',
    topics: ['reading fluency', 'accurate reading', 'expressive reading', 'reading practice'],
  },
  'week-7-grammar-nouns-to-paragraphs': {
    cluster: 'Grammar',
    role: 'pillar',
    topics: ['grammar for children', 'sentence building', 'paragraph building', 'grammar progression'],
  },
  'how-to-improve-sentence-formation-in-kids': {
    cluster: 'Grammar',
    role: 'diagnostic-owner',
    topics: ['sentence formation', 'sentence expansion', 'oral to written language transfer'],
  },
  'child-knows-grammar-but-makes-mistakes': {
    cluster: 'Grammar',
    role: 'diagnostic-owner',
    topics: ['grammar rule transfer', 'grammar mistakes', 'spontaneous grammar use', 'self-correction'],
  },
  'week-12-speaking-confidence-seeds': {
    cluster: 'Speaking & Communication',
    role: 'pillar',
    topics: ['speaking confidence', 'oral communication', 'connected speaking', 'public speaking foundations'],
  },
  'child-understands-english-but-does-not-speak': {
    cluster: 'Speaking & Communication',
    role: 'diagnostic-owner',
    topics: ['understands English but does not speak', 'speaking hesitation', 'independent spoken response'],
  },
  'child-gives-one-word-answers': {
    cluster: 'Speaking & Communication',
    role: 'diagnostic-owner',
    topics: ['one-word answers', 'spoken sentence expansion', 'connected thinking', 'oral language development'],
  },
  'phonics-teacher-training-for-schools-implementation': {
    cluster: 'Schools & Research',
    role: 'school-authority',
    topics: ['phonics teacher training', 'school phonics implementation', 'teacher practice'],
  },
  'how-schools-can-assess-decoding-not-memorisation': {
    cluster: 'Schools & Research',
    role: 'school-authority',
    topics: ['decoding assessment', 'reading assessment', 'memorisation versus decoding'],
  },
  'systematic-cumulative-phonics-explained-for-schools': {
    cluster: 'Schools & Research',
    role: 'school-authority',
    topics: ['systematic phonics', 'cumulative phonics', 'school literacy implementation'],
  },
} satisfies Record<string, BlogAuthorityEntry>);

const DEFAULT_TOPICS: Record<BlogDiscoveryCategory, readonly string[]> = {
  Phonics: ['phonics', 'reading', 'decoding'],
  Grammar: ['grammar', 'sentence formation', 'writing'],
  'Speaking & Communication': ['speaking', 'communication', 'public speaking'],
  'Parent Guides': ['parent English learning support', 'home learning routines'],
  'Schools & Research': ['school literacy', 'systematic phonics', 'teacher implementation'],
};

type BlogAuthorityInput = Pick<BlogPost, 'slug' | 'category'> &
  Partial<Pick<BlogPost, 'audience' | 'discoveryCategory'>>;

function unique(values: readonly string[]): string[] {
  return [...new Set(values.map((value) => value.trim()).filter(Boolean))];
}

export function getBlogArticleId(slug: string): string {
  return `${SITE_ORIGIN}/blog/${slug}#article`;
}

export function getBlogWebPageId(slug: string): string {
  return `${SITE_ORIGIN}/blog/${slug}#webpage`;
}

export function getBlogTechnicalAuthority(post: BlogAuthorityInput) {
  const explicit = BLOG_TECHNICAL_AUTHORITY[post.slug as keyof typeof BLOG_TECHNICAL_AUTHORITY];
  const discoveryCategory = post.discoveryCategory || getBlogDiscoveryCategory(post);
  const audience = post.audience || getBlogAudience(post);
  const topics = unique([...(explicit?.topics || []), ...DEFAULT_TOPICS[discoveryCategory]]);

  return {
    cluster: explicit?.cluster || discoveryCategory,
    role: explicit?.role || 'skill-guide',
    topics,
    discoveryCategory,
    audience,
    audienceType:
      audience === 'Schools & Research'
        ? 'School leaders, English heads, teachers, and education decision-makers'
        : 'Parents and caregivers of children learning English',
  } as const;
}

export function buildBlogAboutSchema(post: BlogAuthorityInput) {
  return getBlogTechnicalAuthority(post).topics.map((name) => ({
    '@type': 'Thing',
    name,
  }));
}

export function buildBlogKeywords(post: BlogAuthorityInput): string {
  const authority = getBlogTechnicalAuthority(post);
  return unique([
    ...authority.topics,
    authority.discoveryCategory,
    'Tiny Steps Learning',
  ]).join(', ');
}

export function extractExternalCitationUrls(
  post: Pick<BlogPost, 'body' | 'faq'>,
): string[] {
  const visibleText = [
    ...(post.body || []).map((block) => block.content || ''),
    ...(post.faq || []).flatMap((item) => [item.question || '', item.answer || '']),
  ].join('\n');

  const urls = visibleText.match(/https?:\/\/[^\s)\]}>,]+/g) || [];
  const cleaned = urls.map((url) => url.replace(/[.,;:!?]+$/, ''));

  return unique(cleaned).filter((url) => !url.startsWith(SITE_ORIGIN));
}
''')

          Path('docs/seo/blog-bricks/B10_TECHNICAL_GEO_LLM_AUTHORITY.md').write_text(r'''# B10 — Technical SEO, GEO, and LLM Authority

## Goal

Make the editorial authority established in B0–B9 technically explicit to search engines and answer systems without creating new content URLs, changing intent ownership, or adding unsupported claims.

## Baseline entering B10

- B9 is merged to production main.
- Live blog inventory remains 76 articles.
- B2 intent ownership, B6 parent phonics authority, B7 authorship/trust, B8 first-party teaching knowledge, and B9 Grammar/Speaking authority are already established in content.
- Existing site-wide AEO/GEO foundations already include `llms.txt`, AI/search crawler rules in `robots.txt`, Organization/WebSite/WebPage schema, Quick Answer sections, RSS feeds, sitemap generation, prerendered HTML, and indexability checks.

## Technical gaps found

1. **BlogPosting entities were not connected by stable IDs.** Individual article schema had a URL but no durable `#article` identity and its `mainEntityOfPage` did not reference the existing `#webpage` identity emitted by the shared WebPage schema.
2. **The B2/B6/B9 authority graph existed mainly in prose and internal links.** Search engines could infer it, but the article schema did not explicitly expose topical `about`, `keywords`, audience, or the established authority cluster.
3. **The Blog index schema was broader than the indexable search corpus.** It described every published article in its Blog/Collection JSON-LD even when a Week/support page was intentionally `noindex`.
4. **External evidence was visible but not explicitly connected to BlogPosting schema.** B7 already guards real evidence; B10 can expose only URLs that are actually present in visible body/FAQ content.
5. **`llms.txt` documented phonics and schools strongly but did not yet encode the Grammar/Speaking authority structure established by B9 or the protected diagnostic distinctions established by B2.**

## B10 implementation

### Stable blog entity graph

- Blog: `https://tinystepslearning.com/blog#blog`
- Blog collection: `https://tinystepslearning.com/blog#collection`
- Article: `https://tinystepslearning.com/blog/<slug>#article`
- WebPage: `https://tinystepslearning.com/blog/<slug>#webpage`
- Site: existing `https://tinystepslearning.com/#website`
- Publisher: existing `https://tinystepslearning.com/#organization`

Every generic BlogPosting now connects to the Blog, its WebPage, publisher, audience, and topical `about` entities.

### Machine-readable authority registry

`src/content/blog/shared/technicalAuthority.ts` encodes only the already-established authority owners from B2/B6/B9 plus selected school authority pages. It is not a canonical or redirect registry and does not alter page ownership.

Protected distinctions include:

- ABC knowledge without reading ≠ letter sounds without word reading
- blending-stage explainer ≠ blending activities
- grammar rule transfer ≠ sentence formation
- understands English but does not speak ≠ one-word answer expansion
- editorial problem guides ≠ commercial program pages

### Indexability-aligned Blog schema

The visible blog can still present the full published library, but Blog/Collection JSON-LD now enumerates only articles that the established indexing policy allows search engines to index. This removes a mixed machine signal without changing the UI or any page's robots policy.

### Evidence connection

When a blog post visibly contains an external `https://` source URL, the BlogPosting schema exposes that same URL through `citation`. No source is invented and Tiny Steps internal links are excluded.

### LLM authority map

`public/llms.txt` now names the preferred editorial owners for parent phonics, Grammar, Speaking & Communication, and school implementation questions, and explicitly explains the protected intent boundaries so answer systems do not collapse distinct articles.

## Deliberately unchanged

- live blog URLs: 76 → 76
- new blog URLs: 0
- removed blog URLs: 0
- canonical policy: unchanged
- redirects: unchanged
- sitemap generation: unchanged
- RSS generation: unchanged
- robots private-route policy: unchanged
- indexability policy: unchanged
- hero assets/families: unchanged
- B2/B6/B7/B8/B9 content ownership: unchanged
- commercial landing-page ownership: unchanged

## Validation contract

B10 guardrails must verify:

1. all registered authority slugs exist and remain indexable;
2. retired/redirected speaking duplicates are not registered as authorities;
3. stable Blog/Article/WebPage IDs are deterministic;
4. article schema source uses `about`, `keywords`, `audience`, `citation`, Blog membership, and the correct WebPage ID;
5. Blog index schema uses the established noindex policy to build its machine-readable corpus;
6. `llms.txt` names the B6/B9 owners and protected diagnostic distinctions;
7. AI crawler rules retain the private-route disallows;
8. RSS discovery remains present;
9. earlier brick tests and SEO/rendered/indexability checks continue to pass.
''')

