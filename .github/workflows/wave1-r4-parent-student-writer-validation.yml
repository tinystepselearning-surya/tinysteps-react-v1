name: Wave 1 R4 Parent Student Writer Validation

on:
  push:
    branches:
      - wave1/identity-r4-parent-student-writer

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Install root test dependencies
        run: npm ci
      - name: Install functions dependencies
        run: npm --prefix functions ci
      - name: Functions build
        run: npm --prefix functions run build
      - name: Focused R4 learner writer tests
        run: >-
          npx vitest run
          --config functions/vitest.config.ts
          functions/test/canonicalPrimaryPlanner.spec.ts
          functions/test/canonicalPrimaryWriter.spec.ts
          functions/test/identityLegacySync.spec.ts
          functions/test/parentStudentsCanonicalPrimary.spec.ts
      - name: Preview production Functions deployment impact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin             refs/heads/main:refs/remotes/origin/main             refs/heads/ci/functions-production:refs/remotes/origin/ci/functions-production             --force
          before="$(git merge-base origin/main HEAD)"
          functions_before="$(git rev-parse origin/ci/functions-production)"
          head="$(git rev-parse HEAD)"
          node scripts/resolve-deployment-impact.mjs             --before "$before"             --functions-before "$functions_before"             --hosting-before "$before"             --firestore-rules-before "$before"             --firestore-indexes-before "$before"             --sha "$head"
