name: C3 Page 15 Demo Schema Polish

on:
  push:
    branches:
      - seo/c1-parent-commercial-search-universe
    paths:
      - '.github/workflows/c3-page15-demo-schema-polish.yml'

permissions:
  contents: write

jobs:
  polish-demo-schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/c1-parent-commercial-search-universe
          fetch-depth: 0
      - name: Remove unsupported assessment availability assertion
        run: python scripts/tmp-c3-page15-demo-schema-polish.py
      - name: Focused source check
        run: |
          git diff --check
          grep -F "areaServed: ['India', 'Worldwide']" src/pages/public/BookDemoPage.tsx
          ! grep -F "availability: 'https://schema.org/InStock'" src/pages/public/BookDemoPage.tsx
      - name: Commit Page 15 schema polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/public/BookDemoPage.tsx
          git commit -m 'C3 page 15: avoid unsupported slot availability claim'
          git push origin HEAD:seo/c1-parent-commercial-search-universe
