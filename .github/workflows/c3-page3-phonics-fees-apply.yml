name: C3 Page 3 Phonics Fees Apply

on:
  push:
    paths:
      - '.github/workflows/c3-page3-phonics-fees-apply.yml'

permissions:
  contents: write

jobs:
  apply-page3:
    if: github.ref == 'refs/heads/seo/c1-parent-commercial-search-universe'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/c1-parent-commercial-search-universe
          fetch-depth: 0
      - name: Escape generated template expressions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-c3-page3-phonics-fees.mjs')
          text = p.read_text()
          text = text.replace('${', '\\${')
          p.write_text(text)
          PY
      - name: Apply Page 3 rewrite
        run: node scripts/apply-c3-page3-phonics-fees.mjs
      - name: Review Page 3 diff
        run: git diff --check && git diff -- src/pages/public/PhonicsFeesIndiaPage.tsx src/lib/routeSeoRegistry.js
      - name: Commit Page 3 only
        run: |
          if git diff --quiet -- src/pages/public/PhonicsFeesIndiaPage.tsx src/lib/routeSeoRegistry.js; then
            echo 'No Page 3 changes to commit.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/public/PhonicsFeesIndiaPage.tsx src/lib/routeSeoRegistry.js
          git commit -m 'C3 page 3: rebuild phonics fees owner'
          git push origin HEAD:seo/c1-parent-commercial-search-universe
