name: Validate R5C1 School Admin Guard

on:
  push:
    branches:
      - wave1/identity-r5c1-school-admin-guard-20261004

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions --include=dev

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Run R5C authorization tests
        run: >-
          npx vitest run --config functions/vitest.config.ts
          functions/test/authAccessAuthorization.spec.ts
          functions/test/authAccessAuthorizationRouting.spec.ts
          functions/test/authAccessReadModel.spec.ts

      - name: Run architecture authorization regressions
        run: >-
          npx vitest run
          src/tests/functions/wave1IdentityAuthorizationHardening.spec.ts
          src/tests/functions/teacherEarningAdjustmentLedgerRouting.spec.ts
          src/tests/functions/teacherPayWithholdingLedgerRouting.spec.ts

      - name: Analyze deployment impact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          main_sha="$(git rev-parse origin/main)"
          node scripts/resolve-deployment-impact.mjs \
            --before "${main_sha}" \
            --functions-before "${main_sha}" \
            --hosting-before "${main_sha}" \
            --firestore-rules-before "${main_sha}" \
            --firestore-indexes-before "${main_sha}" \
            --sha "${GITHUB_SHA}"
