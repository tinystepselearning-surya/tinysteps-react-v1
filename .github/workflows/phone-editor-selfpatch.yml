name: Apply sessions phone editor integration

on:
  push:
    branches:
      - fix/session-phone-editor-country-search
    paths:
      - .github/workflows/phone-editor-selfpatch.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/session-phone-editor-country-search
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Apply targeted source patch
        run: node scripts/apply-phone-editor-patch.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run focused tests
        run: npx vitest run src/lib/phoneCountryOptions.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit integration and remove temporary tooling
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phone-editor-selfpatch.yml scripts/apply-phone-editor-patch.mjs
          git add src/pages/admin/TodaysNotifications.tsx
          git diff --cached --check
          git commit -m "fix: improve sessions phone editor"
          git push origin HEAD:fix/session-phone-editor-country-search
