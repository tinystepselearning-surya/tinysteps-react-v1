name: PR 648 Validation

on:
  push:
    branches:
      - ci/pr-648-validation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Targeted student reactivation regression
        run: npx vitest run src/tests/pages/admin/PastStudentReactivationWorkflow.spec.ts src/tests/pages/admin/StudentReactivation.spec.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build:deploy
