name: Resources R4 Subject Hubs

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/ResourcesPage.tsx'
      - 'src/pages/SubjectResourcesPage.tsx'
      - 'src/app/routes.tsx'
      - 'src/lib/publicRouteManifest.js'
      - 'src/lib/routeSeoRegistry.js'
      - 'src/lib/resourcesArchitectureRegistry.js'
      - 'src/tests/seo/resourcesR4SubjectHubs.spec.js'
      - 'src/tests/seo/resourcesR2LearningHub.spec.js'
      - 'src/tests/seo/resourcesR0SafetyBaseline.spec.js'
      - 'scripts/audit-resources-r0.mjs'
      - 'public/llms.txt'
      - 'docs/seo/resources-architecture/**'
      - '.github/workflows/resources-r4-subject-hubs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compatibility-hotfix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'seo/resources-r4-subject-hubs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/resources-r4-subject-hubs
          fetch-depth: 0
      - name: Apply source compatibility fixes if needed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/SubjectResourcesPage.tsx')
          s = p.read_text()
          replacements = {
            ".replaceAll(' ', '-')": ".split(' ').join('-')",
            'from-sky-500/18 via-blue-500/8': 'from-sky-500/[0.18] via-blue-500/[0.08]',
            'from-emerald-500/18 via-teal-500/8': 'from-emerald-500/[0.18] via-teal-500/[0.08]',
            'from-amber-500/18 via-orange-500/8': 'from-amber-500/[0.18] via-orange-500/[0.08]',
            'bg-white/8': 'bg-white/[0.08]',
            'hover:bg-white/14': 'hover:bg-white/[0.14]',
          }
          for old, new in replacements.items():
            s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit source-only fix when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/SubjectResourcesPage.tsx
          if git diff --cached --quiet; then
            echo "No compatibility changes required."
            exit 0
          fi
          git commit -m "fix(resources): harden subject hub compatibility"
          git push origin HEAD:seo/resources-r4-subject-hubs

  resources-r4-subject-hubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Brick 4 and earlier Resources regression tests
        run: npx vitest run src/tests/seo/resourcesR4SubjectHubs.spec.js src/tests/seo/resourcesR3Navigation.spec.js src/tests/seo/resourcesR2LearningHub.spec.js src/tests/seo/resourcesR0SafetyBaseline.spec.js
      - name: Run structural Resources safety audit
        run: node scripts/audit-resources-r0.mjs
      - name: Run type check
        run: npm run typecheck
      - name: Build and prerender public site
        run: npm run build
      - name: Run rendered Resources safety audit
        run: node scripts/audit-resources-r0-rendered.mjs --strict
      - name: Verify subject hubs are discoverable in generated sitemap
        shell: bash
        run: |
          grep -R '<loc>https://tinystepslearning.com/resources/phonics</loc>' public/sitemap*.xml
          grep -R '<loc>https://tinystepslearning.com/resources/grammar</loc>' public/sitemap*.xml
          grep -R '<loc>https://tinystepslearning.com/resources/speaking</loc>' public/sitemap*.xml
      - name: Run SEO smoke test
        run: npm run seo:smoke
