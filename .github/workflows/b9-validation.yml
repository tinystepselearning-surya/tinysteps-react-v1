name: B9 Grammar Speaking Validation

on:
  push:
    branches:
      - 'seo/blog-b09-grammar-speaking-authority-v2'

jobs:
  validate-b9:
    runs-on: ubuntu-latest
    env:
      VITE_ASK_TINY_STEPS_FIREBASE_API_KEY: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_API_KEY }}
      VITE_ASK_TINY_STEPS_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_AUTH_DOMAIN }}
      VITE_ASK_TINY_STEPS_FIREBASE_PROJECT_ID: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_PROJECT_ID }}
      VITE_ASK_TINY_STEPS_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_STORAGE_BUCKET }}
      VITE_ASK_TINY_STEPS_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_ASK_TINY_STEPS_FIREBASE_APP_ID: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_APP_ID }}
      VITE_ASK_TINY_STEPS_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.VITE_ASK_TINY_STEPS_RECAPTCHA_ENTERPRISE_SITE_KEY }}

    steps:
      - name: Checkout B9 branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused B9 and cross-brick SEO tests
        run: >-
          npx vitest run
          src/tests/seo/blogB9GrammarSpeakingAuthority.spec.ts
          src/tests/seo/blogAudienceArchitecture.spec.ts
          src/tests/seo/blogIntentOwnership.spec.ts
          src/tests/seo/blogParentAuthorityPillars.spec.ts
          src/tests/seo/blogEditorialTrust.spec.ts
          src/tests/seo/blogB8FirstPartyKnowledge.spec.ts
          src/tests/seo/blogHeroFamilies.spec.ts
          src/tests/seo/blogIndexingPolicy.spec.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run full root unit suite
        run: npm run test:unit -- --run

      - name: Production build
        run: npm run build

      - name: SEO smoke
        run: npm run seo:smoke

      - name: Rendered HTML check
        run: npm run seo:rendered-check

      - name: Route integrity
        run: npm run seo:route-integrity

      - name: Indexability report
        run: npm run seo:indexability-report

      - name: Indexation guard
        run: npm run seo:indexation-check
