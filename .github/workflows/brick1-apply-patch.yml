name: Apply Brick 1 authorization patch

on:
  push:
    branches:
      - 'fix/teacher-phonics-progress-p0-auth'
    paths:
      - '.github/workflows/brick1-apply-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Brick 1 branch
        uses: actions/checkout@v4
        with:
          ref: fix/teacher-phonics-progress-p0-auth
          fetch-depth: 0

      - name: Apply scoped Brick 1 edits
        run: python3 scripts/brick1_apply_patch.py

      - name: Remove temporary patch machinery
        run: git rm .github/workflows/brick1-apply-patch.yml scripts/brick1_apply_patch.py

      - name: Commit scoped Brick 1 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: authorize teacher progress through canonical enrollment"
          git push origin HEAD:fix/teacher-phonics-progress-p0-auth
