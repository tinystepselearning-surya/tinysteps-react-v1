name: Read-only parent progress audit

on:
  push:
    branches:
      - audit/parent-progress-readonly

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TINYSTEPS_REACT_V1 }}
          create_credentials_file: true

      - name: Resolve target child id without logging PII
        id: resolve-child
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}
          FIREBASE_PROJECT_ID: tinysteps-react-v1
          TARGET_NAME_HASHES: 42f69baffe8013aeac1b98fde4870c321a31d313496c708bea4fea5b909ad6f1,6bcf914516a085bfd101876014b1c077b930aa1a2e28ad12a14ce55b8d1b586d,eaad936d3edcccf5dd214e02bb4065e5511ca5ac7cb2c50cd0e997f1f3fc1f4f,ebfef19e3d59b49ba93ac84a68dfe45a51952e9aa47f2b4c9afc061c21d4b5f3,401893233a090ea9bb80ad76f45a0d4d3f19e80f305f236fb356567c8f954541
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import { applicationDefault, initializeApp } from 'firebase-admin/app';
          import { getFirestore } from 'firebase-admin/firestore';

          initializeApp({ credential: applicationDefault(), projectId: process.env.FIREBASE_PROJECT_ID });
          const db = getFirestore();
          const targetHashes = new Set(String(process.env.TARGET_NAME_HASHES || '').split(',').filter(Boolean));
          const hash = (value) => crypto.createHash('sha256').update(String(value || '').trim().toLowerCase()).digest('hex');
          const matchesTarget = (data) => [
            data.fullName,
            data.preferredName,
            data.name,
            data.studentName,
            data.firstName,
            data.childName,
            data.displayName,
            data.kidName,
            data.learnerName,
          ].filter(Boolean).some((value) => targetHashes.has(hash(value)));

          const candidates = [];
          const studentSnap = await db.collectionGroup('students').limit(5000).get();
          for (const doc of studentSnap.docs) {
            const data = doc.data() || {};
            if (matchesTarget(data)) candidates.push(doc.id);
          }

          if (candidates.length === 0) {
            const enrollmentSnap = await db.collection('enrollments').limit(2000).get();
            for (const doc of enrollmentSnap.docs) {
              const data = doc.data() || {};
              if (!matchesTarget(data)) continue;
              const kidId = String(data.kidId || data.studentId || data.childId || '').trim();
              if (kidId) candidates.push(kidId);
            }
          }

          const uniqueCandidates = [...new Set(candidates)];
          if (uniqueCandidates.length !== 1) {
            console.error(`Target child resolution expected exactly 1 match, found ${uniqueCandidates.length}.`);
            process.exit(2);
          }
          const kidId = uniqueCandidates[0];
          console.log(`::add-mask::${kidId}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `kid_id=${kidId}\n`);
          console.log('Target child resolved uniquely.');
          NODE

      - name: Run existing progress-enrollment audit in read-only mode
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}
          KID_ID: ${{ steps.resolve-child.outputs.kid_id }}
        run: >-
          node scripts/audit-teacher-progress-enrollments.mjs
          --project tinysteps-react-v1
          --kid-id "$KID_ID"
          --progress-limit 5000
          --enrollment-limit 2000
          --summary-only
