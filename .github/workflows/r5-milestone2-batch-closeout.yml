name: Milestone 2 C33-C35 Batch Closeout Gate
on:
  push:
    branches:
      - wave1-r5-milestone2-selection-audit
permissions:
  contents: read
jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Verify batch production closeout evidence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const j=JSON.parse(fs.readFileSync('docs/architecture/wave-1/migrations/identity-foundation-v1.json','utf8'));
          const slices=j.switchReads.r5.r5c.r5c2.slices;
          const expected=[['r5c2c33',2,691,38039242562],['r5c2c34',4,692,38039489423],['r5c2c35',5,693,38039760999]];
          for(const [key,n,pr,run] of expected){
            const s=slices[key], d=s?.productionDeployment;
            if(!s?.productionVerified || s.legacyFallback!==false || d?.pullRequest!==pr || d?.workflowRunId!==run || d?.result!=='success' || d?.functionsDeployed!==n || d?.functionsVerified!==n || d?.functionsCheckpointReady!==n || d?.functionsFullDeployment!==false || !d.functionsProductionMarkerAdvanced || d.hostingDeployed!==false || d.firestoreRulesDeployed!==false || d.firestoreIndexesDeployed!==false) throw new Error('Invalid production closeout for '+key);
          }
          const m=j.switchReads.r5.r5c.milestone2;
          if(m.status!=='in_progress'||m.finalExitGate!=='not_attempted'||m.remainingLegacyGuardModulesAfterC35CodeMerge!==7||m.remainingLegacyGuardCallSitesAfterC35CodeMerge!==34||m.deployedFunctionRootsAcrossBatches!==11||m.canonicalAdminCallablesMigratedAcrossBatches!==10) throw new Error('Milestone 2 state inconsistent or prematurely closed');
          console.log('Verified 3 production slices, 10 canonical Admin callables, 11 deployment roots; Milestone 2 remains open');
          NODE
      - name: Reject unintended Cloud Functions, Hosting or Firestore deployment
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          baseline="$(git merge-base origin/main HEAD)"
          node scripts/resolve-deployment-impact.mjs --before "$baseline" --functions-before "$baseline" --sha "$GITHUB_SHA" | tee /tmp/impact.txt
          grep -q 'Functions deployment required: false' /tmp/impact.txt
          grep -q 'Hosting changed: false' /tmp/impact.txt
          grep -q 'Firestore rules changed: false' /tmp/impact.txt
          grep -q 'Firestore indexes changed: false' /tmp/impact.txt
