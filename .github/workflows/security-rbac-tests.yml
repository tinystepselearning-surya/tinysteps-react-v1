name: Security RBAC Tests

on:
  pull_request:
    branches: [main]
    paths:
      - firestore.rules
      - src/tests/firestore/userRbac.rules.spec.ts
      - src/tests/firestore/kidGameRbac.rules.spec.ts
      - .github/workflows/security-rbac-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rbac:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run least-privilege Firestore rules tests
        run: >-
          npx firebase-tools@latest emulators:exec
          --project tinysteps-react-v1
          --only firestore
          "FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 npx vitest run src/tests/firestore/userRbac.rules.spec.ts src/tests/firestore/kidGameRbac.rules.spec.ts"
