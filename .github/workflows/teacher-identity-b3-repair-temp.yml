name: Temporary B3 teacher identity alias repair

on:
  push:
    branches:
      - refactor/canonical-teacher-backfill
    paths:
      - scripts/repair-teacher-identity-aliases.mjs
      - .github/workflows/teacher-identity-b3-repair-temp.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: firebase-deployment-tinysteps-react-v1
      cancel-in-progress: false

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: refactor/canonical-teacher-backfill

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TINYSTEPS_REACT_V1 }}
          create_credentials_file: true

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify authenticated service account
        shell: bash
        run: |
          set -euo pipefail
          expected_account="github-action-1086722180@tinysteps-react-v1.iam.gserviceaccount.com"
          authenticated_account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          if [[ "${authenticated_account}" != "${expected_account}" ]]; then
            echo "::error::Expected Google Cloud account ${expected_account}, got ${authenticated_account:-<none>}."
            exit 1
          fi

      - name: Verify exact B3 targets remain after denied transaction
        run: >-
          node scripts/repair-teacher-identity-aliases.mjs
          --project tinysteps-react-v1
          --limit 250
          --expected-enrollments 6
          --expected-sessions 3
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}
