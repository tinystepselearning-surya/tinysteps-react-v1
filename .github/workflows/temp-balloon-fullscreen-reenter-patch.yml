name: Temporary Balloon Pop Fullscreen Recovery Patch

on:
  push:
    branches:
      - feat/balloon-pop-immersive-fullscreen
    paths:
      - .github/workflows/temp-balloon-fullscreen-reenter-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/balloon-pop-immersive-fullscreen
          fetch-depth: 0

      - name: Add fullscreen recovery control and coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/KidsBalloonPop.tsx')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          '''  const [fullscreenMode, setFullscreenMode] = useState(false);\n  const [fsBlocked, setFsBlocked] = useState(false);''',
          '''  const [fullscreenMode, setFullscreenMode] = useState(false);\n  const [nativeFullscreenActive, setNativeFullscreenActive] = useState(false);\n  const [fsBlocked, setFsBlocked] = useState(false);''',
          'fullscreen state')

          replace_once(
          '''  // --- Fullscreen helpers ---\n  const playLevel = useCallback(''',
          '''  // --- Fullscreen helpers ---\n  const requestNativeFullscreen = useCallback(async () => {\n    if (disableFullscreen) return false;\n\n    try {\n      const elem = document.documentElement;\n      if (elem.requestFullscreen) await elem.requestFullscreen();\n      else if ((elem as any).webkitRequestFullscreen) await (elem as any).webkitRequestFullscreen();\n      else return false;\n\n      setNativeFullscreenActive(true);\n      setFsBlocked(false);\n      return true;\n    } catch {\n      setNativeFullscreenActive(false);\n      setFsBlocked(true);\n      if (fsNoticeTimeoutRef.current) {\n        window.clearTimeout(fsNoticeTimeoutRef.current);\n      }\n      fsNoticeTimeoutRef.current = window.setTimeout(() => setFsBlocked(false), 2200);\n      return false;\n    }\n  }, [disableFullscreen]);\n\n  const playLevel = useCallback(''',
          'fullscreen helper')

          replace_once(
          '''      // Fullscreen is best-effort; gameplay should still work when blocked.\n      if (!disableFullscreen) {\n        try {\n          const elem = document.documentElement;\n          if (elem.requestFullscreen) await elem.requestFullscreen();\n          else if ((elem as any).webkitRequestFullscreen) await (elem as any).webkitRequestFullscreen();\n        } catch {\n          setFsBlocked(true);\n          if (fsNoticeTimeoutRef.current) {\n            window.clearTimeout(fsNoticeTimeoutRef.current);\n          }\n          fsNoticeTimeoutRef.current = window.setTimeout(() => setFsBlocked(false), 2200);\n        }\n      }''',
          '''      // Native fullscreen is best-effort. The fixed viewport presentation remains as a fallback.\n      await requestNativeFullscreen();''',
          'play fullscreen request')

          replace_once(
          '''    [baseRoute, disableFullscreen, kidId, navigate, progress.unlocked, publicMode, searchParams, unlockAllLevels]\n  );''',
          '''    [baseRoute, kidId, navigate, progress.unlocked, publicMode, requestNativeFullscreen, searchParams, unlockAllLevels]\n  );''',
          'play dependencies')

          replace_once(
          '''  const exitFullscreen = useCallback(() => {\n    setFullscreenMode(false);\n    setHasStarted(false);''',
          '''  const exitFullscreen = useCallback(() => {\n    setFullscreenMode(false);\n    setNativeFullscreenActive(false);\n    setHasStarted(false);''',
          'exit state')

          replace_once(
          '''    const handleFSChange = () => {\n      const isFull = !!(document.fullscreenElement || (document as any).webkitFullscreenElement);\n      if (isFull) {\n        setFsBlocked(false);\n        return;\n      }''',
          '''    const handleFSChange = () => {\n      const isFull = !!(document.fullscreenElement || (document as any).webkitFullscreenElement);\n      setNativeFullscreenActive(isFull);\n      if (isFull) {\n        setFsBlocked(false);\n        return;\n      }''',
          'fullscreen change tracking')

          replace_once(
          '''      {/* Exit */}\n      <button\n        onClick={exitFullscreen}\n        className="absolute top-4 right-4 z-50 px-4 py-2 bg-red-500/90 hover:bg-red-600 text-white font-semibold rounded-full shadow-lg backdrop-blur-sm"\n      >\n        ✕ Exit\n      </button>''',
          '''      {/* Immersive controls */}\n      {!disableFullscreen && !nativeFullscreenActive && (\n        <button\n          type="button"\n          onClick={() => void requestNativeFullscreen()}\n          className="absolute top-4 right-28 z-50 px-4 py-2 bg-slate-900/80 hover:bg-slate-900 text-white text-sm font-semibold rounded-full shadow-lg backdrop-blur-sm"\n        >\n          ⛶ Full screen\n        </button>\n      )}\n      <button\n        type="button"\n        onClick={exitFullscreen}\n        className="absolute top-4 right-4 z-50 px-4 py-2 bg-red-500/90 hover:bg-red-600 text-white font-semibold rounded-full shadow-lg backdrop-blur-sm"\n      >\n        ✕ Exit\n      </button>''',
          'immersive controls')

          replace_once(
          '''          Fullscreen unavailable. You can keep playing.''',
          '''          Fullscreen unavailable. Immersive game view is still active.''',
          'fullscreen fallback copy')

          path.write_text(text)

          test = Path('src/tests/pages/KidsBalloonPopPedagogy.spec.tsx')
          text = test.read_text()

          old_helper = '''function renderGame() {\n  return render(\n    <MemoryRouter initialEntries={["/kids/games/phonics/balloon-pop?kidId=test-kid"]}>\n      <Routes><Route path="/kids/games/phonics/balloon-pop" element={<KidsBalloonPop disableFullscreen unlockAllLevels />} /></Routes>\n    </MemoryRouter>,\n  );\n}\n'''
          new_helper = old_helper + '''\nfunction renderFullscreenGame() {\n  return render(\n    <MemoryRouter initialEntries={["/kids/games/phonics/balloon-pop?kidId=test-kid"]}>\n      <Routes><Route path="/kids/games/phonics/balloon-pop" element={<KidsBalloonPop unlockAllLevels />} /></Routes>\n    </MemoryRouter>,\n  );\n}\n'''
          if text.count(old_helper) != 1:
              raise SystemExit(f'fullscreen test helper: expected 1 match, found {text.count(old_helper)}')
          text = text.replace(old_helper, new_helper, 1)

          old_after = '''  afterEach(() => { vi.restoreAllMocks(); vi.unstubAllGlobals(); });'''
          new_after = '''  afterEach(() => {\n    delete (document.documentElement as HTMLElement & { requestFullscreen?: () => Promise<void> }).requestFullscreen;\n    vi.restoreAllMocks();\n    vi.unstubAllGlobals();\n  });'''
          if text.count(old_after) != 1:
              raise SystemExit(f'fullscreen test cleanup: expected 1 match, found {text.count(old_after)}')
          text = text.replace(old_after, new_after, 1)

          marker = '''  it("uses one correct balloon by default and an auditory-only cue", async () => {'''
          new_test = '''  it("enters immersive fullscreen and offers recovery after native fullscreen closes", async () => {\n    const requestFullscreen = vi.fn().mockResolvedValue(undefined);\n    Object.defineProperty(document.documentElement, "requestFullscreen", {\n      configurable: true,\n      value: requestFullscreen,\n    });\n\n    renderFullscreenGame();\n    fireEvent.click(screen.getByRole("button", { name: /Sound Group 1: s a t i p n/i }));\n    await waitFor(() => expect(requestFullscreen).toHaveBeenCalledTimes(1));\n\n    document.dispatchEvent(new Event("fullscreenchange"));\n    const restoreButton = await screen.findByRole("button", { name: /Full screen/i });\n    fireEvent.click(restoreButton);\n    await waitFor(() => expect(requestFullscreen).toHaveBeenCalledTimes(2));\n\n    expect(screen.getByRole("button", { name: /Exit/i })).toBeInTheDocument();\n  });\n\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'fullscreen test insertion: expected 1 marker, found {text.count(marker)}')
          test.write_text(text.replace(marker, new_test + marker, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/KidsBalloonPop.tsx src/tests/pages/KidsBalloonPopPedagogy.spec.tsx
          git commit -m "feat: add Balloon Pop fullscreen recovery control"
          git push origin HEAD:feat/balloon-pop-immersive-fullscreen