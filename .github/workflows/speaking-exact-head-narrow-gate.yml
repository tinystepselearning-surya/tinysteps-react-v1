name: Speaking Bricks 1-13 Exact-Head Narrow Gate

on:
  push:
    branches:
      - ci/speaking-exact-head-1e4a4364
    paths:
      - '.github/workflows/speaking-exact-head-narrow-gate.yml'

permissions:
  contents: read

concurrency:
  group: speaking-exact-head-1e4a4364
  cancel-in-progress: true

jobs:
  exact-head-narrow-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: 1e4a4364c3801b936463357e70c5e0f029a8d81c
      CI: true

    steps:
      - name: Checkout exact Speaking head
        uses: actions/checkout@v4
        with:
          ref: 1e4a4364c3801b936463357e70c5e0f029a8d81c
          fetch-depth: 1

      - name: Prove exact SHA
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected=$TARGET_SHA"
          echo "actual=$actual"
          test "$actual" = "$TARGET_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for prerender
        run: npx playwright install --with-deps chromium

      - name: Run targeted Speaking Brick regression tests
        run: >
          npx vitest run
          src/tests/seo/speakingGrowthBrick4.spec.ts
          src/tests/seo/speakingGrowthBrick5.spec.ts
          src/tests/seo/speakingGrowthBrick6.spec.ts
          src/tests/seo/speakingGrowthBrick7.spec.ts
          src/tests/seo/speakingGrowthBrick8.spec.ts
          src/tests/seo/speakingGrowthBrick9.spec.ts
          src/tests/seo/speakingGrowthBrick11.spec.ts
          src/tests/seo/speakingGrowthBrick12.spec.ts
          src/tests/seo/speakingGrowthBrick13.spec.ts

      - name: Run final Speaking integration spec
        run: npx vitest run src/tests/seo/speakingGrowthFinalIntegration.spec.ts

      - name: Run typecheck
        run: npm run typecheck

      - name: Build and prerender production site
        run: npm run build

      - name: Run SEO smoke
        run: npm run seo:smoke

      - name: Verify no patch whitespace errors
        run: git diff --check
