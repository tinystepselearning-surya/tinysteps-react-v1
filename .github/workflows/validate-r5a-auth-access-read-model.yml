name: Validate R5A Auth Access Read Model

on:
  push:
    branches:
      - wave1/identity-r5-auth-access-read-model-20261004

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions --include=dev

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Run focused identity tests
        run: >-
          npx vitest run --config functions/vitest.config.ts
          functions/test/authAccessReadModel.spec.ts
          functions/test/authPersonCompatibility.spec.ts
          functions/test/canonicalPrimaryAuthUserCreate.spec.ts
          functions/test/canonicalPrimaryAuthUserUpdate.spec.ts
          functions/test/canonicalPrimaryAuthUserArchive.spec.ts
          functions/test/authUserProjectionBridge.spec.ts
          functions/test/identityReadAdapter.spec.ts

      - name: Verify zero live deployment impact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          main_sha="$(git rev-parse origin/main)"
          node scripts/resolve-deployment-impact.mjs \
            --before "${main_sha}" \
            --functions-before "${main_sha}" \
            --hosting-before "${main_sha}" \
            --firestore-rules-before "${main_sha}" \
            --firestore-indexes-before "${main_sha}" \
            --sha "${GITHUB_SHA}"
