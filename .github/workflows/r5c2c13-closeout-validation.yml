name: R5C2C13 Closeout Validation

on:
  push:
    branches:
      - wave1/identity-r5c2c13-production-closeout-20261007
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate closeout boundary and ledger
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git diff --check origin/main...HEAD

          mapfile -t changed < <(git diff --name-only origin/main...HEAD | sort)
          printf '%s\n' "${changed[@]}"

          allowed=(
            ".github/workflows/r5c2c13-closeout-validation.yml"
            "docs/architecture/wave-1/IDENTITY_R5_BACKEND_AUTHORIZATION_CUTOVER_BRICKC.md"
            "docs/architecture/wave-1/migrations/identity-foundation-v1.json"
          )
          for file in "${changed[@]}"; do
            ok=false
            for expected in "${allowed[@]}"; do
              if [[ "$file" == "$expected" ]]; then ok=true; break; fi
            done
            if [[ "$ok" != true ]]; then
              echo "Unexpected changed file: $file" >&2
              exit 1
            fi
          done

          node <<'NODE'
          const fs = require('fs');
          const doc = fs.readFileSync(
            'docs/architecture/wave-1/IDENTITY_R5_BACKEND_AUTHORIZATION_CUTOVER_BRICKC.md',
            'utf8',
          );
          const ledger = JSON.parse(
            fs.readFileSync(
              'docs/architecture/wave-1/migrations/identity-foundation-v1.json',
              'utf8',
            ),
          );

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          assert(
            doc.includes('**Status:** R5C2C13 COMPLETE IN PRODUCTION'),
            'Architecture document does not mark C13 production complete.',
          );
          assert(doc.includes('Pull request: #651'), 'Missing PR evidence.');
          assert(
            doc.includes('Merge commit: 7c01fddf1531a5d7127ee4eec5d095bd4ccc81d4'),
            'Missing merge commit evidence.',
          );
          assert(
            doc.includes('Deploy workflow run: 37661529664'),
            'Missing deploy workflow evidence.',
          );
          assert(doc.includes('Deploy run number: 3923'), 'Missing deploy run number.');
          assert(
            doc.includes('reconcileParentPaymentsMonthReadModels'),
            'Missing deployed Function evidence.',
          );

          assert(
            ledger.switchReads.status ===
              'r5c2c13_production_complete_ready_for_next_bounded_admin_mutation_slice',
            'Unexpected switchReads status.',
          );
          assert(
            ledger.switchReads.nextBrick ===
              'r5c2c14_next_bounded_admin_mutation_slice_selection',
            'Unexpected nextBrick marker.',
          );

          const slice = ledger.switchReads?.r5?.r5c?.r5c2?.slices?.r5c2c13;
          assert(slice, 'C13 slice missing.');
          assert(slice.productionWiring === true, 'productionWiring must be true.');
          assert(slice.productionVerified === true, 'productionVerified must be true.');

          const deployment = slice.productionDeployment;
          assert(deployment, 'productionDeployment missing.');
          assert(deployment.pullRequest === 651, 'Incorrect PR.');
          assert(
            deployment.mergeCommit === '7c01fddf1531a5d7127ee4eec5d095bd4ccc81d4',
            'Incorrect merge commit.',
          );
          assert(deployment.workflowRunId === 37661529664, 'Incorrect workflow run ID.');
          assert(deployment.workflowRunNumber === 3923, 'Incorrect workflow run number.');
          assert(deployment.result === 'success', 'Production run must be successful.');
          assert(deployment.functionsPlanned === 1, 'functionsPlanned must be 1.');
          assert(deployment.functionsDeployed === 1, 'functionsDeployed must be 1.');
          assert(deployment.functionsVerified === 1, 'functionsVerified must be 1.');
          assert(deployment.functionsCheckpointReady === 1, 'functionsCheckpointReady must be 1.');
          assert(deployment.deploymentBatches === 1, 'deploymentBatches must be 1.');
          assert(
            Array.isArray(deployment.functions)
              && deployment.functions.length === 1
              && deployment.functions[0] === 'reconcileParentPaymentsMonthReadModels',
            'Production function boundary must contain exactly reconcileParentPaymentsMonthReadModels.',
          );
          assert(deployment.functionsFullDeployment === false, 'Full Functions deployment must be false.');
          assert(deployment.hostingDeployed === false, 'Hosting must remain undeployed.');
          assert(deployment.firestoreRulesDeployed === false, 'Firestore Rules must remain undeployed.');
          assert(deployment.firestoreIndexesDeployed === false, 'Firestore indexes must remain undeployed.');
          assert(deployment.functionsProductionMarkerAdvanced === true, 'Functions production marker must advance.');
          assert(deployment.recoveryJobRequired === false, 'Recovery job must not be required.');
          NODE

      - name: Verify recorded GitHub production run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/37661529664"             > /tmp/run.json
          node <<'NODE'
          const fs = require('fs');
          const run = JSON.parse(fs.readFileSync('/tmp/run.json', 'utf8'));
          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }
          assert(run.conclusion === 'success', 'Recorded deployment run is not successful.');
          assert(run.run_number === 3923, 'Recorded deployment run number does not match.');
          assert(
            run.head_sha === '7c01fddf1531a5d7127ee4eec5d095bd4ccc81d4',
            'Recorded deployment head SHA does not match.',
          );
          NODE

      - name: Confirm documentation-only closeout
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only origin/main...HEAD | grep -E '^(functions/|src/|firestore|firebase\.json|storage\.rules)'; then
            echo "Runtime or Firebase configuration changed in closeout PR." >&2
            exit 1
          fi
          echo "Documentation-only closeout confirmed."
