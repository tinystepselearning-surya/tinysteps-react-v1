name: Temporary live-class terminology migration

on:
  push:
    branches:
      - fix/live-online-teams-terminology

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace obsolete Zoom-facing copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "src/pages/public/BestOnlinePhonicsClassesIndiaPage.tsx": [
                  (
                      "Classes run live on Zoom, so families in India and abroad can join from home with a simple browser link.",
                      "Classes are conducted live through Microsoft Teams, so families in India and abroad can join from home with the class link shared before the session.",
                  ),
                  (
                      "Zoom-based live classes for India and global families",
                      "Live online classes for India and global families",
                  ),
                  (
                      "Yes. Classes are online, so Indian families abroad can join based on available schedule slots and Zoom access.",
                      "Yes. Classes are live online, so Indian families abroad can join based on available schedule slots and the class link shared before the session.",
                  ),
                  (
                      "Tiny Steps uses Zoom for live sessions so families can join from India or abroad with a simple browser link.",
                      "Tiny Steps conducts live online classes through Microsoft Teams. Families receive a class link before the scheduled session and can join from India or abroad.",
                  ),
              ],
              "src/pages/public/CareersPage.tsx": [
                  (
                      "Comfort using Zoom / Teams-style online classrooms, screen sharing and digital lesson materials.",
                      "Comfort using Microsoft Teams, screen sharing and digital lesson materials.",
                  ),
              ],
              "src/components/Home/HowToStartSection.tsx": [
                  (
                      "Duration: 20–25 minutes • Time: 5 AM to 10 PM IST • Platform: Zoom",
                      "Duration: 20–25 minutes • Time: 5 AM to 10 PM IST • Format: Live online class",
                  ),
              ],
              "src/pages/parent/components/sessions/UpcomingSessionsView.tsx": [
                  ("Join Zoom", "Join Class"),
              ],
              "src/components/sections/IntegrationsSection.jsx": [
                  (
                      "{ name: 'Zoom', icon: '🎥', color: 'from-blue-400 to-blue-600', description: 'Seamless video conferencing for live classes' },",
                      "{ name: 'Microsoft Teams', icon: '🎥', color: 'from-blue-400 to-blue-600', description: 'Live video classes with simple class joining' },",
                  ),
              ],
              "src/pages/kid/components/session/TodaySession.tsx": [
                  ("https://zoom.us/j/123456789", "https://teams.microsoft.com/"),
              ],
              "src/components/kid/Home/HomeScreen.tsx": [
                  ("// Open Zoom link", "// Open live class link"),
                  ("https://zoom.us/j/example", "https://teams.microsoft.com/"),
              ],
              "src/content/blog/posts/public-speaking/week-24-speaking-family-showcase.ts": [
                  (
                      "How to host at home or on Zoom (grandparents included)",
                      "How to host at home or on a video call (grandparents included)",
                  ),
                  (
                      "send a simple invite for Zoom if you include distant family",
                      "send a simple video-call invite if you include distant family",
                  ),
              ],
          }

          changed = []
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {filename}: {old}")
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.append(filename)

          # Guard the customer-facing surfaces that should no longer claim Zoom is Tiny Steps' class platform.
          guarded = [
              "src/pages/public/BestOnlinePhonicsClassesIndiaPage.tsx",
              "src/pages/public/CareersPage.tsx",
              "src/components/Home/HowToStartSection.tsx",
              "src/pages/parent/components/sessions/UpcomingSessionsView.tsx",
              "src/components/sections/IntegrationsSection.jsx",
              "src/pages/kid/components/session/TodaySession.tsx",
              "src/components/kid/Home/HomeScreen.tsx",
              "src/content/blog/posts/public-speaking/week-24-speaking-family-showcase.ts",
          ]
          for filename in guarded:
              text = Path(filename).read_text(encoding="utf-8")
              if "Zoom" in text or "zoom.us" in text:
                  raise SystemExit(f"Obsolete Zoom reference remains in guarded file: {filename}")

          print("Updated files:")
          for filename in changed:
              print(f"- {filename}")
          PY

      - name: Show remaining Zoom references for audit
        shell: bash
        run: |
          echo "Remaining repository references (expected to be UI zoom effects, legacy/internal terminology, docs, or unrelated picture-zoom wording):"
          git grep -n -i 'zoom' -- ':!node_modules' || true

      - name: Remove temporary workflow and commit migration
        shell: bash
        run: |
          git rm .github/workflows/temporary-live-class-terminology-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: align live class terminology with Microsoft Teams"
          git push origin HEAD:fix/live-online-teams-terminology
