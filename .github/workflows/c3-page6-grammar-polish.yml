name: C3 Page 6 Grammar Polish

on:
  push:
    branches:
      - seo/c1-parent-commercial-search-universe
    paths:
      - '.github/workflows/c3-page6-grammar-polish.yml'

permissions:
  contents: write

jobs:
  polish-grammar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/c1-parent-commercial-search-universe
          fetch-depth: 0
      - name: Apply Page 6 grammar polish
        run: python scripts/tmp-c3-page6-grammar-polish.py
      - name: Focused source check
        run: |
          git diff --check
          grep -q 'UAE, United States, United Kingdom, Australia, Singapore' src/pages/grammar.tsx
          test "$(grep -c 'Grammar questions parents ask' src/pages/grammar.tsx || true)" = "0"
      - name: Commit Page 6 polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/grammar.tsx
          git commit -m 'C3 page 6: polish grammar international and FAQ content'
          git push origin HEAD:seo/c1-parent-commercial-search-universe
