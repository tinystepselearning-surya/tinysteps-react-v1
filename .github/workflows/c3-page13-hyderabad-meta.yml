name: C3 Page 13 Hyderabad Meta Apply

on:
  push:
    branches:
      - seo/c1-parent-commercial-search-universe
    paths:
      - '.github/workflows/c3-page13-hyderabad-meta.yml'

permissions:
  contents: write

jobs:
  align-hyderabad-meta:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/c1-parent-commercial-search-universe
          fetch-depth: 0
      - name: Apply Hyderabad metadata alignment
        run: python scripts/tmp-c3-page13-hyderabad-meta.py
      - name: Focused source check
        run: |
          git diff --check
          grep -F "Online English Classes for Kids in Hyderabad | Tiny Steps" src/lib/routeSeoRegistry.js
          grep -F "online English classes for kids in Hyderabad" src/lib/routeSeoRegistry.js
      - name: Commit Hyderabad registry alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/routeSeoRegistry.js
          git commit -m 'C3 page 13: align Hyderabad commercial metadata'
          git push origin HEAD:seo/c1-parent-commercial-search-universe
