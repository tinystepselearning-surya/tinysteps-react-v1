name: Patch parent canonical bootstrap rules

on: push

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/patch-parent-canonical-bootstrap-rules.py
      - run: |
          if git diff --quiet -- firestore.rules; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          git commit -m "[bootstrap-patch] Allow one-time parent projection bootstrap requests"
          git push origin HEAD:hotfix/parent-canonical-bootstrap
