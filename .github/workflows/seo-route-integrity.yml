name: SEO Route Integrity

on:
  pull_request:
    paths:
      - 'src/app/routes.tsx'
      - 'src/lib/publicRouteManifest.js'
      - 'src/lib/routeSeoRegistry.js'
      - 'scripts/seo-route-inventory.mjs'
      - 'scripts/generate-sitemaps.js'
      - 'scripts/prerender.mjs'
      - 'scripts/seo-route-integrity.mjs'
      - 'firebase.json'
      - 'package.json'
      - '.github/workflows/seo-route-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'src/app/routes.tsx'
      - 'src/lib/publicRouteManifest.js'
      - 'src/lib/routeSeoRegistry.js'
      - 'scripts/seo-route-inventory.mjs'
      - 'scripts/generate-sitemaps.js'
      - 'scripts/prerender.mjs'
      - 'scripts/seo-route-integrity.mjs'
      - 'firebase.json'
      - 'package.json'

permissions:
  contents: read

jobs:
  seo-route-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and verify SEO route integrity
        run: npm run build
