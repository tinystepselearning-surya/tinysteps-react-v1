name: One-shot blog title sync

on:
  push:
    branches:
      - seo/blog-index-title-guides

permissions:
  contents: write

jobs:
  sync-blog-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize blog SEO title
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = 'Phonics, Reading, Grammar & Speaking Guides | Tiny Steps'

          registry = Path('src/lib/routeSeoRegistry.js')
          registry_text = registry.read_text()
          old_registry = "title: 'Blog | Tiny Steps Learning',"
          new_registry = f"title: '{target}',"
          assert registry_text.count(old_registry) == 1, 'Expected exactly one registry title to replace'
          registry.write_text(registry_text.replace(old_registry, new_registry, 1))

          page = Path('src/pages/blog/BlogIndexPage.tsx')
          page_text = page.read_text()
          old_page = "const metaTitle = 'Tiny Steps Blog | Phonics, Grammar, Speaking & English Help for Parents';"
          new_page = f"const metaTitle = '{target}';"
          assert page_text.count(old_page) == 1, 'Expected exactly one runtime blog title to replace'
          page.write_text(page_text.replace(old_page, new_page, 1))
          PY

      - name: Regenerate RSS and feeds
        run: node scripts/generate-rss.mjs

      - name: Verify synchronized title
        shell: bash
        run: |
          grep -F "Phonics, Reading, Grammar & Speaking Guides | Tiny Steps" src/lib/routeSeoRegistry.js
          grep -F "Phonics, Reading, Grammar & Speaking Guides | Tiny Steps" src/pages/blog/BlogIndexPage.tsx
          grep -F "Phonics, Reading, Grammar &amp; Speaking Guides | Tiny Steps" public/rss.xml public/feed.xml public/blog/rss.xml public/blog/feed.xml
          git diff --check

      - name: Commit synchronized outputs and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-blog-title-sync.yml
          git add src/lib/routeSeoRegistry.js src/pages/blog/BlogIndexPage.tsx public/rss.xml public/feed.xml public/blog/rss.xml public/blog/feed.xml
          git commit -m "seo: strengthen blog index title"
          git push origin HEAD:seo/blog-index-title-guides
