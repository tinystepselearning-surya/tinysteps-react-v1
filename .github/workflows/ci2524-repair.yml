name: CI2524 branch repair validation

on:
  push:
    branches: [fix/ci2524-seo-recovery-contracts]
    paths:
      - scripts/ci2524-reconcile.mjs
      - .github/workflows/ci2524-repair.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci2524-branch-repair
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/ci2524-seo-recovery-contracts'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      repair_sha: ${{ steps.commit.outputs.repair_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
      - name: Apply reviewed contract repairs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci2524-reconcile.mjs
          git diff --check
          git diff --stat
      - name: Commit only scoped repairs to the isolated branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add src/tests/seo src/tests/components/programs/ClusterSeoNav.spec.tsx src/content/blog/shared/authorityLinking.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: reconcile SEO regression contracts after approved recovery changes'
          git push origin HEAD:refs/heads/fix/ci2524-seo-recovery-contracts
          echo "repair_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  static-checks:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.repair_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript
        if: ${{ !cancelled() }}
        run: npm run typecheck

  unit-tests:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.repair_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions --include=dev
      - name: Build Functions test imports
        run: npm --prefix functions run build
      - name: Full unit suite with unchanged coverage settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci2524
          npm run test:unit -- --coverage 2>&1 | tee artifacts/ci2524/unit-tests.log
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci2524-unit-validation
          path: artifacts/ci2524/
          retention-days: 7

  seo-audits:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.repair_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - name: Regenerate discovery files
        run: |
          npm run gen:sitemaps
          npm run generate:rss
      - name: Blog consolidation audit
        run: npm run seo:blog-consolidation
      - name: Recovery technical controls
        if: ${{ !cancelled() }}
        run: npm run seo:recovery-brick11
