name: GSC Revalidation & Submission Plan

on:
  pull_request:
    branches:
      - main
      - seo/brick-5-content-quality-consolidation
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gsc-revalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Certify historical GSC decisions
        run: node scripts/audit-gsc-crawled-not-indexed.mjs

      - name: Build and prerender public pages
        run: npm run build

      - name: Certify Brick 5 content quality
        run: node scripts/gsc-content-quality-guard.mjs

      - name: Build Brick 6 revalidation and submission plan
        run: node scripts/gsc-revalidation-submission-plan.mjs

      - name: Upload Brick 6 operator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-brick-6-revalidation-submission
          path: |
            artifacts/gsc-content-quality-report.json
            artifacts/gsc-revalidation-submission-report.json
            artifacts/gsc-request-indexing-now.txt
            artifacts/gsc-wait-for-google-recrawl.txt
            artifacts/gsc-do-not-submit.txt
          if-no-files-found: ignore
