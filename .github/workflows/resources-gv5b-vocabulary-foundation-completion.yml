name: Resources GV5B Vocabulary Foundation Completion

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/vocabularyAuthority*'
      - 'src/lib/vocabularyKnowledgeSources.js'
      - 'src/lib/vocabularyLexicalModel.ts'
      - 'src/lib/grammarVocabularyAuthorityRequirements.*'
      - 'src/lib/publicRouteManifest.js'
      - 'src/lib/routeSeoRegistry.js'
      - 'src/lib/canonicalTopicOwnershipRegistry.js'
      - 'src/lib/breadcrumbAeoGeoRegistry.js'
      - 'src/lib/aiAnswerLayerRegistry.js'
      - 'src/lib/commercialC7KnowledgeOwnerMapping.ts'
      - 'src/lib/commercialC7IntentNextStepRules.ts'
      - 'src/lib/commercialC7ContextualHandoffImplementation.ts'
      - 'src/lib/publicAnalyticsPathPolicy.js'
      - 'src/pages/VocabularyHubPage.tsx'
      - 'src/pages/VocabularyKnowledgePage.tsx'
      - 'src/tests/seo/vocabularyAuthorityGv4.spec.ts'
      - 'src/tests/seo/vocabularyAuthorityGv5.spec.ts'
      - 'src/tests/seo/vocabularyAuthorityGv5b.spec.ts'
      - 'src/tests/seo/resourcesR24R26AiAnswerLayers.spec.ts'
      - 'src/tests/seo/commercialC7KnowledgeOwnerMapping.spec.ts'
      - 'src/tests/seo/commercialC7IntentNextStepRules.spec.ts'
      - 'src/tests/seo/commercialC7ContextualHandoffs.spec.ts'
      - 'scripts/audit-vocabulary-authority-gv4.mjs'
      - 'scripts/audit-vocabulary-authority-gv5.mjs'
      - 'scripts/audit-vocabulary-authority-gv5b.mjs'
      - 'scripts/audit-canonical-topic-ownership.mjs'
      - 'scripts/audit-ai-answer-layers.mjs'
      - 'scripts/generate-rss.mjs'
      - 'scripts/commercial-c7-reviewed-seo-repair.mjs'
      - 'scripts/test/commercial-c7-reviewed-seo-repair.spec.mjs'
      - 'docs/seo/resources-architecture/GV5B_*'
      - '.github/workflows/resources-gv5b-vocabulary-foundation-completion.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  resources-gv5b-vocabulary-foundation-completion:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run GV5B and preservation regressions
        run: >
          npx vitest run
          src/tests/seo/vocabularyAuthorityGv5b.spec.ts
          src/tests/seo/vocabularyAuthorityGv5.spec.ts
          src/tests/seo/vocabularyAuthorityGv4.spec.ts
          src/tests/seo/vocabularyLexicalModel.spec.ts
          src/tests/seo/grammarVocabularyAuthorityRequirements.spec.ts
          src/tests/seo/resourcesR24R26AiAnswerLayers.spec.ts
          src/tests/seo/resourcesR5CanonicalTopicOwnership.spec.js
          src/tests/seo/commercialC7KnowledgeOwnerMapping.spec.ts
          src/tests/seo/commercialC7IntentNextStepRules.spec.ts
          src/tests/seo/commercialC7ContextualHandoffs.spec.ts
          scripts/test/commercial-c7-reviewed-seo-repair.spec.mjs
      - name: Audit GV5B source completion contract
        run: node scripts/audit-vocabulary-authority-gv5b.mjs
      - name: Re-run GV5 preservation audit
        run: node scripts/audit-vocabulary-authority-gv5.mjs
      - name: Re-run GV4 preservation audit
        run: node scripts/audit-vocabulary-authority-gv4.mjs
      - name: Audit canonical ownership
        run: node scripts/audit-canonical-topic-ownership.mjs
      - name: Audit AI answer layers
        run: node scripts/audit-ai-answer-layers.mjs
      - name: Lint GV5B TypeScript surfaces
        run: >
          npx eslint
          src/pages/VocabularyHubPage.tsx
          src/pages/VocabularyKnowledgePage.tsx
          src/tests/seo/vocabularyAuthorityGv5b.spec.ts
          src/tests/seo/vocabularyAuthorityGv5.spec.ts
          src/tests/seo/vocabularyAuthorityGv4.spec.ts
          src/tests/seo/commercialC7KnowledgeOwnerMapping.spec.ts
          src/tests/seo/commercialC7IntentNextStepRules.spec.ts
          src/tests/seo/commercialC7ContextualHandoffs.spec.ts
      - name: Run type check
        run: npm run typecheck
      - name: Install Chromium for prerender
        run: npx playwright install --with-deps chromium
      - name: Build and prerender public site
        run: npm run build
      - name: Enforce public bundle guard
        run: npm run bundle:public-check
      - name: Verify rendered GV5B completion contract
        run: node scripts/audit-vocabulary-authority-gv5b.mjs --dist
      - name: Verify rendered GV5 preservation contract
        run: node scripts/audit-vocabulary-authority-gv5.mjs --dist
      - name: Verify rendered GV4 preservation contract
        run: node scripts/audit-vocabulary-authority-gv4.mjs --dist
      - name: Verify generated AI answer layers
        run: node scripts/audit-ai-answer-layers.mjs --generated
