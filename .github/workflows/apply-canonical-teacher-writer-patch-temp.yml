name: Temporary sync canonical teacher writer branch

on:
  push:
    branches:
      - refactor/canonical-teacher-writers
    paths:
      - .github/workflows/apply-canonical-teacher-writer-patch-temp.yml

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/canonical-teacher-writers
          fetch-depth: 0

      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git diff --check HEAD^ HEAD || true
          git push origin HEAD:refactor/canonical-teacher-writers
