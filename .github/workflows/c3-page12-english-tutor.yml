name: C3 Page 12 English Tutor Apply

on:
  push:
    branches:
      - seo/c1-parent-commercial-search-universe
    paths:
      - '.github/workflows/c3-page12-english-tutor.yml'

permissions:
  contents: write

jobs:
  apply-english-tutor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/c1-parent-commercial-search-universe
          fetch-depth: 0
      - name: Apply Page 12 English tutor reconciliation
        run: python scripts/tmp-c3-page12-english-tutor.py
      - name: Focused source check
        run: |
          git diff --check
          grep -F "title=\"What parents get from an online English tutor for kids\"" src/pages/public/OnlineEnglishClassesForKidsPage.tsx
          grep -F "'1 to 1 English tutor for kids online'" src/pages/public/OnlineEnglishClassesForKidsPage.tsx
          grep -F "1 to 1 English tutor for kids online" src/lib/routeSeoRegistry.js
          grep -F "General English tutor or subject-specific support?" src/pages/public/OnlineEnglishClassesForKidsPage.tsx
          grep -F "What is the difference between an online English tutor and an online English class at Tiny Steps?" src/pages/public/OnlineEnglishClassesForKidsPage.tsx
      - name: Commit Page 12 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/public/OnlineEnglishClassesForKidsPage.tsx src/lib/routeSeoRegistry.js
          git commit -m 'C3 page 12: strengthen generic English tutor intent'
          git push origin HEAD:seo/c1-parent-commercial-search-universe
