name: Public Facts Source Truth Reconcile

on:
  push:
    branches:
      - seo/c1-parent-commercial-search-universe
    paths:
      - '.github/workflows/public-facts-source-truth-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile-public-facts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/c1-parent-commercial-search-universe
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - name: Apply source-truth audit reconciliation
        run: python scripts/tmp-public-facts-source-truth-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Verify public facts at source
        run: npm run content:public-facts
      - name: Verify production build and prerender
        run: npm run build
      - name: Commit reconciled public-facts audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-public-facts.mjs
          git diff --cached --check
          git commit -m 'fix: audit commercial public facts at source'
          git push origin HEAD:seo/c1-parent-commercial-search-universe
