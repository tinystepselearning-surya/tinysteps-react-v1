name: C3 Page 6 Grammar Apply

on:
  push:
    branches:
      - seo/c1-parent-commercial-search-universe
    paths:
      - '.github/workflows/c3-page6-grammar-apply.yml'

permissions:
  contents: write

jobs:
  apply-grammar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/c1-parent-commercial-search-universe
          fetch-depth: 0
      - name: Apply Page 6 grammar reconciliation
        run: python scripts/tmp-c3-page6-grammar-apply.py
      - name: Focused diff check
        run: git diff --check && git diff -- src/pages/grammar.tsx src/lib/routeSeoRegistry.js vite.config.js
      - name: Commit Page 6 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/grammar.tsx src/lib/routeSeoRegistry.js vite.config.js
          git commit -m 'C3 page 6: reconcile grammar owner'
          git push origin HEAD:seo/c1-parent-commercial-search-universe
