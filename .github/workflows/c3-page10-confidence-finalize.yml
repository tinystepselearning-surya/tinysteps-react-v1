name: C3 Page 10 Confidence Finalize

on:
  push:
    branches:
      - seo/c1-parent-commercial-search-universe
    paths:
      - '.github/workflows/c3-page10-confidence-finalize.yml'

permissions:
  contents: write

jobs:
  finalize-confidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/c1-parent-commercial-search-universe
          fetch-depth: 0
      - name: Finalize Page 10 confidence owner
        run: python scripts/tmp-c3-page10-confidence-finalize.py
      - name: Focused source check
        run: |
          git diff --check
          grep -F "Confidence Building Classes for Kids | Live 1:1 | Tiny Steps" src/pages/public/ConfidenceBuildingProgramKidsPage.tsx
          grep -F "Confidence Building Classes for Kids | Live 1:1 | Tiny Steps" src/lib/routeSeoRegistry.js
          ! grep -F "**" src/pages/public/ConfidenceBuildingProgramKidsPage.tsx
      - name: Commit Page 10 finalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/public/ConfidenceBuildingProgramKidsPage.tsx src/lib/routeSeoRegistry.js
          git commit -m 'C3 page 10: finalize confidence-building specialist owner'
          git push origin HEAD:seo/c1-parent-commercial-search-universe
