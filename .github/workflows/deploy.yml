name: CI/CD Deploy to Firebase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      functions_only:
        description: Optional comma-separated Function targets for a surgical main-branch recovery
        required: false
        type: string

# Global environment variables
env:
  FIREBASE_PROJECT_ID: tinysteps-react-v1

jobs:
  analyze-changes:
    runs-on: ubuntu-latest
    outputs:
      functions_validation_required: ${{ steps.impact.outputs.functions_validation_required }}
      functions_deployment_required: ${{ steps.impact.outputs.functions_deployment_required }}
      functions_full_deployment: ${{ steps.impact.outputs.functions_full_deployment }}
      functions_targets: ${{ steps.impact.outputs.functions_targets }}
      frontend_validation_required: ${{ steps.impact.outputs.frontend_validation_required }}
      hosting_changed: ${{ steps.impact.outputs.hosting_changed }}
      firestore_validation_required: ${{ steps.impact.outputs.firestore_validation_required }}
      firestore_rules_changed: ${{ steps.impact.outputs.firestore_rules_changed }}
      school_transport_required: ${{ steps.impact.outputs.school_transport_required }}
      lead_iam_required: ${{ steps.impact.outputs.lead_iam_required }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Resolve artifact and Function impact
        id: impact
        run: >-
          node scripts/resolve-deployment-impact.mjs
          --before "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.sha }}"
          --sha "${{ github.sha }}"

  build-and-test:
    needs: analyze-changes
    runs-on: ubuntu-latest
    env:
      VITE_ASK_TINY_STEPS_FIREBASE_API_KEY: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_API_KEY }}
      VITE_ASK_TINY_STEPS_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_AUTH_DOMAIN }}
      VITE_ASK_TINY_STEPS_FIREBASE_PROJECT_ID: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_PROJECT_ID }}
      VITE_ASK_TINY_STEPS_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_STORAGE_BUCKET }}
      VITE_ASK_TINY_STEPS_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_ASK_TINY_STEPS_FIREBASE_APP_ID: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_APP_ID }}
      VITE_ASK_TINY_STEPS_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.VITE_ASK_TINY_STEPS_RECAPTCHA_ENTERPRISE_SITE_KEY }}
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        if: >-
          needs.analyze-changes.outputs.functions_validation_required == 'true' ||
          needs.analyze-changes.outputs.frontend_validation_required == 'true' ||
          needs.analyze-changes.outputs.firestore_validation_required == 'true'
        run: npm ci

      - name: Install Functions dependencies
        if: >-
          needs.analyze-changes.outputs.functions_validation_required == 'true' ||
          needs.analyze-changes.outputs.firestore_validation_required == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.functions_only != '')
        run: npm ci --prefix functions --include=dev

      - name: Build Cloud Functions
        if: >-
          needs.analyze-changes.outputs.functions_validation_required == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.functions_only != '')
        run: npm --prefix functions run build

      - name: Run Cloud Functions unit tests
        if: needs.analyze-changes.outputs.functions_validation_required == 'true'
        run: npm --prefix functions test

      - name: Run Functions impact resolver tests
        if: needs.analyze-changes.outputs.functions_validation_required == 'true'
        run: node --test scripts/test/functions-impact.node-test.mjs

      - name: Run bounded Functions deployment tests
        if: needs.analyze-changes.outputs.functions_validation_required == 'true'
        run: node --test scripts/test/functions-deployment.node-test.mjs

      - name: Validate bounded Functions deployment plan (zero mutation)
        if: needs.analyze-changes.outputs.functions_deployment_required == 'true'
        run: node scripts/deploy-functions-batched.mjs --plan
        env:
          FUNCTIONS_DEPLOY_ONLY: ${{ needs.analyze-changes.outputs.functions_targets }}

      - name: Run teacher progress enrollment audit classifier tests
        if: needs.analyze-changes.outputs.frontend_validation_required == 'true'
        run: npx vitest run scripts/test/teacher-progress-enrollment-audit.spec.mjs

      - name: Setup Java for Firestore emulator
        if: needs.analyze-changes.outputs.firestore_validation_required == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Firestore rules tests
        if: needs.analyze-changes.outputs.firestore_validation_required == 'true'
        run: >-
          npx firebase-tools@15.30.0 emulators:exec
          --project ${{ env.FIREBASE_PROJECT_ID }}
          --only firestore
          "FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 npx vitest run src/tests/firestore/publicLeads.rules.spec.ts src/tests/firestore/schoolDomain.rules.spec.ts src/tests/firestore/schoolProgramme.rules.spec.ts src/tests/firestore/teacherIdentity.rules.spec.ts src/tests/firestore/teacherProgressAuthorization.rules.spec.ts src/tests/firestore/childCourseProgress.rules.spec.ts"

      - name: Run website lead deduplication transaction tests
        if: needs.analyze-changes.outputs.firestore_validation_required == 'true'
        run: >-
          npx firebase-tools@15.30.0 emulators:exec
          --project ${{ env.FIREBASE_PROJECT_ID }}
          --only firestore
          "FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 npx vitest run --config functions/vitest.config.ts functions/test/websiteLeadDeduplication.emulator.spec.ts"

      - name: Cache Playwright browsers
        if: needs.analyze-changes.outputs.frontend_validation_required == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: needs.analyze-changes.outputs.frontend_validation_required == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run linter
        if: needs.analyze-changes.outputs.frontend_validation_required == 'true'
        run: npm run lint

      - name: Run type check
        if: needs.analyze-changes.outputs.frontend_validation_required == 'true'
        run: npm run typecheck

      - name: Run unit tests
        if: needs.analyze-changes.outputs.frontend_validation_required == 'true'
        run: npm run test:unit -- --coverage

      - name: Validate Ask Tiny Steps production build configuration
        if: needs.analyze-changes.outputs.frontend_validation_required == 'true'
        run: node scripts/validate-ask-tiny-steps-build-env.mjs

      - name: Build app
        if: needs.analyze-changes.outputs.frontend_validation_required == 'true'
        run: npm run build

      - name: Run SEO smoke test
        if: needs.analyze-changes.outputs.frontend_validation_required == 'true'
        run: npm run seo:smoke

      - name: Upload coverage to Codecov
        if: needs.analyze-changes.outputs.frontend_validation_required == 'true'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json

  deploy-to-firebase:
    # Only enter the project mutation lock when at least one Firebase artifact changed.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.analyze-changes.outputs.functions_deployment_required == 'true' ||
       needs.analyze-changes.outputs.hosting_changed == 'true' ||
       needs.analyze-changes.outputs.firestore_rules_changed == 'true')
    needs: [analyze-changes, build-and-test]
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-deployment-tinysteps-react-v1
      # Let an active Firebase CLI operation finish; never cancel it mid-deploy.
      cancel-in-progress: false
    env:
      FUNCTIONS_DEPLOY_ONLY: ${{ needs.analyze-changes.outputs.functions_targets }}
      FUNCTIONS_DEPLOY_FULL: ${{ needs.analyze-changes.outputs.functions_full_deployment }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      VITE_ASK_TINY_STEPS_FIREBASE_API_KEY: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_API_KEY }}
      VITE_ASK_TINY_STEPS_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_AUTH_DOMAIN }}
      VITE_ASK_TINY_STEPS_FIREBASE_PROJECT_ID: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_PROJECT_ID }}
      VITE_ASK_TINY_STEPS_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_STORAGE_BUCKET }}
      VITE_ASK_TINY_STEPS_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_ASK_TINY_STEPS_FIREBASE_APP_ID: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_APP_ID }}
      VITE_ASK_TINY_STEPS_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.VITE_ASK_TINY_STEPS_RECAPTCHA_ENTERPRISE_SITE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        if: needs.analyze-changes.outputs.hosting_changed == 'true'
        run: npm ci

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TINYSTEPS_REACT_V1 }}
          create_credentials_file: true

      - name: Refuse stale staging deployment
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --depth=1
          current_main_sha="$(git rev-parse origin/main)"

          echo "Workflow SHA: ${GITHUB_SHA}"
          echo "Current main SHA: ${current_main_sha}"

          if [[ "${GITHUB_SHA}" != "${current_main_sha}" ]]; then
            echo "::error::Refusing to deploy stale commit ${GITHUB_SHA}. Current main is ${current_main_sha}."
            exit 1
          fi

      - name: Validate Ask Tiny Steps staging build configuration
        if: needs.analyze-changes.outputs.hosting_changed == 'true'
        run: node scripts/validate-ask-tiny-steps-build-env.mjs

      - name: Deploy to Firebase Staging Preview Channel
        if: needs.analyze-changes.outputs.hosting_changed == 'true'
        run: bash .github/scripts/firebase-hosting-deploy.sh channel staging
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}

      - name: Clean stale functions build artifacts
        if: needs.analyze-changes.outputs.functions_deployment_required == 'true'
        run: rm -rf functions/lib functions/tsconfig.tsbuildinfo functions/.tsbuildinfo || true

      - name: Install Functions dependencies
        if: needs.analyze-changes.outputs.functions_deployment_required == 'true'
        run: npm ci --prefix functions --include=dev

      - name: Build Cloud Functions
        if: needs.analyze-changes.outputs.functions_deployment_required == 'true'
        run: npm --prefix functions run build

      - name: Verify deployment commit
        run: |
          echo "📦 Deploying commit:"
          git rev-parse HEAD && git log -1 --oneline

      - name: Verify function deployment metadata
        if: needs.analyze-changes.outputs.functions_deployment_required == 'true'
        run: node scripts/verify-function-deployment-metadata.mjs

      - name: Plan bounded Cloud Functions deployment
        if: needs.analyze-changes.outputs.functions_deployment_required == 'true'
        run: node scripts/deploy-functions-batched.mjs --plan

      - name: Setup Google Cloud CLI
        if: needs.analyze-changes.outputs.functions_deployment_required == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Refuse stale production deployment
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --depth=1
          current_main_sha="$(git rev-parse origin/main)"

          echo "Workflow SHA: ${GITHUB_SHA}"
          echo "Current main SHA: ${current_main_sha}"

          if [[ "${GITHUB_SHA}" != "${current_main_sha}" ]]; then
            echo "::error::Refusing to deploy stale commit ${GITHUB_SHA}. Current main is ${current_main_sha}."
            exit 1
          fi

      - name: Deploy Cloud Functions in bounded batches
        if: needs.analyze-changes.outputs.functions_deployment_required == 'true'
        run: node scripts/deploy-functions-batched.mjs --deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload bounded Functions deployment report
        if: always() && needs.analyze-changes.outputs.functions_deployment_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: functions-deployment-report-${{ github.sha }}
          path: artifacts/functions-deployment-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce School callable public transport invocation
        if: needs.analyze-changes.outputs.school_transport_required == 'true'
        run: >-
          node scripts/ensure-school-callable-public-invocation.mjs
          --project "${{ env.FIREBASE_PROJECT_ID }}"
          --region asia-south1

      - name: Enforce lead attribution callable public transport invocation
        if: needs.analyze-changes.outputs.lead_iam_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          service_resource="$(gcloud functions describe enrichPublicLeadAttribution \
            --gen2 \
            --project="${{ env.FIREBASE_PROJECT_ID }}" \
            --region=asia-south1 \
            --format='value(serviceConfig.service)')"
          expected_prefix="projects/${{ env.FIREBASE_PROJECT_ID }}/locations/asia-south1/services/"
          if [[ "${service_resource}" != "${expected_prefix}"* ]]; then
            echo "Unexpected Cloud Run service resource for enrichPublicLeadAttribution: ${service_resource:-<empty>}" >&2
            exit 1
          fi
          service_name="${service_resource##*/}"
          if [[ ! "${service_name}" =~ ^[a-z][a-z0-9-]{0,62}$ ]]; then
            echo "Invalid Cloud Run service name for enrichPublicLeadAttribution: ${service_name:-<empty>}" >&2
            exit 1
          fi
          gcloud run services add-iam-policy-binding "${service_name}" \
            --project="${{ env.FIREBASE_PROJECT_ID }}" \
            --region=asia-south1 \
            --member=allUsers \
            --role=roles/run.invoker \
            --condition=None \
            --quiet
          echo "Verified public transport IAM for enrichPublicLeadAttribution (${service_name})"

      - name: Deploy Firestore Security Rules
        if: needs.analyze-changes.outputs.firestore_rules_changed == 'true'
        run: >-
          npx firebase-tools@15.30.0 deploy
          --only firestore:rules
          --project "${{ env.FIREBASE_PROJECT_ID }}"
          --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}

      - name: Verify School callable transport
        if: needs.analyze-changes.outputs.school_transport_required == 'true'
        run: >-
          node scripts/verify-school-callable-transport.mjs
          --project "${{ env.FIREBASE_PROJECT_ID }}"
          --region asia-south1
          --origin https://tinystepslearning.com
          --report artifacts/school-callable-transport-verification.md

      - name: Upload School callable transport report
        if: always() && needs.analyze-changes.outputs.school_transport_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: school-callable-transport-verification-${{ github.sha }}
          path: artifacts/school-callable-transport-verification.md
          if-no-files-found: warn

      - name: Validate Ask Tiny Steps production build configuration
        if: needs.analyze-changes.outputs.hosting_changed == 'true'
        run: node scripts/validate-ask-tiny-steps-build-env.mjs

      - name: Deploy to Firebase Production
        if: needs.analyze-changes.outputs.hosting_changed == 'true'
        run: bash .github/scripts/firebase-hosting-deploy.sh live
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}

      - name: Verify live deployment integrity and build identity
        if: needs.analyze-changes.outputs.hosting_changed == 'true'
        run: >-
          node scripts/verify-live-deployment.mjs
          --origin https://tinystepslearning.com
          --expected-sha "${{ github.sha }}"
          --report artifacts/live-deployment-verification.md

      - name: Upload live deployment verification report
        if: always() && needs.analyze-changes.outputs.hosting_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-deployment-verification-${{ github.sha }}
          path: artifacts/live-deployment-verification.md
          if-no-files-found: warn

      - name: Verify live IndexNow ownership key
        if: needs.analyze-changes.outputs.hosting_changed == 'true' && env.INDEXNOW_KEY != ''
        run: npm run indexnow:verify

      - name: Submit canonical public URLs to IndexNow
        if: needs.analyze-changes.outputs.hosting_changed == 'true' && env.INDEXNOW_KEY != ''
        env:
          INDEXNOW_SITEMAP: dist/sitemap.xml
        run: npm run indexnow:submit

  recover-functions-manually:
    # An empty manual input is deliberately a no-op. Recovery is main-only and
    # shares the production lock so it cannot overlap a normal deployment.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.functions_only != ''
    needs: build-and-test
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-deployment-tinysteps-react-v1
      cancel-in-progress: false
    env:
      FUNCTIONS_DEPLOY_ONLY: ${{ inputs.functions_only }}

    steps:
      - name: Checkout selected main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions --include=dev

      - name: Build Cloud Functions
        run: npm --prefix functions run build

      - name: Verify deployment commit
        run: |
          echo "Deploying surgical recovery from commit:"
          git rev-parse HEAD
          git log -1 --oneline

      - name: Verify function deployment metadata
        run: node scripts/verify-function-deployment-metadata.mjs

      - name: Validate surgical Functions plan (zero mutation)
        run: node scripts/deploy-functions-batched.mjs --plan

      - name: Authenticate to Google Cloud
        id: recovery-gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TINYSTEPS_REACT_V1 }}
          create_credentials_file: true

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy only validated recovery targets
        run: node scripts/deploy-functions-batched.mjs --deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.recovery-gcp-auth.outputs.credentials_file_path }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload surgical Functions deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-recovery-report-${{ github.sha }}
          path: artifacts/functions-deployment-report.json
          if-no-files-found: warn
          retention-days: 7
