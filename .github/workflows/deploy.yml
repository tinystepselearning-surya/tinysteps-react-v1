name: CI/CD Deploy to Firebase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Global environment variables
env:
  FIREBASE_PROJECT_ID: tinysteps-react-v1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit -- --coverage

      - name: Build app
        run: npm run build

      - name: Run SEO smoke test
        run: npm run seo:smoke

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json

  deploy-to-staging:
    # Only run on push to main, after build-and-test succeeds
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Deploy to Firebase Staging
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TINYSTEPS_REACT_V1 }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          channelId: live

  deploy-to-production:
    # Only run on push to main, after staging deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-to-staging
    runs-on: ubuntu-latest
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Clean stale functions build artifacts
        run: rm -rf functions/lib functions/tsconfig.tsbuildinfo functions/.tsbuildinfo || true

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Build Cloud Functions
        run: npm --prefix functions run build

      - name: Verify deployment commit and exports
        run: |
          echo "📦 Deploying commit:"
          git rev-parse HEAD && git log -1 --oneline
          
          echo ""
          echo "🔍 Verifying critical function exports with metadata..."
          
          cd functions
          node -e '
          const m = require(".");
          const keys = ["batchInsightsRollup11am","batchInsightsRollup5pm","batchInsightsRollup11pm","onGameProgressWrite","onGameSessionCreateTrigger"];
          let failures = [];
          
          for (const k of keys) {
            const f = m[k];
            const ep = f && f.__endpoint;
            const region = ep && ep.region;
            const hasRegion = region && region.includes("asia-south1");
            
            console.log(k, JSON.stringify({
              exists: !!f,
              hasEndpoint: !!ep,
              region: region
            }));
            
            if (!f || !ep || !hasRegion) {
              failures.push(k);
            }
          }
          
          if (failures.length > 0) {
            console.error("\n❌ CRITICAL: Functions missing proper metadata:", failures);
            console.error("Functions must have __endpoint with region: [\"asia-south1\"]");
            process.exit(1);
          }
          
          console.log("\n✅ All critical functions verified with asia-south1 region");
          '
          cd ..

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TINYSTEPS_REACT_V1 }}
          create_credentials_file: true

      - name: Deploy Cloud Functions
        run: npx firebase-tools@latest deploy --only functions --project ${{ env.FIREBASE_PROJECT_ID }} --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Deploy to Firebase Production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TINYSTEPS_REACT_V1 }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          channelId: live

      - name: Submit IndexNow URLs
        if: ${{ env.INDEXNOW_KEY != '' }}
        run: npm run indexnow:submit

      - name: Verify Deployment
        run: |
          echo "🔍 Verifying deployment at https://tinysteps-react-v1.web.app/"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://tinysteps-react-v1.web.app/)
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Deployment verified successfully (HTTP $HTTP_CODE)"
          else
            echo "❌ Deployment verification failed (HTTP $HTTP_CODE)"
            exit 1
          fi
