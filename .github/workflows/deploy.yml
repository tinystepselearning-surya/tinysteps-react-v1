name: CI/CD Deploy to Firebase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Global environment variables
env:
  FIREBASE_PROJECT_ID: tinysteps-react-v1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      VITE_ASK_TINY_STEPS_FIREBASE_API_KEY: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_API_KEY }}
      VITE_ASK_TINY_STEPS_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_AUTH_DOMAIN }}
      VITE_ASK_TINY_STEPS_FIREBASE_PROJECT_ID: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_PROJECT_ID }}
      VITE_ASK_TINY_STEPS_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_STORAGE_BUCKET }}
      VITE_ASK_TINY_STEPS_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_ASK_TINY_STEPS_FIREBASE_APP_ID: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_APP_ID }}
      VITE_ASK_TINY_STEPS_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.VITE_ASK_TINY_STEPS_RECAPTCHA_ENTERPRISE_SITE_KEY }}
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions --include=dev

      - name: Build Cloud Functions
        run: npm --prefix functions run build

      - name: Run Cloud Functions unit tests
        run: npm --prefix functions test

      - name: Run teacher progress enrollment audit classifier tests
        run: npx vitest run scripts/test/teacher-progress-enrollment-audit.spec.mjs

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Firestore rules tests
        run: >-
          npx firebase-tools@latest emulators:exec
          --project ${{ env.FIREBASE_PROJECT_ID }}
          --only firestore
          "FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 npx vitest run src/tests/firestore/publicLeads.rules.spec.ts src/tests/firestore/schoolDomain.rules.spec.ts src/tests/firestore/schoolProgramme.rules.spec.ts src/tests/firestore/teacherIdentity.rules.spec.ts src/tests/firestore/teacherProgressAuthorization.rules.spec.ts src/tests/firestore/childCourseProgress.rules.spec.ts"

      - name: Run website lead deduplication transaction tests
        run: >-
          npx firebase-tools@latest emulators:exec
          --project ${{ env.FIREBASE_PROJECT_ID }}
          --only firestore
          "FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 npx vitest run --config functions/vitest.config.ts functions/test/websiteLeadDeduplication.emulator.spec.ts"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit -- --coverage

      - name: Validate Ask Tiny Steps production build configuration
        run: node scripts/validate-ask-tiny-steps-build-env.mjs

      - name: Build app
        run: npm run build

      - name: Run SEO smoke test
        run: npm run seo:smoke

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json

  deploy-to-firebase:
    # Only run on push to main, after build-and-test succeeds. Keeping staging and
    # production mutations in one job makes the project-level concurrency lock atomic.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-deployment-tinysteps-react-v1
      # Let an active Firebase CLI operation finish; never cancel it mid-deploy.
      cancel-in-progress: false
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      VITE_ASK_TINY_STEPS_FIREBASE_API_KEY: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_API_KEY }}
      VITE_ASK_TINY_STEPS_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_AUTH_DOMAIN }}
      VITE_ASK_TINY_STEPS_FIREBASE_PROJECT_ID: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_PROJECT_ID }}
      VITE_ASK_TINY_STEPS_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_STORAGE_BUCKET }}
      VITE_ASK_TINY_STEPS_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_ASK_TINY_STEPS_FIREBASE_APP_ID: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_APP_ID }}
      VITE_ASK_TINY_STEPS_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.VITE_ASK_TINY_STEPS_RECAPTCHA_ENTERPRISE_SITE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Authenticate to Google Cloud
        id: staging-gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TINYSTEPS_REACT_V1 }}
          create_credentials_file: true

      - name: Refuse stale staging deployment
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --depth=1
          current_main_sha="$(git rev-parse origin/main)"

          echo "Workflow SHA: ${GITHUB_SHA}"
          echo "Current main SHA: ${current_main_sha}"

          if [[ "${GITHUB_SHA}" != "${current_main_sha}" ]]; then
            echo "::error::Refusing to deploy stale commit ${GITHUB_SHA}. Current main is ${current_main_sha}."
            exit 1
          fi

      - name: Validate Ask Tiny Steps staging build configuration
        run: node scripts/validate-ask-tiny-steps-build-env.mjs

      - name: Deploy to Firebase Staging Preview Channel
        run: bash .github/scripts/firebase-hosting-deploy.sh channel staging
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.staging-gcp-auth.outputs.credentials_file_path }}

      - name: Clean stale functions build artifacts
        run: rm -rf functions/lib functions/tsconfig.tsbuildinfo functions/.tsbuildinfo || true

      - name: Install Functions dependencies
        run: npm ci --prefix functions --include=dev

      - name: Build Cloud Functions
        run: npm --prefix functions run build

      - name: Verify deployment commit
        run: |
          echo "📦 Deploying commit:"
          git rev-parse HEAD && git log -1 --oneline

      - name: Verify function deployment metadata
        run: node scripts/verify-function-deployment-metadata.mjs

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TINYSTEPS_REACT_V1 }}
          create_credentials_file: true

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Refuse stale production deployment
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --depth=1
          current_main_sha="$(git rev-parse origin/main)"

          echo "Workflow SHA: ${GITHUB_SHA}"
          echo "Current main SHA: ${current_main_sha}"

          if [[ "${GITHUB_SHA}" != "${current_main_sha}" ]]; then
            echo "::error::Refusing to deploy stale commit ${GITHUB_SHA}. Current main is ${current_main_sha}."
            exit 1
          fi

      - name: Ensure retired Meta WhatsApp and app reminder functions are absent
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail

          retired_functions=(
            askTinySteps
            sendClassReminders15Min
            sendWhatsAppTemplateMessage
            whatsAppWebhook
            whatsappWebhookV2
            onUnmatchedWhatsAppInboundCreateLead
          )

          for function_name in "${retired_functions[@]}"; do
            if gcloud functions describe "${function_name}" \
              --gen2 \
              --project="${FIREBASE_PROJECT_ID}" \
              --region=asia-south1 \
              >/dev/null 2>&1; then
              echo "Deleting retired Cloud Function: ${function_name}"
              npx firebase-tools@latest functions:delete "${function_name}" \
                --region asia-south1 \
                --project "${FIREBASE_PROJECT_ID}" \
                --force
            else
              echo "Retired Cloud Function already absent: ${function_name}"
            fi
          done

      - name: Deploy Cloud Functions
        run: npx firebase-tools@latest deploy --only functions --project ${{ env.FIREBASE_PROJECT_ID }} --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}

      - name: Enforce School callable public transport invocation
        run: >-
          node scripts/ensure-school-callable-public-invocation.mjs
          --project "${{ env.FIREBASE_PROJECT_ID }}"
          --region asia-south1

      - name: Enforce lead attribution callable public transport invocation
        shell: bash
        run: |
          set -euo pipefail
          service_resource="$(gcloud functions describe enrichPublicLeadAttribution \
            --gen2 \
            --project="${{ env.FIREBASE_PROJECT_ID }}" \
            --region=asia-south1 \
            --format='value(serviceConfig.service)')"
          expected_prefix="projects/${{ env.FIREBASE_PROJECT_ID }}/locations/asia-south1/services/"
          if [[ "${service_resource}" != "${expected_prefix}"* ]]; then
            echo "Unexpected Cloud Run service resource for enrichPublicLeadAttribution: ${service_resource:-<empty>}" >&2
            exit 1
          fi
          service_name="${service_resource##*/}"
          if [[ ! "${service_name}" =~ ^[a-z][a-z0-9-]{0,62}$ ]]; then
            echo "Invalid Cloud Run service name for enrichPublicLeadAttribution: ${service_name:-<empty>}" >&2
            exit 1
          fi
          gcloud run services add-iam-policy-binding "${service_name}" \
            --project="${{ env.FIREBASE_PROJECT_ID }}" \
            --region=asia-south1 \
            --member=allUsers \
            --role=roles/run.invoker \
            --condition=None \
            --quiet
          echo "Verified public transport IAM for enrichPublicLeadAttribution (${service_name})"

      - name: Deploy Firestore Security Rules
        run: >-
          npx firebase-tools@latest deploy
          --only firestore:rules
          --project "${{ env.FIREBASE_PROJECT_ID }}"
          --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}

      - name: Verify School callable transport
        run: >-
          node scripts/verify-school-callable-transport.mjs
          --project "${{ env.FIREBASE_PROJECT_ID }}"
          --region asia-south1
          --origin https://tinystepslearning.com
          --report artifacts/school-callable-transport-verification.md

      - name: Upload School callable transport report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-callable-transport-verification-${{ github.sha }}
          path: artifacts/school-callable-transport-verification.md
          if-no-files-found: warn

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Validate Ask Tiny Steps production build configuration
        run: node scripts/validate-ask-tiny-steps-build-env.mjs

      - name: Deploy to Firebase Production
        run: bash .github/scripts/firebase-hosting-deploy.sh live
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}

      - name: Verify live deployment integrity and build identity
        run: >-
          node scripts/verify-live-deployment.mjs
          --origin https://tinystepslearning.com
          --expected-sha "${{ github.sha }}"
          --report artifacts/live-deployment-verification.md

      - name: Upload live deployment verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-deployment-verification-${{ github.sha }}
          path: artifacts/live-deployment-verification.md
          if-no-files-found: warn

      - name: Verify live IndexNow ownership key
        if: ${{ env.INDEXNOW_KEY != '' }}
        run: npm run indexnow:verify

      - name: Submit canonical public URLs to IndexNow
        if: ${{ env.INDEXNOW_KEY != '' }}
        env:
          INDEXNOW_SITEMAP: dist/sitemap.xml
        run: npm run indexnow:submit
