name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      functions_only:
        description: Optional comma-separated Function targets for a surgical main-branch recovery
        required: false
        type: string

concurrency:
  group: firebase-main-pipeline-${{ github.ref }}
  cancel-in-progress: false
# Global environment variables
env:
  FIREBASE_PROJECT_ID: tinysteps-react-v1

jobs:
  analyze-changes:
    runs-on: ubuntu-latest
    outputs:
      functions_deployment_required: ${{ steps.impact.outputs.functions_deployment_required }}
      functions_full_deployment: ${{ steps.impact.outputs.functions_full_deployment }}
      functions_targets: ${{ steps.impact.outputs.functions_targets }}
      hosting_changed: ${{ steps.impact.outputs.hosting_changed }}
      firestore_rules_changed: ${{ steps.impact.outputs.firestore_rules_changed }}
      firestore_indexes_changed: ${{ steps.impact.outputs.firestore_indexes_changed }}
      school_transport_required: ${{ steps.impact.outputs.school_transport_required }}
      avs_transport_required: ${{ steps.impact.outputs.avs_transport_required }}
      lead_iam_required: ${{ steps.impact.outputs.lead_iam_required }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Resolve deployed Functions baseline
        id: functions-baseline
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before || github.sha }}
        run: |
          set -euo pipefail

          baseline="${EVENT_BEFORE}"
          force_full="false"
          source="event-parent"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            if git fetch origin               refs/heads/ci/functions-production:refs/remotes/origin/ci/functions-production               --force --quiet 2>/dev/null; then
              candidate="$(git rev-parse refs/remotes/origin/ci/functions-production)"
              if git merge-base --is-ancestor "${candidate}" "${GITHUB_SHA}"; then
                baseline="${candidate}"
                source="production-marker"
              else
                force_full="true"
                source="invalid-production-marker"
                echo "::warning::Functions production marker is not an ancestor of ${GITHUB_SHA}; forcing a full Functions deployment."
              fi
            else
              force_full="true"
              source="missing-production-marker"
              echo "::warning::Functions production marker is missing; forcing a one-time full Functions deployment."
            fi
          fi

          echo "sha=${baseline}" >> "${GITHUB_OUTPUT}"
          echo "force_full=${force_full}" >> "${GITHUB_OUTPUT}"
          echo "Functions baseline: ${baseline} (${source}); force_full=${force_full}"

      - name: Resolve deployed Hosting and Firestore baselines
        id: artifact-baselines
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before || github.sha }}
        run: |
          set -euo pipefail

          resolve_baseline() {
            local label="$1"
            local marker="$2"
            local prefix="$3"
            local baseline="${EVENT_BEFORE}"
            local force="false"
            local source="event-parent"
            local remote_ref="refs/remotes/origin/${marker}"

            if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
              if git fetch origin "refs/heads/${marker}:${remote_ref}" --force --quiet 2>/dev/null; then
                local candidate
                candidate="$(git rev-parse "${remote_ref}")"
                if git merge-base --is-ancestor "${candidate}" "${GITHUB_SHA}"; then
                  baseline="${candidate}"
                  source="production-marker"
                else
                  force="true"
                  source="invalid-production-marker"
                  echo "::warning::${label} production marker is not an ancestor of ${GITHUB_SHA}; forcing one recovery deployment."
                fi
              else
                force="true"
                source="missing-production-marker"
                echo "::warning::${label} production marker is missing; forcing one recovery deployment."
              fi
            fi

            echo "${prefix}_sha=${baseline}" >> "${GITHUB_OUTPUT}"
            echo "${prefix}_force=${force}" >> "${GITHUB_OUTPUT}"
            echo "${label} baseline: ${baseline} (${source}); force=${force}"
          }

          resolve_baseline "Hosting" "ci/hosting-production" "hosting"
          resolve_baseline "Firestore rules" "ci/firestore-rules-production" "firestore_rules"
          resolve_baseline "Firestore indexes" "ci/firestore-indexes-production" "firestore_indexes"

      - name: Resolve artifact and Function impact
        id: impact
        run: >-
          node scripts/resolve-deployment-impact.mjs
          --before "${{ github.event.before || github.sha }}"
          --functions-before "${{ steps.functions-baseline.outputs.sha }}"
          --force-functions-full "${{ steps.functions-baseline.outputs.force_full }}"
          --hosting-before "${{ steps.artifact-baselines.outputs.hosting_sha }}"
          --force-hosting "${{ steps.artifact-baselines.outputs.hosting_force }}"
          --firestore-rules-before "${{ steps.artifact-baselines.outputs.firestore_rules_sha }}"
          --force-firestore-rules "${{ steps.artifact-baselines.outputs.firestore_rules_force }}"
          --firestore-indexes-before "${{ steps.artifact-baselines.outputs.firestore_indexes_sha }}"
          --force-firestore-indexes "${{ steps.artifact-baselines.outputs.firestore_indexes_force }}"
          --sha "${{ github.sha }}"


  deploy-to-firebase:
    # GitHub Actions is deployment-only. Development validation happens locally on the Mac.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.analyze-changes.outputs.functions_deployment_required == 'true' ||
       needs.analyze-changes.outputs.hosting_changed == 'true' ||
       needs.analyze-changes.outputs.firestore_rules_changed == 'true' ||
       needs.analyze-changes.outputs.firestore_indexes_changed == 'true')
    needs: analyze-changes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: firebase-deployment-tinysteps-react-v1
      # Let an active Firebase CLI operation finish; never cancel it mid-deploy.
      cancel-in-progress: false
    env:
      FUNCTIONS_DEPLOY_ONLY: ${{ needs.analyze-changes.outputs.functions_targets }}
      FUNCTIONS_DEPLOY_FULL: ${{ needs.analyze-changes.outputs.functions_full_deployment }}
      FIREBASE_DEPLOY_CONFIG: .firebase.ci.json
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      VITE_ASK_TINY_STEPS_FIREBASE_API_KEY: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_API_KEY }}
      VITE_ASK_TINY_STEPS_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_AUTH_DOMAIN }}
      VITE_ASK_TINY_STEPS_FIREBASE_PROJECT_ID: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_PROJECT_ID }}
      VITE_ASK_TINY_STEPS_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_STORAGE_BUCKET }}
      VITE_ASK_TINY_STEPS_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_ASK_TINY_STEPS_FIREBASE_APP_ID: ${{ secrets.VITE_ASK_TINY_STEPS_FIREBASE_APP_ID }}
      VITE_ASK_TINY_STEPS_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.VITE_ASK_TINY_STEPS_RECAPTCHA_ENTERPRISE_SITE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install Hosting dependencies
        if: needs.analyze-changes.outputs.hosting_changed == 'true'
        run: npm ci

      - name: Cache Playwright browser for production build
        if: needs.analyze-changes.outputs.hosting_changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium for production build
        if: needs.analyze-changes.outputs.hosting_changed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Validate production build configuration
        if: needs.analyze-changes.outputs.hosting_changed == 'true'
        run: node scripts/validate-ask-tiny-steps-build-env.mjs

      - name: Build production Hosting artifact
        if: needs.analyze-changes.outputs.hosting_changed == 'true'
        run: npm run build:deploy

      - name: Verify production artifact identity
        if: needs.analyze-changes.outputs.hosting_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const info = JSON.parse(fs.readFileSync('dist/build-info.json', 'utf8'));
          if (info.gitSha !== process.env.GITHUB_SHA) {
            throw new Error(`Production Hosting artifact SHA mismatch: expected ${process.env.GITHUB_SHA}, got ${info.gitSha || '<missing>'}`);
          }
          console.log(`Production Hosting artifact matches ${info.gitSha}`);
          NODE

      - name: Prepare prevalidated Firebase deployment config
        if: >-
          needs.analyze-changes.outputs.hosting_changed == 'true' ||
          needs.analyze-changes.outputs.functions_deployment_required == 'true'
        run: node scripts/prepare-firebase-ci-config.mjs --output "${FIREBASE_DEPLOY_CONFIG}"

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TINYSTEPS_REACT_V1 }}
          create_credentials_file: true

      - name: Refuse stale staging deployment
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --depth=1
          current_main_sha="$(git rev-parse origin/main)"

          echo "Workflow SHA: ${GITHUB_SHA}"
          echo "Current main SHA: ${current_main_sha}"

          if [[ "${GITHUB_SHA}" != "${current_main_sha}" ]]; then
            echo "::error::Refusing to deploy stale commit ${GITHUB_SHA}. Current main is ${current_main_sha}."
            exit 1
          fi

      - name: Deploy to Firebase Staging Preview Channel
        if: needs.analyze-changes.outputs.hosting_changed == 'true'
        run: bash .github/scripts/firebase-hosting-deploy.sh channel staging
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}

      - name: Clean stale functions build artifacts
        if: needs.analyze-changes.outputs.functions_deployment_required == 'true'
        run: rm -rf functions/lib functions/tsconfig.tsbuildinfo functions/.tsbuildinfo || true

      - name: Install Functions dependencies
        if: needs.analyze-changes.outputs.functions_deployment_required == 'true'
        run: npm ci --prefix functions --include=dev

      - name: Build Cloud Functions
        if: needs.analyze-changes.outputs.functions_deployment_required == 'true'
        run: npm --prefix functions run build

      - name: Verify deployment commit
        run: |
          echo "📦 Deploying commit:"
          git rev-parse HEAD && git log -1 --oneline

      - name: Verify function deployment metadata
        if: needs.analyze-changes.outputs.functions_deployment_required == 'true'
        run: node scripts/verify-function-deployment-metadata.mjs

      - name: Plan bounded Cloud Functions deployment
        if: needs.analyze-changes.outputs.functions_deployment_required == 'true'
        run: node scripts/deploy-functions-batched.mjs --plan

      - name: Setup Google Cloud CLI
        if: needs.analyze-changes.outputs.functions_deployment_required == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Refuse stale production deployment
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --depth=1
          current_main_sha="$(git rev-parse origin/main)"

          echo "Workflow SHA: ${GITHUB_SHA}"
          echo "Current main SHA: ${current_main_sha}"

          if [[ "${GITHUB_SHA}" != "${current_main_sha}" ]]; then
            echo "::error::Refusing to deploy stale commit ${GITHUB_SHA}. Current main is ${current_main_sha}."
            exit 1
          fi

      - name: Deploy Cloud Functions in bounded batches
        if: needs.analyze-changes.outputs.functions_deployment_required == 'true'
        run: node scripts/deploy-functions-batched.mjs --deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload bounded Functions deployment report
        if: always() && needs.analyze-changes.outputs.functions_deployment_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: functions-deployment-report-${{ github.sha }}
          path: artifacts/functions-deployment-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce School callable public transport invocation
        if: needs.analyze-changes.outputs.school_transport_required == 'true'
        run: >-
          node scripts/ensure-school-callable-public-invocation.mjs
          --project "${{ env.FIREBASE_PROJECT_ID }}"
          --region asia-south1

      - name: Enforce AVS callable public transport invocation
        if: needs.analyze-changes.outputs.avs_transport_required == 'true'
        run: >-
          node scripts/ensure-avs-callable-public-invocation.mjs
          --project "${{ env.FIREBASE_PROJECT_ID }}"
          --region asia-south1

      - name: Enforce lead attribution callable public transport invocation
        if: needs.analyze-changes.outputs.lead_iam_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          service_resource="$(gcloud functions describe enrichPublicLeadAttribution \
            --gen2 \
            --project="${{ env.FIREBASE_PROJECT_ID }}" \
            --region=asia-south1 \
            --format='value(serviceConfig.service)')"
          expected_prefix="projects/${{ env.FIREBASE_PROJECT_ID }}/locations/asia-south1/services/"
          if [[ "${service_resource}" != "${expected_prefix}"* ]]; then
            echo "Unexpected Cloud Run service resource for enrichPublicLeadAttribution: ${service_resource:-<empty>}" >&2
            exit 1
          fi
          service_name="${service_resource##*/}"
          if [[ ! "${service_name}" =~ ^[a-z][a-z0-9-]{0,62}$ ]]; then
            echo "Invalid Cloud Run service name for enrichPublicLeadAttribution: ${service_name:-<empty>}" >&2
            exit 1
          fi
          gcloud run services add-iam-policy-binding "${service_name}" \
            --project="${{ env.FIREBASE_PROJECT_ID }}" \
            --region=asia-south1 \
            --member=allUsers \
            --role=roles/run.invoker \
            --condition=None \
            --quiet
          echo "Verified public transport IAM for enrichPublicLeadAttribution (${service_name})"

      - name: Deploy Firestore Security Rules
        if: needs.analyze-changes.outputs.firestore_rules_changed == 'true'
        run: >-
          npx firebase-tools@15.30.0 deploy
          --only firestore:rules
          --project "${{ env.FIREBASE_PROJECT_ID }}"
          --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}

      - name: Advance Firestore rules production baseline
        if: needs.analyze-changes.outputs.firestore_rules_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/advance-production-marker.sh ci/firestore-rules-production "${GITHUB_SHA}"

      - name: Deploy Firestore Composite Indexes
        if: needs.analyze-changes.outputs.firestore_indexes_changed == 'true'
        run: >-
          npx firebase-tools@15.30.0 deploy
          --only firestore:indexes
          --project "${{ env.FIREBASE_PROJECT_ID }}"
          --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}

      - name: Advance Firestore indexes production baseline
        if: needs.analyze-changes.outputs.firestore_indexes_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/advance-production-marker.sh ci/firestore-indexes-production "${GITHUB_SHA}"

      - name: Verify School callable transport
        if: needs.analyze-changes.outputs.school_transport_required == 'true'
        run: >-
          node scripts/verify-school-callable-transport.mjs
          --project "${{ env.FIREBASE_PROJECT_ID }}"
          --region asia-south1
          --origin https://tinystepslearning.com
          --report artifacts/school-callable-transport-verification.md

      - name: Upload School callable transport report
        if: always() && needs.analyze-changes.outputs.school_transport_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: school-callable-transport-verification-${{ github.sha }}
          path: artifacts/school-callable-transport-verification.md
          if-no-files-found: warn

      - name: Verify AVS callable transport
        if: needs.analyze-changes.outputs.avs_transport_required == 'true'
        run: >-
          node scripts/verify-avs-callable-transport.mjs
          --project "${{ env.FIREBASE_PROJECT_ID }}"
          --region asia-south1
          --origin https://tinystepslearning.com
          --report artifacts/avs-callable-transport-verification.md

      - name: Upload AVS callable transport report
        if: always() && needs.analyze-changes.outputs.avs_transport_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: avs-callable-transport-verification-${{ github.sha }}
          path: artifacts/avs-callable-transport-verification.md
          if-no-files-found: warn

      - name: Advance Functions production baseline
        if: needs.analyze-changes.outputs.functions_deployment_required == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/advance-production-marker.sh ci/functions-production "${GITHUB_SHA}"

      - name: Deploy to Firebase Production
        if: needs.analyze-changes.outputs.hosting_changed == 'true'
        run: bash .github/scripts/firebase-hosting-deploy.sh live
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}

      - name: Verify live deployment integrity and build identity
        if: needs.analyze-changes.outputs.hosting_changed == 'true'
        run: >-
          node scripts/verify-live-deployment.mjs
          --origin https://tinystepslearning.com
          --expected-sha "${{ github.sha }}"
          --report artifacts/live-deployment-verification.md

      - name: Advance Hosting production baseline
        if: needs.analyze-changes.outputs.hosting_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/advance-production-marker.sh ci/hosting-production "${GITHUB_SHA}"

      - name: Upload live deployment verification report
        if: always() && needs.analyze-changes.outputs.hosting_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-deployment-verification-${{ github.sha }}
          path: artifacts/live-deployment-verification.md
          if-no-files-found: warn

      - name: Verify live IndexNow ownership key
        if: needs.analyze-changes.outputs.hosting_changed == 'true' && env.INDEXNOW_KEY != ''
        run: npm run indexnow:verify

      - name: Submit canonical public URLs to IndexNow
        if: needs.analyze-changes.outputs.hosting_changed == 'true' && env.INDEXNOW_KEY != ''
        env:
          INDEXNOW_SITEMAP: dist/sitemap.xml
        run: npm run indexnow:submit

  recover-functions-manually:
    # An empty manual input is deliberately a no-op. Recovery is main-only and
    # shares the production lock so it cannot overlap a normal deployment.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.functions_only != ''
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-deployment-tinysteps-react-v1
      cancel-in-progress: false
    env:
      FUNCTIONS_DEPLOY_ONLY: ${{ inputs.functions_only }}
      FIREBASE_DEPLOY_CONFIG: .firebase.ci.json

    steps:
      - name: Checkout selected main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions --include=dev

      - name: Build Cloud Functions
        run: npm --prefix functions run build

      - name: Prepare prevalidated Firebase deployment config
        run: node scripts/prepare-firebase-ci-config.mjs --output "${FIREBASE_DEPLOY_CONFIG}"

      - name: Verify deployment commit
        run: |
          echo "Deploying surgical recovery from commit:"
          git rev-parse HEAD
          git log -1 --oneline

      - name: Verify function deployment metadata
        run: node scripts/verify-function-deployment-metadata.mjs

      - name: Validate surgical Functions plan (zero mutation)
        run: node scripts/deploy-functions-batched.mjs --plan

      - name: Authenticate to Google Cloud
        id: recovery-gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TINYSTEPS_REACT_V1 }}
          create_credentials_file: true

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy only validated recovery targets
        run: node scripts/deploy-functions-batched.mjs --deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.recovery-gcp-auth.outputs.credentials_file_path }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload surgical Functions deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-recovery-report-${{ github.sha }}
          path: artifacts/functions-deployment-report.json
          if-no-files-found: warn
          retention-days: 7
