name: Validate R5B Auth Access Maintenance

on:
  push:
    branches:
      - wave1/identity-r5b-auth-access-maintenance-20261004

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions --include=dev

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Run focused Functions identity tests
        run: >-
          npx vitest run --config functions/vitest.config.ts
          functions/test/authAccessReadModel.spec.ts
          functions/test/authAccessReadModelMaintenance.spec.ts
          functions/test/authAccessReadModelMaintenanceRouting.spec.ts
          functions/test/authPersonCompatibility.spec.ts
          functions/test/canonicalPrimaryAuthUserCreate.spec.ts
          functions/test/canonicalPrimaryAuthUserUpdate.spec.ts
          functions/test/canonicalPrimaryAuthUserArchive.spec.ts
          functions/test/authUserProjectionBridge.spec.ts
          functions/test/identityLegacySync.spec.ts

      - name: Run authorization regression tests
        run: >-
          npx vitest run
          src/tests/functions/canonicalAuthUserActivationRouting.spec.ts
          src/tests/functions/wave1IdentityAuthorizationHardening.spec.ts

      - name: Run backfill planner tests
        run: node --test scripts/test/wave1-auth-access-read-model-backfill.node-test.mjs

      - name: Verify backfill CLI loads
        run: node scripts/wave1-auth-access-read-model-backfill.mjs --help

      - name: Resolve production deployment impact
        run: node scripts/resolve-deployment-impact.mjs --before origin/main --functions-before origin/main --hosting-before origin/main --firestore-rules-before origin/main --firestore-indexes-before origin/main --sha HEAD
