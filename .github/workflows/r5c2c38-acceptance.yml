name: R5C2C38 Legacy Lifecycle Authorization Acceptance
on:
  push:
    branches:
      - wave1-r5c2c38-legacy-lifecycle-admin
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci --ignore-scripts && npm ci --prefix functions --include=dev
      - name: Focused canonical Admin and business regression
        run: npx vitest run --config functions/vitest.config.ts functions/test/canonicalAdminMilestone2C38Routing.spec.ts functions/test/canonicalAdminGuard.spec.ts functions/test/canonicalAdminLearnerMutationRouting.spec.ts functions/test/rollingScheduleProductionHardening.spec.ts functions/test/rollingScheduleLifecycle.spec.ts functions/test/courseTransition.spec.ts
      - name: Full Functions regression suite
        run: npm --prefix functions test
      - name: Functions TypeScript build
        run: npm --prefix functions run build
      - name: Focused lint
        run: cd functions && npx eslint src/lifecycle.ts src/createSessionsFromSchedule.ts test/canonicalAdminMilestone2C38Routing.spec.ts test/canonicalAdminLearnerMutationRouting.spec.ts
      - name: Exact bounded Function dependency classification
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          baseline="$(git merge-base origin/main HEAD)"
          node scripts/resolve-deployment-impact.mjs --before "$baseline" --functions-before "$baseline" --sha "$GITHUB_SHA" | tee /tmp/impact.txt
          grep -q 'Functions deployment required: true' /tmp/impact.txt
          grep -q 'Functions full deployment: false' /tmp/impact.txt
          grep -q 'Functions impacted: 14' /tmp/impact.txt
          grep -Fq 'functions:createAdminManualSession' /tmp/impact.txt
          grep -Fq 'functions:cancelAdminManualSession' /tmp/impact.txt
          grep -Fq 'functions:reassignEnrollmentTeacher' /tmp/impact.txt
          grep -Fq 'functions:repairEnrollmentTeacherSessionConsistency' /tmp/impact.txt
          grep -Fq 'functions:archiveKid' /tmp/impact.txt
          grep -Fq 'functions:createEnrollment' /tmp/impact.txt
          grep -Fq 'functions:createSessionsFromSchedule' /tmp/impact.txt
          grep -Fq 'functions:pauseEnrollmentUpcomingSessions' /tmp/impact.txt
          grep -Fq 'functions:repairCancelledFutureRegularSessionsForEnrollment' /tmp/impact.txt
          grep -Fq 'functions:repairEnrollmentFutureSessionsFromSchedule' /tmp/impact.txt
          grep -Fq 'functions:resumeEnrollmentSchedule' /tmp/impact.txt
          grep -Fq 'functions:saveEnrollmentScheduleAndGenerateSessions' /tmp/impact.txt
          grep -Fq 'functions:setEnrollmentStatus' /tmp/impact.txt
          grep -Fq 'functions:transitionEnrollmentCourse' /tmp/impact.txt
          grep -q 'Hosting changed: false' /tmp/impact.txt
          grep -q 'Firestore rules changed: false' /tmp/impact.txt
          grep -q 'Firestore indexes changed: false' /tmp/impact.txt
