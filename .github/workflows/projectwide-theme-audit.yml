name: Projectwide Sunrise Theme Audit

on:
  pull_request:
    paths:
      - 'src/index.css'
      - 'src/app/routes.tsx'
      - 'src/pages/**'
      - 'src/components/**'
      - 'scripts/audit-public-text-palette.mjs'
      - 'scripts/test/projectwide-sunrise-theme.node-test.mjs'
      - '.github/workflows/projectwide-theme-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theme-audit:
    name: Protected/public theme scope and text inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test portal scope, contrast and semantic colours
        run: node --test scripts/test/projectwide-sunrise-theme.node-test.mjs
      - name: Audit curated public labels
        run: node scripts/audit-public-text-palette.mjs --strict > public-text-palette-report.json
      - name: Upload full source colour inventory for review
        uses: actions/upload-artifact@v4
        with:
          name: projectwide-text-colour-inventory
          path: public-text-palette-report.json
          retention-days: 14
