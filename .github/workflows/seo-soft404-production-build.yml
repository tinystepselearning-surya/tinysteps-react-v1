name: SEO Soft 404 Production Build Gate

on:
  pull_request:
    paths:
      - 'firebase.json'
      - 'src/lib/publicRouteManifest.js'
      - 'scripts/test/seo-free-games-redirect.node-test.mjs'
      - 'package.json'
      - 'scripts/seo-rendered-html-check.mjs'
      - 'scripts/seo-route-integrity.mjs'
      - 'scripts/soft404-prerender-policy.mjs'
      - 'scripts/test/seo-soft404-prerender.node-test.mjs'
      - 'scripts/test/gsc735-resource-indexability.node-test.mjs'
      - 'scripts/test/gsc735-phase1-commercial-blogs.node-test.mjs'
      - 'scripts/audit-gsc735-58-live-and-build.mjs'
      - 'docs/seo/indexing-recovery-735/**'
      - 'scripts/diagnose-gsc735-phase1-live.mjs'
      - 'scripts/test/gsc735-resource-cache.node-test.mjs'
      - 'scripts/test/gsc735-public-resource-fallback.node-test.mjs'
      - 'scripts/test/gsc735-public-blog-cache.node-test.mjs'
      - 'scripts/test/gsc735-public-blog-chunk-mobile.node-test.mjs'
      - 'scripts/test/gsc735-resource-chunk-mobile.node-test.mjs'
      - 'scripts/lib/gsc735TrackedResources.mjs'
      - 'src/lib/publicResourcePrerenderRecovery.js'
      - 'src/lib/publicResourcePrerenderRecovery.d.ts'
      - 'src/main.tsx'
      - 'src/app/routes.tsx'
      - 'src/lib/phonicsPublicationRegistry.js'
      - 'src/lib/grammarProgrammaticSeoManifest.js'
      - 'src/lib/vocabularyAuthoritySeoManifest.js'
      - 'src/pages/VocabularyHubPage.tsx'
      - 'src/components/resources/PhonicsPilotGuideGrid.tsx'
      - 'src/components/resources/GrammarProgrammaticGuideGrid.tsx'
      - 'src/pages/SubjectResourcesPage.tsx'
      - 'src/content/blog/posts/phonics/online-phonics-classes-vs-school.ts'
      - 'src/tests/seo/gsc735PhonicsComparisonIntent.spec.ts'
      - 'src/pages/grammar.tsx'
      - 'src/pages/speaking.tsx'
      - 'src/pages/public/SpokenEnglishClassesForKidsPage.tsx'
      - 'src/pages/public/WritingClassesForKidsPage.tsx'
      - 'src/tests/seo/commercialC3OwnerPageAudit.spec.ts'
      - 'src/tests/seo/speakingGrowthBrick5.spec.ts'
      - 'src/pages/public/ReadingClassesForKidsPage.tsx'
      - 'src/lib/centralResourceSystem.js'
      - 'src/lib/centralResourceSystem.d.ts'
      - 'src/lib/routeSeoRegistry.js'
      - 'src/tests/seo/resourcesR23CentralResourceReconciliation.spec.ts'
      - '.github/workflows/seo-soft404-production-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-soft404-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-hosting-build:
    name: Production artifact + Soft 404 guards (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Check new Soft 404 guard tests
        run: node --test scripts/test/seo-soft404-prerender.node-test.mjs
      - name: Verify GSC legacy games alias and preserve live child game
        run: node --test scripts/test/seo-free-games-redirect.node-test.mjs
      - name: Verify resource hub taxonomy and canonical-owner preservation
        run: npx vitest run src/tests/seo/resourcesR23CentralResourceReconciliation.spec.ts
      - name: Verify commercial owners and spoken-English learning examples
        run: npx vitest run src/tests/seo/commercialC3OwnerPageAudit.spec.ts src/tests/seo/speakingGrowthBrick5.spec.ts
      - name: Verify GSC #735 parent-comparison editorial quality
        run: npx vitest run src/tests/seo/gsc735PhonicsComparisonIntent.spec.ts
      - name: Verify public prerender chunk recovery guards
        run: node --test scripts/test/gsc735-public-resource-fallback.node-test.mjs
      - name: Check TypeScript source
        run: npm run typecheck
      - name: Build production Hosting artifact and validate prerendered SEO
        run: npm run build:deploy
      - name: Simulate failed public resource chunks in mobile Chromium
        run: node --test scripts/test/gsc735-resource-chunk-mobile.node-test.mjs
      - name: Simulate failed blog chunks in mobile Chromium
        run: node --test scripts/test/gsc735-public-blog-chunk-mobile.node-test.mjs
      - name: Protect clean blog article cache policy
        run: node --test scripts/test/gsc735-public-blog-cache.node-test.mjs
      - name: Verify GSC #735 affected resources from the generated artifact
        run: node --test scripts/test/gsc735-resource-indexability.node-test.mjs
      - name: Verify P1 commercial and parent article HTML from the generated artifact
        run: node --test scripts/test/gsc735-phase1-commercial-blogs.node-test.mjs
      - name: Record live Phase 1 HTTP and cache observations (nonblocking)
        run: node scripts/diagnose-gsc735-phase1-live.mjs
      - name: Guard cache policy on clean resource URLs
        run: node --test scripts/test/gsc735-resource-cache.node-test.mjs
      - name: Audit all 58 GSC URLs against live production and build (nonblocking findings)
        run: node scripts/audit-gsc735-58-live-and-build.mjs
      - name: Upload dated batch audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc735-58-production-build-audit
          path: |
            artifacts/gsc735-58-batch-audit.json
            artifacts/gsc735-58-batch-audit.csv
          if-no-files-found: warn
          retention-days: 30
      - name: No deployment
        run: echo "Validation complete. This workflow cannot publish Firebase Hosting or change production."
