name: C3 Page 9 Speaking Polish

on:
  push:
    branches:
      - seo/c1-parent-commercial-search-universe
    paths:
      - '.github/workflows/c3-page9-speaking-polish.yml'

permissions:
  contents: write

jobs:
  polish-speaking:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/c1-parent-commercial-search-universe
          fetch-depth: 0
      - name: Apply Page 9 speaking polish
        run: python scripts/tmp-c3-page9-speaking-polish.py
      - name: Focused diff check
        run: git diff --check && git diff -- src/pages/speaking.tsx
      - name: Commit Page 9 polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/speaking.tsx
          git commit -m 'C3 page 9: polish speaking owner facts'
          git push origin HEAD:seo/c1-parent-commercial-search-universe
