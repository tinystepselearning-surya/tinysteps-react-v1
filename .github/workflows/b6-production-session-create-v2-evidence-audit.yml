name: B6 production session-create v2 evidence audit

on:
  push:
    branches:
      - audit/b6-production-session-create-v2-evidence
    paths:
      - functions/scripts/b6ProductionSessionCreateEvidenceV2.js
      - functions/src/helpers/teacherEarningsCanonicalAudit.ts
      - functions/src/helpers/teacherEarningsServiceMonthEvidence.ts
      - functions/src/helpers/teacherEarningsSessionCreateFastPath.ts
      - functions/src/helpers/serviceDate.ts
      - .github/workflows/b6-production-session-create-v2-evidence-audit.yml

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: tinysteps-react-v1
  AUDIT_MONTH_KEY: 2026-08
  DEPLOYED_MAIN_SHA: 4381b2593e1fc46817ed8e9f1ec4e283b7a51cd7

jobs:
  read-only-v2-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact audit commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Refuse unexpected branch, project, or base
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/audit/b6-production-session-create-v2-evidence"
          test "${FIREBASE_PROJECT_ID}" = "tinysteps-react-v1"
          git merge-base --is-ancestor "${DEPLOYED_MAIN_SHA}" HEAD
          echo "Audit branch: ${GITHUB_REF_NAME}"
          echo "Audit SHA: ${GITHUB_SHA}"
          echo "Deployed main base: ${DEPLOYED_MAIN_SHA}"
          echo "Production project: ${FIREBASE_PROJECT_ID}"
          echo "Audit month: ${AUDIT_MONTH_KEY}"

      - name: Verify audit runner contains no Firestore mutation APIs
        shell: bash
        run: |
          set -euo pipefail
          runner="functions/scripts/b6ProductionSessionCreateEvidenceV2.js"
          ! grep -E "\.set\(|\.update\(|\.delete\(|\.create\(|\.add\(|batch\.commit\(|runTransaction\(" "${runner}"
          grep -F "db.collection('teacherEarnings').limit(maxDocs + 1).get()" "${runner}"
          grep -F "analyzeTeacherEarningsCanonicalServiceMonthCoverage" "${runner}"
          echo "Read-only source guard passed."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions --include=dev --ignore-scripts

      - name: Build deployed audit helpers
        run: npm --prefix functions run build

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TINYSTEPS_REACT_V1 }}
          create_credentials_file: true

      - name: Run corrected read-only production evidence audit
        run: >-
          node functions/scripts/b6ProductionSessionCreateEvidenceV2.js
          --project=${{ env.FIREBASE_PROJECT_ID }}
          --month=${{ env.AUDIT_MONTH_KEY }}
          --max-docs=10000
          --sample-limit=100
          --output=artifacts/b6-production-session-create-evidence-v2.json
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: b6-production-session-create-evidence-v2-${{ github.sha }}
          path: artifacts/b6-production-session-create-evidence-v2.json
          if-no-files-found: error
          retention-days: 7
