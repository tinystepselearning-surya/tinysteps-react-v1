name: Parent Worksheet Read Regression

on:
  pull_request:
    paths:
      - 'functions/src/getParentWorksheetResources.ts'
      - 'functions/src/helpers/parentWorksheetBundle.ts'
      - 'functions/src/parentWorksheetBundleTrigger.ts'
      - 'functions/src/index.ts'
      - 'src/lib/parentWorksheetBundle.ts'
      - 'src/pages/admin/ParentWorksheetLibraryManagement.tsx'
      - 'src/pages/parent/components/classes/ParentWorksheetLibrary.tsx'
      - 'src/tests/pages/parent/ParentWorksheetLibrary.spec.tsx'
      - 'src/tests/lib/parentWorksheetBundle.spec.ts'
      - 'firestore.rules'
      - 'functions/test/getParentWorksheetResources.spec.ts'
      - 'functions/test/identityShadowCanary.spec.ts'
      - 'src/pages/parent/ParentDashboard.tsx'
      - '.github/workflows/parent-worksheet-read-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parent-worksheet:
    name: Backend worksheet authorization and read regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts && npm ci --prefix functions --include=dev --ignore-scripts
      - name: Compile backend
        run: npm --prefix functions run build
      - name: Focused worksheet and identity regressions
        run: |
          npx vitest run --config functions/vitest.config.ts \
            functions/test/getParentWorksheetResources.spec.ts \
            functions/test/parentWorksheetBundle.spec.ts \
            functions/test/identityShadowCanary.spec.ts
          npx vitest run src/tests/functions/wave1IdentityAuthorizationHardening.spec.ts src/tests/pages/parent/ParentWorksheetLibrary.spec.tsx src/tests/lib/parentWorksheetBundle.spec.ts
      - name: Frontend TypeScript check
        run: npm run typecheck
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Isolated parent worksheet Firestore rules test
        env:
          CI: 'true'
          GCLOUD_PROJECT: demo-tinysteps-parent-worksheets
          GOOGLE_CLOUD_PROJECT: demo-tinysteps-parent-worksheets
          FIREBASE_CLI_DISABLE_TELEMETRY: 'true'
        run: |
          set -euo pipefail
          test "$GCLOUD_PROJECT" = demo-tinysteps-parent-worksheets
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${FIREBASE_TOKEN:-}"
          npx --yes firebase-tools@latest emulators:exec \
            --project demo-tinysteps-parent-worksheets \
            --only firestore \
            'FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 npx vitest run src/tests/firestore/parentWorksheets.rules.spec.ts'
      - name: Full backend regression suite
        run: npm --prefix functions test
      - name: Backend lint
        run: npm --prefix functions run lint
