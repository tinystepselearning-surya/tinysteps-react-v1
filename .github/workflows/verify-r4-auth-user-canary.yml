name: Verify R4 Auth User Production Canary

on:
  push:
    branches:
      - wave1/identity-r4-auth-writer-production-evidence-20261004

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to production
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TINYSTEPS_REACT_V1 }}
          create_credentials_file: true

      - name: Diagnose canary identity presence
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}
          GOOGLE_CLOUD_PROJECT: tinysteps-react-v1
        run: node scripts/diagnose-auth-user-canary.mjs

      - name: Verify suspended Parent canary
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}
          GOOGLE_CLOUD_PROJECT: tinysteps-react-v1
        run: >-
          node scripts/verify-auth-user-canonical-canary.mjs
          --project tinysteps-react-v1
          --email r4-auth-canary-20261004@example.com
          --role parent
