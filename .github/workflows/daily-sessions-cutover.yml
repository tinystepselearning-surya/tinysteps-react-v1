name: Daily Sessions Cutover Verification
on:
  pull_request:
    paths:
      - 'functions/src/scheduling/dailySessionGenerator.ts'
      - 'functions/scripts/resetFutureSessionsOctober12.cjs'
      - 'functions/src/scheduling/nextDaySessionPlan.ts'
      - 'functions/src/index.ts'
      - 'functions/test/nextDaySessionPlan.spec.ts'
      - 'src/pages/admin/TodaysNotifications.tsx'
      - 'src/pages/admin/todaysNotificationsManualData.ts'
      - 'src/tests/pages/TodaysNotificationsSnapshot.spec.ts'
      - '.github/workflows/daily-sessions-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-daily-sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Install dependencies (no deploy)
        run: npm ci --ignore-scripts && npm ci --prefix functions --include=dev --ignore-scripts
      - name: Verify one-time reset script syntax (no execution)
        run: node --check functions/scripts/resetFutureSessionsOctober12.cjs
      - name: Build functions
        run: npm --prefix functions run build
      - name: Planner and admin regression tests
        run: |
          npx vitest run --config functions/vitest.config.ts functions/test/nextDaySessionPlan.spec.ts
          npx vitest run src/tests/pages/TodaysNotificationsSnapshot.spec.ts src/tests/pages/TodaysNotifications.spec.tsx
      - name: Verify client TypeScript
        run: npm run typecheck
      - name: No production deployment
        run: echo "Code tests only. No Cloud Functions, Firestore or Hosting writes."
