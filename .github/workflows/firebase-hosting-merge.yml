name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Vite env file
        run: echo "VITE_APPCHECK_KEY=${{ secrets.VITE_APPCHECK_KEY }}" > app/.env.production
      - name: Install and build app
        run: |
          npm -C app ci
          npm -C app run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TINYSTEPS_REACT_V1 }}
          channelId: live
          projectId: tinysteps-react-v1
          entryPoint: ./app
