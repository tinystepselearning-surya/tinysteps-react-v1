name: Validate Architecture Test Contract Fixes

on:
  push:
    branches:
      - wave1/identity-r4-auth-writer-activation-20261004

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run corrected architecture tests
        run: >-
          npx vitest run
          src/tests/functions/teacherEarningAdjustmentLedgerRouting.spec.ts
          src/tests/functions/teacherPayWithholdingLedgerRouting.spec.ts
          src/tests/functions/wave1IdentityAuthorizationHardening.spec.ts
