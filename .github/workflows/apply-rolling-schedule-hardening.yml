name: Apply rolling schedule production hardening

on:
  push:
    branches:
      - fix/rolling-schedule-materialization-repair
    paths:
      - .github/workflows/apply-rolling-schedule-hardening.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/rolling-schedule-materialization-repair
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Apply targeted backend patches
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const replaceOnce = (source, before, after, label) => {
            const index = source.indexOf(before);
            if (index < 0) throw new Error(`Patch anchor not found: ${label}`);
            if (source.indexOf(before, index + before.length) >= 0) {
              throw new Error(`Patch anchor is not unique: ${label}`);
            }
            return source.slice(0, index) + after + source.slice(index + before.length);
          };

          {
            const file = 'functions/src/index.ts';
            let source = fs.readFileSync(file, 'utf8');
            source = replaceOnce(
              source,
              'export { reconcileRollingEnrollmentSchedule } from "./scheduling/rollingScheduleReconciliation";\n',
              'export { reconcileRollingEnrollmentSchedule } from "./scheduling/rollingScheduleReconciliation";\nexport { adminRepairRollingScheduleMaterialization } from "./scheduling/rollingScheduleRepair";\n',
              'repair callable export',
            );
            fs.writeFileSync(file, source);
          }

          {
            const file = 'functions/src/sessionsManagementSnapshot.ts';
            let source = fs.readFileSync(file, 'utf8');
            source = replaceOnce(
              source,
              "const SCHEMA_VERSION = 1;\nconst SESSION_LIMIT_PER_DATE = 200;",
              "const SCHEMA_VERSION = 1;\nconst SNAPSHOT_HORIZON_DAYS = 14;\nconst SESSION_LIMIT_PER_DATE = 200;",
              'snapshot horizon constant',
            );
            source = replaceOnce(
              source,
              "  // A hidden third bucket keeps Today/Tomorrow correct between midnight and the next 04:00 refresh.\n  const dateKeys = [baseDateKey, shiftDateKey(baseDateKey, 1), shiftDateKey(baseDateKey, 2)];",
              "  // Publish the same authoritative today-through-14-days horizon used by the rolling\n  // materializer and parent upcoming-session policy. No client-side recurrence or live\n  // Tomorrow/Date read is required for this operational window.\n  const dateKeys = Array.from({ length: SNAPSHOT_HORIZON_DAYS + 1 }, (_, index) =>\n    shiftDateKey(baseDateKey, index),\n  );",
              'snapshot date horizon',
            );
            source = replaceOnce(
              source,
              "  const sessions = sessionSnapshots.flatMap((snap) => snap.docs.map(rowFromSnapshot));\n",
              "  const saturatedDateIndex = sessionSnapshots.findIndex(\n    (snap) => snap.size >= SESSION_LIMIT_PER_DATE,\n  );\n  if (saturatedDateIndex >= 0) {\n    throw new Error(\n      `Sessions Management session snapshot reached safety limit for ${dateKeys[saturatedDateIndex]}; refusing to publish a potentially truncated snapshot.`,\n    );\n  }\n\n  const sessions = sessionSnapshots.flatMap((snap) => snap.docs.map(rowFromSnapshot));\n",
              'snapshot truncation guard',
            );
            fs.writeFileSync(file, source);
          }
          NODE

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions --include=dev

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Run rolling schedule Functions tests
        run: >-
          npm --prefix functions test -- --run
          test/rollingScheduleMaterializer.spec.ts
          test/rollingScheduleEdgeWorker.spec.ts
          test/rollingScheduleRepair.spec.ts
          test/sessionsManagementSnapshotRollingHorizon.spec.ts
          test/rollingScheduleProductionHardening.spec.ts

      - name: Run admin and parent snapshot tests
        run: >-
          npx vitest run
          src/tests/pages/TodaysNotificationsSnapshot.spec.ts
          src/tests/pages/ParentDashboardClassSessionReadPlan.spec.ts
          src/tests/scheduling/RollingScheduleRuntimeParity.spec.ts

      - name: Lint changed Functions files
        run: >-
          npm --prefix functions exec eslint --
          src/scheduling/rollingScheduleRepair.ts
          src/sessionsManagementSnapshot.ts
          src/index.ts
          test/rollingScheduleRepair.spec.ts
          test/sessionsManagementSnapshotRollingHorizon.spec.ts

      - name: Commit validated patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-rolling-schedule-hardening.yml
          git add functions/src/index.ts functions/src/sessionsManagementSnapshot.ts
          git diff --cached --check
          git commit -m "fix: harden rolling schedule materialization recovery"
          git push origin HEAD:fix/rolling-schedule-materialization-repair
