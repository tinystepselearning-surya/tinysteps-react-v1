name: Resources R20 Speaking Communication Architecture

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/speakingCommunicationKnowledgeArchitecture.*'
      - 'src/tests/seo/resourcesR20*'
      - 'scripts/audit-resources-r20-speaking-communication-architecture.mjs'
      - 'docs/seo/resources-architecture/R20_*'
      - '.github/workflows/resources-r20-speaking-communication-architecture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resources-r20-speaking-communication-architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for prerender
        run: npx playwright install --with-deps chromium
      - name: Run R0-R20 Resources and canonical curriculum regression tests
        run: npx vitest run src/tests/seo/resourcesR src/content/phonicsCurriculum
      - name: Audit R20 speaking and communication architecture
        run: node scripts/audit-resources-r20-speaking-communication-architecture.mjs --r21-executed --report
      - name: Audit R19 grammar and writing semantic journeys
        run: node scripts/audit-resources-r19-grammar-writing-semantic-journeys.mjs --report
      - name: Audit R16 reading semantic journeys
        run: node scripts/audit-resources-r16-reading-semantic-journeys.mjs --report
      - name: Audit semantic internal links
        run: node scripts/audit-semantic-internal-links.mjs
      - name: Audit canonical topic ownership
        run: node scripts/audit-canonical-topic-ownership.mjs
      - name: Run structural Resources safety audit
        run: node scripts/audit-resources-r0.mjs
      - name: Check shadowing
        run: node scripts/check-shadowing.mjs
      - name: Run type check
        run: npm run typecheck
      - name: Build and prerender public site
        run: npm run build
      - name: Verify rendered R20 architecture boundaries
        run: node scripts/audit-resources-r20-speaking-communication-architecture.mjs --r21-executed --dist --report
      - name: Verify rendered R19 journeys
        run: node scripts/audit-resources-r19-grammar-writing-semantic-journeys.mjs --dist --report
      - name: Verify rendered R16 journeys
        run: node scripts/audit-resources-r16-reading-semantic-journeys.mjs --dist --report
      - name: Run rendered Resources safety audit
        run: node scripts/audit-resources-r0-rendered.mjs --strict
      - name: Run SEO smoke
        run: npm run seo:smoke
      - name: Upload R20 audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resources-r20-speaking-communication-architecture
          path: artifacts/resources-r20-speaking-communication-architecture.json
          if-no-files-found: warn
