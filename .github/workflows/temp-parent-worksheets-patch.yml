name: Temporary parent worksheets branch patch

on:
  push:
    branches:
      - feature/parent-worksheets-library

permissions:
  contents: write

jobs:
  apply-parent-worksheets-wiring:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/parent-worksheets-library
          fetch-depth: 0

      - name: Wire Worksheets into ParentDashboard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/pages/parent/ParentDashboard.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              if old not in text:
                  raise SystemExit(f'Could not find expected ParentDashboard fragment: {label}')
              text = text.replace(old, new, 1)

          replace_once(
              '  ExternalLink,\n  Gamepad2,',
              '  ExternalLink,\n  FileSpreadsheet,\n  Gamepad2,',
              'FileSpreadsheet icon import',
          )

          replace_once(
              '  { id: "skills", label: "Skills", icon: Sparkles },\n  { id: "classes", label: "Classes", icon: CalendarDays },',
              '  { id: "skills", label: "Skills", icon: Sparkles },\n  { id: "worksheets", label: "Worksheets", icon: FileSpreadsheet },\n  { id: "classes", label: "Classes", icon: CalendarDays },',
              'desktop parent navigation',
          )

          replace_once(
              '    "skills",\n    "classes",',
              '    "skills",\n    "worksheets",\n    "classes",',
              'safe tab list',
          )

          worksheet_resource = '''    {
              id: "worksheets" as const,
              label: "Worksheets",
              description: "Practice resources shared by Tiny Steps.",
              count: parentWorksheetsQuery.isLoading ? null : visibleParentWorksheets.length,
            },
'''
          if worksheet_resource in text:
              text = text.replace(worksheet_resource, '', 1)

          marker = '        {/* Classes tab: canonical sessions bucketed for parent review */}'
          worksheet_tab = '''        {/* Worksheets tab: parent-friendly lesson practice library */}
        {activeTab === "worksheets" && (
          <div className="space-y-3 sm:space-y-4">
            <ParentWorksheetLibrary
              items={visibleParentWorksheets}
              loading={parentWorksheetsQuery.isLoading}
              refreshing={parentWorksheetsQuery.isFetching}
              onRefresh={() => void parentWorksheetsQuery.refetch()}
            />
          </div>
        )}

'''
          if marker not in text:
              raise SystemExit('Could not find Classes tab marker')
          text = text.replace(marker, worksheet_tab + marker, 1)

          path.write_text(text)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run parent worksheet tests
        run: npx vitest run src/tests/lib/parentWorksheets.spec.ts src/tests/pages/parent/ParentDashboardVisualContracts.spec.ts

      - name: Commit ParentDashboard wiring
        shell: bash
        run: |
          if git diff --quiet -- src/pages/parent/ParentDashboard.tsx; then
            echo "No ParentDashboard changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/parent/ParentDashboard.tsx
          git commit -m "feat(parent): add standalone worksheets tab"
          git push origin HEAD:feature/parent-worksheets-library
