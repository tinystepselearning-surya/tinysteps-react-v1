name: Temporary parent worksheets branch patch

on:
  push:
    branches: [feature/parent-worksheets-library]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-parent-worksheets-wiring:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/parent-worksheets-library
          fetch-depth: 0

      - name: Wire standalone Worksheets tab
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/pages/parent/ParentDashboard.tsx')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Missing expected fragment: {label}')
              text = text.replace(old, new, 1)

          replace_once('  ExternalLink,\n  Gamepad2,', '  ExternalLink,\n  FileSpreadsheet,\n  Gamepad2,', 'icon import')
          replace_once(
              '  { id: "skills", label: "Skills", icon: Sparkles },\n  { id: "classes", label: "Classes", icon: CalendarDays },',
              '  { id: "skills", label: "Skills", icon: Sparkles },\n  { id: "worksheets", label: "Worksheets", icon: FileSpreadsheet },\n  { id: "classes", label: "Classes", icon: CalendarDays },',
              'parent navigation',
          )
          replace_once('    "skills",\n    "classes",', '    "skills",\n    "worksheets",\n    "classes",', 'safe tabs')
          replace_once(
              '    activeTab === "skills" ||\n    activeTab === "classes" ||',
              '    activeTab === "skills" ||\n    activeTab === "worksheets" ||\n    activeTab === "classes" ||',
              'enrollment loading gate',
          )
          replace_once(
              '    enabled: !!user?.uid && !!selectedKidId && activeTab === "classes",\n    staleTime: 5 * 60 * 1000,',
              '    enabled: !!user?.uid && !!selectedKidId && activeTab === "worksheets",\n    staleTime: 5 * 60 * 1000,',
              'worksheet query gate',
          )

          old_resource = '''    {
              id: "worksheets" as const,
              label: "Worksheets",
              description: "Practice resources shared by Tiny Steps.",
              count: parentWorksheetsQuery.isLoading ? null : visibleParentWorksheets.length,
            },
'''
          if old_resource not in text:
              raise SystemExit('Missing old Classes worksheet resource')
          text = text.replace(old_resource, '', 1)
          text = text.replace('    parentWorksheetsQuery.isLoading,\n    visibleParentWorksheets.length,\n', '', 1)

          marker = '        {/* Classes tab: canonical sessions bucketed for parent review */}'
          worksheet_tab = '''        {/* Worksheets tab: parent-friendly lesson practice library */}
        {activeTab === "worksheets" && (
          <div className="space-y-3 sm:space-y-4">
            <ParentWorksheetLibrary
              items={visibleParentWorksheets}
              loading={parentWorksheetsQuery.isLoading}
              refreshing={parentWorksheetsQuery.isFetching}
              onRefresh={() => void parentWorksheetsQuery.refetch()}
            />
          </div>
        )}

'''
          if marker not in text:
              raise SystemExit('Missing Classes tab marker')
          text = text.replace(marker, worksheet_tab + marker, 1)

          old_resource_content = '''              resourceContent={classesView === "worksheets" ? (
              <ParentWorksheetLibrary
                items={visibleParentWorksheets}
                loading={parentWorksheetsQuery.isLoading}
                refreshing={parentWorksheetsQuery.isFetching}
                onRefresh={() => void parentWorksheetsQuery.refetch()}
              />
            ) : classesView === "calendar" ? (
'''
          if old_resource_content not in text:
              raise SystemExit('Missing old Classes worksheet content')
          text = text.replace(old_resource_content, '              resourceContent={classesView === "calendar" ? (\n', 1)

          path.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run src/tests/lib/parentWorksheets.spec.ts src/tests/pages/parent/ParentDashboardVisualContracts.spec.ts

      - name: Commit ParentDashboard wiring
        shell: bash
        run: |
          if git diff --quiet -- src/pages/parent/ParentDashboard.tsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/parent/ParentDashboard.tsx
          git commit -m "feat(parent): add standalone worksheets tab"
          git push origin HEAD:feature/parent-worksheets-library
