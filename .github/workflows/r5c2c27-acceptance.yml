name: R5C2C27 Scheduling Repair Acceptance

on:
  push:
    branches:
      - wave1-r5c2c27-scheduling-repair-canonical-admin
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Install test and Functions dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix functions --include=dev
      - name: Focused R5C2C27 regressions
        run: npx vitest run --config functions/vitest.config.ts functions/test/canonicalAdminRollingScheduleRepairRouting.spec.ts functions/test/rollingScheduleRepair.spec.ts
      - name: Full Functions unit estate
        run: npm --prefix functions test
      - name: Functions build
        run: npm --prefix functions run build
      - name: Focused lint
        run: cd functions && npx eslint src/scheduling/rollingScheduleRepair.ts
      - name: Verify exact source diff and no other deployment targets
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          node scripts/resolve-deployment-impact.mjs --before "$(git rev-parse origin/main)" --functions-before "$(git rev-parse origin/main)" --sha "$GITHUB_SHA" > /tmp/r5c2c27-impact.txt
          cat /tmp/r5c2c27-impact.txt
          grep -q 'adminRepairRollingScheduleMaterialization' /tmp/r5c2c27-impact.txt
          git diff --name-only origin/main...HEAD > /tmp/r5c2c27-files.txt
          grep -q '^functions/src/scheduling/rollingScheduleRepair.ts$' /tmp/r5c2c27-files.txt
          if grep -E '^(firestore.rules|firestore.indexes.json|src/|public/)' /tmp/r5c2c27-files.txt; then
            echo 'Unexpected hosting or Firestore scope' >&2
            exit 1
          fi
