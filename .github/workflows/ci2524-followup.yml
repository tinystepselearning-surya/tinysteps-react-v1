name: CI2524 verified follow-up
on:
  push:
    branches: [work/ci2524-verified-followup]
    paths: [.github/workflows/ci2524-followup.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/work/ci2524-verified-followup'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      repair_sha: ${{ steps.commit.outputs.repair_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
      - name: Apply verified follow-up corrections
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const BASE = '9bb579ac8729e2f474b02c6586255eddc246c7fe';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          assert.equal(process.env.GITHUB_REF, 'refs/heads/work/ci2524-verified-followup');
          assert.deepEqual(git('diff', '--name-only', BASE, 'HEAD').split('\n'), ['.github/workflows/ci2524-followup.yml']);
          const read = (file) => fs.readFileSync(file, 'utf8');
          const changed = new Set();
          const swap = (text, before, after) => {
            assert(text.includes(before), `Missing reviewed literal: ${before}`);
            return text.split(before).join(after);
          };
          const edit = (file, fn) => {
            const before = read(file);
            const after = fn(before);
            assert.notEqual(after, before, `No correction made: ${file}`);
            fs.writeFileSync(file, after);
            changed.add(file);
          };
          const SEO = 'src/tests/seo/';
          edit(SEO + 'blogBaselineAudit.spec.ts', (text) => {
            let next = text;
            for (const [before, after] of [
              ['"publishedPosts": 84', '"publishedPosts": 83'],
              ['"indexableByPageRobots": 84', '"indexableByPageRobots": 83'],
              ['"expectedGeneratedSitemapPosts": 83', '"expectedGeneratedSitemapPosts": 82'],
              ['"committedSitemapBlogUrls": 83', '"committedSitemapBlogUrls": 82'],
              ['"retiredRedirectSources": 12', '"retiredRedirectSources": 13'],
            ]) next = swap(next, before, after);
            return swap(next,
              '    expect(output).toContain(\'"unexpectedCommittedSitemapSlugs": []\');',
              '    expect(output).toContain(\'"unexpectedCommittedSitemapSlugs": []\');\n    expect(output).toContain(\'"retiredSlugsInCommittedSitemap": []\');');
          });
          edit(SEO + 'blogIndexUx.spec.ts', (text) => swap(text, '84 published articles', '83 published articles'));
          edit(SEO + 'blogQualityAuthoritativeSequenceBlog19.spec.ts', (text) => {
            let next = swap(text, 'When should a child move beyond SATPIN?', 'What comes after SATPIN?');
            next = swap(next, 'Blog #22, [SATPIN at Home:', '[SATPIN at Home:');
            return next;
          });
          edit(SEO + 'blogQualityParentCommunication50.spec.ts', (text) => {
            let next = swap(text,
              'Sound recall \u2192 Oral blend \u2192 Printed blend \u2192 Fresh-word transfer \u2192 Connected-text transfer',
              'Sound recall \u2192 Oral blend \u2192 Printed blend \u2192 CVC decoding \u2192 Fresh-word transfer \u2192 Connected-text transfer');
            next = swap(next, "    expect(body).toContain('Stage 4 \u2014 Fresh-word transfer');",
              "    expect(body).toContain('Stage 4 \u2014 CVC decoding');\n    expect(body).toContain('Stage 5 \u2014 Fresh-word transfer');");
            next = swap(next, 'Stage 5 \u2014 Connected-text transfer', 'Stage 6 \u2014 Connected-text transfer');
            return swap(next, 'A practical home routine: known sounds, easy words, one fresh transfer',
              'A practical home routine: known sounds, CVC words, one fresh transfer');
          });
          edit('src/content/blog/shared/editorialCleanup.ts', (text) => swap(text,
            "    .replace(/\\bchoose\\s+the\\s+right\\s+owner\\b/gi, 'choose the right guide');",
            "    .replace(/\\bThis\\s+(page|guide)\\s+owns\\b/gi, 'This $1 covers')\n    .replace(/\\bchoose\\s+the\\s+right\\s+owner\\b/gi, 'choose the right guide');"));
          edit(SEO + 'blogEditorialCleanup.spec.ts', (text) => swap(text,
            "  it('turns multiple exposed internal routes into readable links instead of dropping destinations', () => {",
            "  it('cleans plain ownership wording without losing the topic or its links', () => {\n    expect(cleanBlogText('This page owns ordinary two-way conversation skills. Read [the guide](/blog/conversation-skills-for-kids).'))\n      .toBe('This page covers ordinary two-way conversation skills. Read [the guide](/blog/conversation-skills-for-kids).');\n    expect(cleanBlogText('This guide owns the broad grammar roadmap.'))\n      .toBe('This guide covers the broad grammar roadmap.');\n  });\n\n  it('keeps ownership cleanup idempotent and preserves ordinary ownership statements', () => {\n    const cleaned = cleanBlogText('This page owns ordinary two-way conversation skills.');\n    expect(cleanBlogText(cleaned)).toBe(cleaned);\n    expect(cleanBlogText('The child owns a storybook.')).toBe('The child owns a storybook.');\n  });\n\n  it('turns multiple exposed internal routes into readable links instead of dropping destinations', () => {"));
          // Only migrate literal public-body assertions for the exact newly handled wording.
          // Cleaner-input tests and all evidence / pedagogical assertions remain unchanged.
          for (const name of fs.readdirSync(SEO).filter((name) => /^blogQuality.*\.spec\.ts$/.test(name))) {
            const file = SEO + name;
            const before = read(file);
            const after = before.replace(/expect\(body\)\.toContain\('This (page|guide) owns /g,
              "expect(body).toContain('This $1 covers ");
            if (after !== before) {
              fs.writeFileSync(file, after);
              changed.add(file);
              console.log('READER_FACING_ASSERTION_MIGRATION ' + file);
            }
          }
          edit('src/pages/public/BestOnlinePhonicsClassesIndiaPage.tsx', (text) => {
            const retiredLink = /<Link\s+to="\/blog\/how-to-choose-phonics-classes"([\s\S]*?)<\/Link>/g;
            assert.equal([...text.matchAll(retiredLink)].length, 1);
            assert(text.includes('<Section id="provider-scorecard">'));
            let next = text.replace(retiredLink, (_match, propertiesAndText) =>
              '<a href="#provider-scorecard"' + propertiesAndText.replace('How to Choose a Phonics Class', 'Review the parent comparison scorecard') + '</a>');
            next = swap(next, 'Use the full parent comparison framework', 'Review the parent comparison scorecard');
            return swap(next,
              'For a deeper editorial checklist covering placement, teaching sequence, decodable reading, transfer evidence, teacher training, progress reporting, pricing clarity, and red flags, read our complete parent guide.',
              'Use the scorecard above to compare placement, teaching sequence, decodable reading, transfer evidence, teacher training, progress reporting, pricing clarity, and red flags on the same basis.');
          });
          edit(SEO + 'blogQualityAuthoritativeSequenceBlog10.spec.ts', (text) => swap(text,
            "    expect(comparison).not.toContain('/blog/how-to-choose-phonics-classes');",
            "    expect(comparison).not.toContain('/blog/how-to-choose-phonics-classes');\n    expect(comparison).toContain('href=\"#provider-scorecard\"');\n    expect(comparison).toContain('<Section id=\"provider-scorecard\">');"));
          edit('public/sitemap-blog.xml', (text) => {
            const entries = [...text.matchAll(/^[ \t]*<url>[\s\S]*?<\/url>\r?\n?/gm)];
            const retired = entries.filter((match) => match[0].includes('<loc>https://tinystepslearning.com/blog/how-to-choose-phonics-classes</loc>'));
            assert.equal(entries.length, 83);
            assert.equal(retired.length, 1);
            const next = text.replace(retired[0][0], '');
            assert.equal((next.match(/<url>/g) ?? []).length, 82);
            return next;
          });
          const sourceAllowlist = new Set([
            'src/content/blog/shared/editorialCleanup.ts',
            'src/pages/public/BestOnlinePhonicsClassesIndiaPage.tsx',
            'public/sitemap-blog.xml',
          ]);
          for (const file of changed) assert(file.startsWith(SEO) || sourceAllowlist.has(file), `Out-of-scope correction: ${file}`);
          console.log('FOLLOWUP_FILES=' + changed.size);
          console.log([...changed].sort().join('\n'));
          console.log(git('diff', '--stat'));
          NODE
          git diff --check
      - name: Commit verified scope to the working branch only
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add src/tests/seo src/content/blog/shared/editorialCleanup.ts src/pages/public/BestOnlinePhonicsClassesIndiaPage.tsx public/sitemap-blog.xml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: remove retired discovery leftovers and reconcile remaining recovery assertions'
          git push origin HEAD:refs/heads/work/ci2524-verified-followup
          echo "repair_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  unit-tests:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.repair_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions --include=dev
      - run: npm --prefix functions run build
      - name: Full unchanged unit coverage gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci2524
          npm run test:unit -- --coverage 2>&1 | tee artifacts/ci2524/unit-tests.log
      - name: Preserve validation output and exact repair diff
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/ci2524
          git show --format=fuller --stat HEAD > artifacts/ci2524/repair-commit.txt
          cp src/content/blog/shared/editorialCleanup.ts artifacts/ci2524/editorialCleanup.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci2524-followup-unit-validation
          path: artifacts/ci2524/
          retention-days: 7
  static-and-seo:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.repair_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Discovery and recovery audits
        if: ${{ !cancelled() }}
        run: |
          npm run gen:sitemaps
          npm run generate:rss
          npm run seo:blog-consolidation
          npm run seo:recovery-brick11
