name: One-off Wave 1 Identity Expand Validation

on:
  push:
    branches:
      - wave1/identity-foundation-expand

permissions:
  contents: read

jobs:
  identity-expand:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Wave 1 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Build Functions contracts
        run: npm --prefix functions run build

      - name: Run Wave 1 identity foundation tests
        run: node --test scripts/test/wave1-identity-foundation.node-test.mjs

      - name: Authenticate read-only production audit
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TINYSTEPS_REACT_V1 }}
          create_credentials_file: true

      - name: Run read-only identity foundation dry run
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcp-auth.outputs.credentials_file_path }}
        run: node scripts/wave1-identity-foundation-dry-run.mjs

      - name: Upload dry-run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave1-identity-foundation-dry-run-${{ github.sha }}
          path: reports/wave1-identity-foundation-dry-run.json
          if-no-files-found: error
          retention-days: 1
