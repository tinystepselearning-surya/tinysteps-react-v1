<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Tiny Steps</title>
  <style>
    body { font-family: sans-serif; background: #f6f9ff; color: #1f2937; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 420px; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 12px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You’re offline</h1>
    <p>Playing locally — your progress will sync when you’re back online.</p>
    <p>Offline caching for interactive learning materials has been removed in this build.</p>
  </div>
</body>
</html>
