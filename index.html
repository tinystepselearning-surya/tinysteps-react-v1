<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <meta
      name="googlebot"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <meta
      name="bingbot"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <meta name="author" content="Tiny Steps Online School" />
    <meta http-equiv="content-language" content="en-IN" />
    <link rel="canonical" href="https://tinystepslearning.com/" />

    <!-- DNS prefetch for third-party services -->
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html { background: #ffffff; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top, #fdf4ff 0%, #f4f8ff 45%, #ffffff 80%);
        color: #0f172a;
        font-family: "Fredoka", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-rendering: optimizeLegibility;
      }
      #root { min-height: 100vh; }
      [data-site-header] {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 15px 35px rgba(8, 15, 40, 0.12);
        backdrop-filter: blur(18px);
      }
      [data-home-hero] {
        position: relative;
        min-height: 82vh;
        overflow: hidden;
        padding: 1.5rem 1rem 2.5rem;
      }
      [data-home-hero-grid] {
        position: relative;
        z-index: 10;
        display: grid;
        gap: 2rem;
        max-width: 80rem;
        margin: 0 auto;
      }
      [data-home-hero-title] {
        margin: 1.5rem 0 0;
        max-width: 64rem;
        font-size: clamp(2.5rem, 7vw, 5.5rem);
        line-height: 0.95;
        letter-spacing: -0.04em;
        font-weight: 900;
      }
      [data-home-hero-copy] {
        max-width: 42rem;
        margin-top: 1.25rem;
        font-size: 1rem;
        line-height: 1.75;
        color: #475569;
      }
      [data-home-hero-form] {
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 26px 70px rgba(15, 23, 42, 0.10);
        backdrop-filter: blur(18px);
      }
      [data-home-primary-cta] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        border-radius: 9999px;
        background: #0f172a;
        color: #ffffff;
      }
      @media (min-width: 1024px) {
        [data-home-hero] { padding: 2rem 2rem 3rem; }
        [data-home-hero-grid] { grid-template-columns: 1.08fr 0.92fr; align-items: start; }
      }
    </style>

    <title>
      Tiny Steps Online English School | 1:1 Phonics, Grammar & Public Speaking for Kids (3–12)
    </title>
    <meta
      name="description"
      content="Premium 1:1 online English classes for ages 3–12. IB-aligned phonics, grammar and public speaking with kind live mentors, AI-guided practice, and simple weekly progress updates for parents. Book a free assessment class."
    />
    <meta
      name="keywords"
      content="online English classes for kids, phonics classes, grammar classes, public speaking for children, personalized learning"
    />
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tiny Steps Online School" />
    <meta
      property="og:title"
      content="Tiny Steps Online English School | 1:1 Phonics, Grammar & Public Speaking for Kids (3–12)"
    />
    <meta
      property="og:description"
      content="Premium 1:1 online English classes for ages 3–12. IB-aligned phonics, grammar and public speaking with kind live mentors, AI-guided practice, and simple weekly progress updates for parents. Book a free assessment class."
    />
    <meta property="og:url" content="https://tinystepslearning.com/" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="https://tinystepslearning.com/og-image.png" />
    <meta
      property="og:image:alt"
      content="Tiny Steps Learning - Online English Classes for Kids"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Tiny Steps Online English School | 1:1 Phonics, Grammar & Public Speaking for Kids (3–12)"
    />
    <meta
      name="twitter:description"
      content="Premium 1:1 online English classes for ages 3–12. IB-aligned phonics, grammar and public speaking with kind live mentors, AI-guided practice, and simple weekly progress updates for parents. Book a free assessment class."
    />
    <meta name="twitter:image" content="https://tinystepslearning.com/og-image.png" />

    <!-- Favicons (Google-friendly: prefer ICO/PNG over SVG) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
