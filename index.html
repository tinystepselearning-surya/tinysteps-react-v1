    <script>
      (() => {
        const pathname = window.location.pathname.replace(/\/+$/, '') || '/';
        if (pathname !== '/curriculum') return;

        const params = new URLSearchParams(window.location.search);
        const course = String(params.get('course') || '').toLowerCase();
        let tab = String(params.get('tab') || '').toLowerCase();

        if (!tab && course) {
          if (course.includes('grammar')) tab = 'grammar';
          else if (course.includes('speaking')) tab = 'speaking';
          else tab = 'phonics';
        }

        const programmeOwners = {
          phonics: '/phonics',
          grammar: '/grammar',
          speaking: '/speaking',
        };
        const target = programmeOwners[tab];
        if (target) window.location.replace(target);
      })();
    </script>

    <script>
